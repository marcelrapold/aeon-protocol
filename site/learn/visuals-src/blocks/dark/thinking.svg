      <radialGradient id="glow-block-thinking-dark" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#9282F7" stop-opacity="0.42"/>
        <stop offset="65%" stop-color="#9282F7" stop-opacity="0.10"/>
