<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
    <defs>
      <linearGradient id="bg-quantumcomputinglight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#F1F1F7"/>
      </linearGradient>
      <radialGradient id="glow-quantumcomputinglight" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#4839D0" stop-opacity="0.42"/>
        <stop offset="65%" stop-color="#4839D0" stop-opacity="0.10"/>
