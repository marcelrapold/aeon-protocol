<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
    <defs>
      <linearGradient id="bg-stoicismdark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#07070A"/>
        <stop offset="100%" stop-color="#111119"/>
      </linearGradient>
      <radialGradient id="glow-stoicismdark" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#9282F7" stop-opacity="0.42"/>
        <stop offset="65%" stop-color="#9282F7" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#9282F7" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="accent-stoicismdark" cx="42%" cy="36%" r="64%">
        <stop offset="0%" stop-color="#FA42FA" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#FA42FA" stop-opacity="0.20"/>
      </radialGradient>
      <linearGradient id="edge-stoicismdark" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#9282F7" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#FA42FA" stop-opacity="0.75"/>
      </linearGradient>
      <pattern id="dots-stoicismdark" width="28" height="28" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" opacity="0.065"/>
      </pattern>
      <filter id="blur-stoicismdark" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="28"/>
      </filter>
      <filter id="shadow-stoicismdark" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="18" stdDeviation="24"
          flood-color="#000000" flood-opacity="0.24"/>
      </filter>
      <filter id="glowfx-stoicismdark" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="7" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
