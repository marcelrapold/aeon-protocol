name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 05:17 UTC. Off the hour, so this repository does not queue behind
    # everyone else's midnight cron.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Secrets are scanned across history, not just the tip: a key that
          # was committed and then deleted is still a leaked key.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint --version
      - name: Lint every workflow
        # actionlint also runs shellcheck over each run block, which is why the
        # scripts in this repository's workflows set -euo pipefail.
        run: ./actionlint

  pinned-actions:
    name: actions pinned to a digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject any action referenced by a mutable tag
        run: |
          set -uo pipefail
          # A tag can be moved by whoever owns the action; a commit digest
          # cannot. Every third-party action here is pinned to a digest with
          # the human-readable version in a trailing comment.
          unpinned=$(grep -rnE '^\s*(-\s*)?uses:' .github/workflows \
            | grep -vE 'uses:\s*\./' \
            | grep -vE '@[0-9a-f]{40}\b' || true)
          if [ -n "$unpinned" ]; then
            echo "$unpinned"
            echo "::error::every action must be pinned to a full 40-character commit digest"
            exit 1
          fi
          echo "Every action is pinned to a commit digest."
