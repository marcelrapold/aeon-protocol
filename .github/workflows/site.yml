name: site

on:
  push:
    branches: [main]
    paths: ["site/learn/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/learn/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site/learn

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: site/learn/.nvmrc
          cache: npm
          cache-dependency-path: site/learn/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
