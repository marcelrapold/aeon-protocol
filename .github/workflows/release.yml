name: release

# An agent fetches the specification from an immutable tag, so a release that
# pins its URLs inconsistently would serve two specification versions at once.
# Nothing is published until every pin site agrees with the tag being released.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify, for example v0.4.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then tag="$INPUT_TAG"; else tag="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - run: npm ci
      - name: Run the full specification gate
        run: npm run validate
      - name: Verify every pinned URL agrees with itself
        run: node scripts/bump-version.mjs --check
      - name: Verify the pinned version is the tag being released
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          declared=$(grep -oE 'export const VERSION = "v[0-9]+\.[0-9]+\.[0-9]+"' site/learn/lib/content.ts \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          echo "tag=$TAG declared=$declared"
          if [ "$declared" != "$TAG" ]; then
            echo "::error::the repository declares $declared but $TAG is being released."
            echo "::error::run 'node scripts/bump-version.mjs $TAG' and commit before tagging."
            exit 1
          fi
      - name: Verify the changelog documents this version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qE "^## +\[?${TAG#v}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for ${TAG#v}."
            exit 1
          fi
          echo "CHANGELOG.md documents ${TAG#v}."

  publish:
    name: publish the release
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extract the changelog section for this version
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v version="${TAG#v}" '
            $0 ~ "^## +\\[?" version "\\]?" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          wc -l release-notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
