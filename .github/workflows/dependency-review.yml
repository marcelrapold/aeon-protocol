name: dependency review

# Runs on pull requests only: it compares the dependency manifests of the base
# and head commits, so it needs two commits to compare.

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - .github/workflows/dependency-review.yml

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The repository is Apache-2.0. A network-copyleft dependency would
          # be incompatible with how the specification and the site are
          # distributed; the weaker copyleft licences are left to review.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
