major_controversies:

  - id: fama-versus-shiller
    question: Are asset prices rational?
    positions:
      - 'The efficiency reading (fama-1970, fama-1991, fama-1998, fama-2014): prices reflect available information given some model of expected returns. Long-horizon predictability is real and is compensation for time-varying risk: required returns are high in bad times when investors are least able to bear risk, which makes valuation ratios forecast returns without anyone being irrational. Evidence: short-horizon returns are close to unforecastable, professional performance is indistinguishable from chance after costs, apparent overreaction and underreaction occur at similar rates, and long-horizon anomalies are sensitive to the benchmark model. Fama also concedes, in his own words, that efficiency is a model and therefore false in the strict sense, and that it cannot be tested on its own.'
      - 'The behavioural reading (shiller-1981, shiller-2003, shiller-2014, shleifer-2000): prices move far more than fundamentals justify, valuation ratios forecast returns because sentiment mean-reverts, and systematic psychological error plus limited arbitrage is sufficient for prices to depart from value for long periods. Evidence: excess volatility, long-horizon reversal, documented mispricings such as the 3Com and Palm carve-out that require no asset pricing model to identify, and the survival of noise traders.'
      - 'The counterattack on the volatility evidence (marsh-merton-1986, kleidon-1986): dividend smoothing and non-stationarity break the variance-bounds test as originally constructed, so excess volatility as a proof of irrationality does not stand. Both camps now largely work with the log-linear present-value identity instead, which is why the surviving statement is that discount rates move a great deal.'
      - 'The reframing (cochrane-2011): both sides accept that most price-ratio variation is expected-return variation, so the question is no longer whether returns are predictable but why the discount rate moves. Stated this way, the dispute is about the source of time-varying expected returns, and there is no agreed test that separates rational risk premia from sentiment.'
      - 'The mediating position (lo-2004): efficiency varies over time with competition and capital, so both camps describe real states of the same market at different moments. Criticised for accommodating any observation.'
    status: >-
      Genuinely unresolved, and the discipline said so institutionally by
      awarding the 2013 prize to Fama, Hansen and Shiller together, with a
      background document that states the interpretation of long-horizon
      predictability is open. Teach both readings at full strength, teach the
      joint hypothesis as the reason the dispute cannot be settled by pointing
      at data, and label any confident verdict — in either direction — as
      contested.

  - id: is-efficiency-testable
    question: Can the efficient market hypothesis be tested at all?
    positions:
      - 'The joint-hypothesis objection (fama-1970, fama-1991, roll-1977): every test requires a model of expected returns, so a rejection is ambiguous between a wrong model and an inefficient market. Fama concludes in 1991 that market efficiency per se is not testable.'
      - 'The unfalsifiability charge: if no evidence can refute it, the hypothesis is not scientific in the usual sense, and functions instead as a modelling convention or a null against which other work is measured.'
      - 'The defence: the hypothesis makes many testable auxiliary predictions — that published strategies decay, that professional performance resembles chance after costs, that prices adjust quickly to announcements — and these are testable, tested, and largely borne out. A framework can be productive without being refutable as a whole.'
      - 'The model-free exception (lamont-thaler-2003): a small number of mispricings involve the same cash flows priced two ways at once, which needs no expected-return model. These cases escape the joint hypothesis, they are real, and they are rare and small relative to market capitalisation.'
    status: >-
      The joint-hypothesis problem is not disputed by anyone; what people
      dispute is what it implies. The productive stance is to treat efficiency
      as a benchmark whose deviations are measured for a purpose, which is what
      Fama's own late writing says, rather than as a proposition to be affirmed
      or denied.

  - id: risk-or-mispricing
    question: Are the value and momentum premia compensation for risk or evidence of error?
    positions:
      - 'Risk (fama-french-1993, fama-french-1996, fama-french-2015): the premia are compensation for exposure to priced sources of common variation, consistent with a multi-factor equilibrium. Supporting evidence: the factors have common covariance structure, appear across markets, and the pattern in returns matches the pattern in the factor loadings.'
      - 'Mispricing (lakonishok-shleifer-vishny-1994, de-bondt-thaler-1985): investors extrapolate recent performance, overpricing glamour and underpricing value; value portfolios do not appear riskier on several direct measures, including performance in bad states.'
      - 'The momentum problem: momentum is robust across markets and asset classes and has no accepted risk story, which is awkward for the risk camp; it also requires high turnover and crashes sharply at reversals, which is awkward for anyone claiming a free lunch. Fama and French explicitly exclude it from both their models while acknowledging its empirical strength.'
      - 'The institutional reading (frazzini-pedersen-2014): some premia trace to constraints rather than to either risk or psychology — leverage limits push investors into high-beta assets, producing a flat security market line that is neither a risk premium nor an error.'
    status: >-
      Unresolved and probably not resolvable by the same data, since the two
      accounts predict the same average returns. The distinguishing predictions
      concern behaviour after publication, behaviour in different institutional
      settings, and correlation with plausible bad states, and the evidence
      there is mixed.

  - id: factor-replication
    question: How many published factors are real?
    positions:
      - 'The multiple-testing critique (harvey-liu-zhu-2016): given hundreds of tested factors, the conventional two-standard-error threshold guarantees false positives; a much higher hurdle is required, and most published findings likely do not clear it.'
      - 'The replication audit (hou-xue-zhang-2020): under a uniform protocol with microcaps controlled and value weighting, a majority of several hundred anomalies fail to reach conventional significance, with failures concentrated in liquidity and trading-friction categories.'
      - 'The defence (jensen-kelly-pedersen-2023): using international data and a hierarchical model that respects the joint structure of factors, most factors do replicate and travel out of sample; the failures reported elsewhere follow from protocol choices, particularly the treatment of small stocks and the independence assumption across factors.'
      - 'The decay finding (mclean-pontiff-2016), which both sides claim: anomaly returns fall substantially after publication, most where arbitrage is cheapest. Efficiency reads this as the mechanism working; the other side reads it as confirmation the pre-publication return was genuine.'
    status: >-
      Live and methodological. The raw data are shared; the disagreement is
      about statistical protocol, which is why it has not converged. The
      defensible working position is that a small number of factors — market,
      value, momentum, profitability, low risk — have survived the most
      scrutiny, that the long tail is unreliable, and that any specific factor
      claim should be checked against the current replication literature rather
      than against its original paper.

  - id: active-versus-passive
    question: Can active management add value, and for whom?
    positions:
      - 'The arithmetic (sharpe-1991, ellis-1975, french-2008): the average active dollar must underperform the average passive dollar by the difference in costs, by the definition of an average. Independent of efficiency, skill, or market conditions.'
      - 'The definitional objection (pedersen-2018): indices change, shares are issued and retired, so a passive investor must trade and passive holdings are not exactly the market. The identity is therefore approximate, and the average active manager can add value in principle.'
      - 'The empirical record (spiva, fama-french-2010, barras-scaillet-wermers-2010, carhart-1997): a majority of active funds underperform appropriate benchmarks over long horizons after costs and after survivorship correction; persistence in net outperformance is weak; the number of funds with alpha sufficient to cover costs is small.'
      - 'The equilibrium reading (berk-green-2004): skill exists, but flows chase it until scale exhausts it and fees capture it, so zero net alpha to investors is what a market with skilled managers looks like. This reconciles the absence of persistence with the existence of skill, and it changes what the evidence means without changing the evidence.'
      - 'The practitioner counterposition (buffett-1984): a group of investors from one intellectual tradition outperformed over decades, which is not what chance produces. The standard reply is that the group was selected after the fact with no ex ante specification, which is the multiple-testing problem in narrative form. Buffett''s own public wager against a portfolio of funds of hedge funds, reported in the Berkshire Hathaway letters, points the other way.'
      - 'The Grossman-Stiglitz floor: some active management has to be profitable or prices would carry no information, so the equilibrium quantity of active management is positive and the question is what it is, not whether it is zero.'
    status: >-
      The arithmetic is not in dispute and the boundary conditions on it are
      real but narrow. The empirical record on net returns is one of the more
      consistent findings in finance. What remains genuinely open is whether
      specific investors can identify skill in advance, and the honest answer is
      that no published method does so reliably.

  - id: do-bubbles-exist
    question: Is a bubble a meaningful category?
    positions:
      - 'The sceptical position (associated with Fama, stated in fama-2014 and in interviews): the term is used without an operational definition, is applied only after a decline, and would need to predict something to earn its place. Ex post identification is not evidence.'
      - 'The historical position (kindleberger-aliber-1978, shiller-2000, galbraith-1955): episodes recur with a recognisable structure — displacement, credit expansion, euphoria, distress, revulsion — often enough that treating each as unique is a failure of pattern recognition.'
      - 'The operational answer (greenwood-shleifer-you-2019): make it testable. Large industry-level price run-ups do not reliably predict low subsequent returns, which supports the sceptics, but do sharply raise the probability of a crash, and several characteristics of the run-up sharpen the prediction. Both sides get part of what they claimed.'
      - 'The definitional escape: some episodes involve prices that violate simple no-arbitrage relations, such as a parent trading below the value of its stake in a subsidiary. These are mispricings by any standard and do not require the word bubble.'
    status: >-
      Resolved to the extent that the concept has been given testable content,
      unresolved as to whether bubbles can be identified in advance with enough
      confidence to act on. Note the asymmetry a learner should carry: a
      probability shift in the chance of a crash is a real finding and is not
      the same thing as a timing signal.

  - id: what-counts-as-risk
    question: Is risk the variance of returns?
    positions:
      - 'The mean-variance position (markowitz-1952, sharpe-1964): variance is the workable summary, it makes portfolio construction tractable, and it captures most of what matters for a diversified holder over a moderate horizon.'
      - 'The fat-tail objection (mandelbrot-1963, taleb-2007): return distributions have heavy tails, so variance is a poor summary, the sample maximum understates the possible, and estimates from calm periods mislead. Volatility clustering means realised risk is regime-dependent.'
      - 'The axiomatic objection (artzner-delbaen-eber-heath-1999): value at risk, the industry standard, is not subadditive, so it can register diversification as an increase in risk, and it is silent about the size of losses beyond the threshold.'
      - 'The goal-relative objection: for an investor with a liability or a spending need, risk is shortfall against that need, and sequence of returns matters more than dispersion. Markowitz raised semi-variance himself in 1959, so this is not an outside criticism.'
      - 'The behavioural objection: investors experience drawdown and permanent loss, not variance, and a measure that treats an upside surprise as equivalent to a downside one describes no one''s preferences.'
    status: >-
      The critiques are accepted in the literature and variance remains the
      operating measure in most practice, because the alternatives are harder to
      estimate and to optimise. The defensible teaching position is that
      variance is a convention with known defects rather than a definition, and
      that the appropriate measure depends on what the investor is trying not to
      have happen.

  - id: did-2008-refute-efficiency
    question: What did the financial crisis show about market efficiency?
    positions:
      - 'It did not (the efficiency reading): prices fell because a severe recession was arriving, which is what prices are supposed to do. The critics who claim vindication did not produce dated forecasts either, and hindsight identification of a bubble is not a test.'
      - 'It did (the mispricing reading): housing and structured credit prices were detached from any defensible fundamental for years while short-selling was expensive or impossible, and the incentives of originators and raters were public knowledge.'
      - 'The crisis was about risk models, not prices (danielsson-et-al-2001, artzner-delbaen-eber-heath-1999, haldane-2009): correlation assumptions, thin-tailed distributions and quiet-period calibration failed simultaneously across institutions running similar models. This is a separate failure from mispricing and it is the one with the clearest documentary record and the clearest ex ante warnings.'
      - 'The reflexive reading (mackenzie-2006, danielsson-et-al-2001): risk is endogenous. When many institutions use similar models they respond to the same signals at the same time, so the models create the correlated selling they are meant to measure.'
    status: >-
      The efficiency question is not settled by the episode and both camps
      claimed vindication, which is itself informative. The model-risk finding
      is the part that is not disputed, and it is the more useful thing for a
      learner to take from 2008.

  - id: tulipmania-interpretation
    question: What actually happened in the Dutch tulip trade, and why does the story survive?
    positions:
      - 'The received narrative (mackay-1841): a national mania in which people of all classes traded houses for bulbs, followed by ruin, bankruptcies and lasting damage to the Dutch economy. Sourced largely from moralising pamphlets published shortly after the event.'
      - 'The economic revision (garber-1989): the observed prices for rare bulbs are broadly consistent with the fundamentals of a novel luxury good that propagates slowly, and comparable prices for new varieties recur in later, undisputed flower markets. The episode is not obviously irrational.'
      - 'The contract revision (thompson-2007): the late spike reflects a change in the legal character of outstanding contracts toward option-like obligations settleable for a small percentage, which raises quoted prices mechanically without any change of belief.'
      - 'The archival revision (goldgar-2007): the participants were a limited network of merchants, artisans and connoisseurs in a few towns; the notarial, court and estate records show no mass bankruptcies, no suicides, no economy-wide damage. The genuine crisis was social — trust, honour, and what it meant that value could be conjured and dissolved — and the ruin narrative was manufactured by the pamphlet literature and inherited uncritically.'
    status: >-
      The popular narrative is not supported by the archival record; that much
      is established. The three revisions disagree with each other about what
      the price data mean, and Garber's rationality claim is separate from and
      more contested than Goldgar's finding about consequences. Teach the
      distinction precisely, because collapsing them is how a correction becomes
      the next myth.

  - id: passive-growth-effects
    question: Does the growth of index investing damage price discovery?
    positions:
      - 'The theoretical concern (grossman-stiglitz-1980): price discovery is costly and someone must be paid for it, so there is some passive share beyond which prices carry less information.'
      - 'The scale answer: the quantity that matters for price discovery is trading volume by informed participants, not assets held, and active trading volume remains large. Sharpe''s arithmetic also implies that as passive grows, the remaining active competition is against a smaller pool of the least skilled, which is a self-limiting process.'
      - 'The index-effect concern: inclusion and exclusion move prices, weights are set by rules rather than by analysis, and flows into capitalisation-weighted vehicles mechanically favour what has already risen.'
      - 'The governance concern: a small number of asset managers hold large voting stakes across most large listed companies, which raises questions about stewardship and common ownership that are separate from the price-discovery question and are argued in law and economics as well as in finance.'
    status: >-
      Live, and unusually polluted by commercial interest on both sides —
      active managers have an incentive to find harm and index providers an
      incentive to find none. Empirical work exists and is not conclusive. A
      research agent should treat any strong claim here as requiring a current
      source, and should check who published it.

common_misconceptions: see common-misconceptions.yaml

practical_applications:
  - reading a fund factsheet correctly — separating the benchmark, the net
    return, the fee stack, the time period chosen and what happened to funds
    that no longer exist
  - assessing any track record — asking what is missing from the sample, how
    many alternatives were tried, and whether the period was chosen after the
    result was known
  - constructing a diversified holding — understanding what diversification
    removes, what it cannot remove, and why correlations in the spreadsheet are
    not the correlations in a crisis
  - matching horizon to holdings — sequence-of-returns risk for anyone
    withdrawing, and the difference between a long horizon improving odds and
    removing risk
  - evaluating a claimed strategy — checking whether it survives transaction
    costs, capacity, taxes and out-of-sample periods before checking whether the
    backtest is impressive
  - corporate finance and capital budgeting — the capital asset pricing model
    remains the standard cost-of-equity convention despite its empirical record,
    which is worth knowing when a discount rate is being defended
  - >-
    risk management in any organisation — the 2008 failure modes generalise to
    thin-tailed assumptions, quiet-period calibration, correlated models, and
    treating a rating or a score as a measurement
  - reading financial journalism — distinguishing a price move with an
    explanation attached from a price move that was explained afterwards
  - resisting narrative — recognising the survivorship structure of investment
    books, seminars and social media, where the base rate of confident failure
    is invisible by construction
  - policy and regulation — capital requirements, disclosure rules and
    fiduciary standards all encode a position on which of these disputes is
    correct

failure_modes:
  - learning one camp and mistaking it for the subject, which is the most common
    failure here and the reason the controversies section exists
  - stating the efficient market hypothesis as "prices are always right" and
    then refuting that instead of the actual claim
  - forgetting the joint hypothesis, so that every anomaly is read as proof of
    inefficiency and every non-anomaly as proof of efficiency
  - treating diversification as risk elimination, and being surprised when a
    diversified portfolio falls with everything else
  - reading a backtest as evidence without asking how many specifications were
    tried before that one was reported
  - inferring skill from a track record short enough that chance produces it
    routinely, in a population large enough that someone had to win
  - confusing a probability shift with a prediction, in either direction
  - using a historical worst case as a bound on the possible
  - taking the US equity record as the base rate for equity investing
  - repeating a historical anecdote from a popular book without checking whether
    a historian has examined it
  - treating a compelling explanation of a past episode as a method for
    identifying the next one
  - mistaking educational content about markets for advice about a person's
    circumstances, which is a category error rather than a mistake of degree

open_questions:
  - why discount rates move as much as they do, and whether the movement is
    rational time-varying risk compensation or systematic sentiment — the
    unresolved centre of the subject
  - how many factors are real, and by whose statistical protocol
  - whether the equity premium is explained by habit, rare disasters,
    behavioural loss aversion, survivorship in the data, or something not yet
    proposed
  - whether skill in active management can be identified in advance rather than
    only after the fact
  - what share of passive ownership, if any, degrades price discovery, and what
    concentrated voting power in a few managers implies for corporate governance
  - whether the historical equity premium and the long-run superiority of
    equities survive better nineteenth-century data
  - what replaces value at risk in practice, and whether any risk measure can
    survive the endogeneity problem that arises when everyone uses it
  - how machine learning changes the cross-section — whether the predictability
    it finds is new information, a more efficient search over the same noise, or
    a new source of correlated model failure
  - whether the retail-flow episodes of the 2020s and the growth of
    zero-commission trading changed the microstructure enough to alter any of
    the classical results, which is recent enough that live research is required

current_state: >-
  The descriptive apparatus is mature and largely uncontested. Short-horizon
  returns are close to unforecastable; valuation ratios forecast long-horizon
  returns; costs subtract with certainty and compound; diversification removes
  idiosyncratic risk and not systematic risk; correlations rise in extreme
  declines; return distributions have heavy tails; most individual stocks
  underperform Treasury bills over their lifetimes while a small minority
  produce the aggregate gain; and the majority of active funds underperform
  their benchmarks net of costs over long horizons. None of this is disputed by
  either camp. What is disputed is the interpretation of the second item, and
  that dispute is the field. Fama's position that time-varying rational risk
  premia explain long-horizon predictability and Shiller's position that
  sentiment does are both held by serious people with the same data in front of
  them, and the joint-hypothesis problem is the reason no experiment settles it.
  Meanwhile the factor literature is conducting a public argument about its own
  replicability, with a critique and a defence both published in top journals
  and neither withdrawn; risk management after 2008 has moved toward expected
  shortfall and stress testing without solving the endogeneity problem that
  common models create; and passive investing has grown from a minority practice
  into a structural feature whose consequences for price discovery are argued
  and not measured. The honest current state is that the field knows a great
  deal about what does not work and comparatively little about why prices move
  as much as they do.
