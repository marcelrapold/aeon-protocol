# ÆON deep-dive library — investing-and-markets — knowledge map
# Prior structure for the MAPPING phase (products/learn/knowledge-map.md).
# Test it against live research; it does not substitute for mapping.
# Source ids resolve via canonical-sources.yaml.
#
# Educational content, not investment advice.
#
# Epistemic note: this subject has a specific and unusually well-documented
# shape. A descriptive layer is close to settled — short-horizon returns are
# hard to forecast, costs subtract with certainty, diversification reduces one
# kind of risk and not another, return distributions have heavy tails. A causal
# and interpretive layer is not settled at all: whether the predictability that
# does exist is compensation for risk or evidence of mispricing has no agreed
# answer, and the discipline made that explicit in 2013 by awarding one prize
# jointly to Eugene Fama and Robert Shiller. The controversies section here is
# therefore the centre of the subject rather than an appendix, and a package
# that resolved the Fama-Shiller question would be introducing an error rather
# than removing one.

package: investing-and-markets
version: 1

overview: >-
  An asset price is a claim on uncertain future cash flows, and it equals the
  expectation of those cash flows discounted at some rate. Everything
  contested in the subject follows from the two unobservables in that sentence.
  Since Bachelier in 1900 it has been known that price changes look close to
  random; Samuelson showed in 1965 that this is what competition among informed
  traders would produce, and Fama in 1970 organised it into the efficient market
  hypothesis and its weak, semi-strong and strong forms. Markowitz in 1952 made
  diversification a covariance calculation and separated the risk that can be
  removed from the risk that cannot; Sharpe in 1964 turned that separation into
  a pricing statement, and the empirical failure of that statement produced the
  factor literature, its replication problems, and no successor everyone
  accepts. Against this, Shiller in 1981 showed that prices move far more than
  the subsequent path of dividends can justify, De Bondt and Thaler showed that
  extreme past performance reverses, and the limits-of-arbitrage literature
  explained why obvious mispricings can persist. The two readings of the same
  evidence — time-varying rational risk premia against systematic mispricing —
  are what the 2013 prize honoured together. Underneath the dispute sit facts
  neither side denies and both find inconvenient for the popular story: costs
  compound against the investor with certainty, the average actively managed
  dollar must underperform the average passive dollar after costs by
  arithmetic, most individual stocks underperform Treasury bills over their
  lifetimes, and the normal distribution understates extreme moves badly enough
  to have broken the risk models of 2008.

prerequisites:
  - arithmetic of percentages, compounding, and the difference between an
    arithmetic and a geometric average return
  - basic probability — expectation, variance, correlation, and what a
    distribution is
  - what a share, a bond and a fund are, in the sense of who owes what to whom
  - enough statistical literacy to read a regression coefficient and a standard
    error, and to know why a p-value from a search over many hypotheses means
    less than one from a single pre-specified test
  - no prior finance course is assumed; economic-psychology and business-cycles
    deepen two of the strands but neither is required

historical_context:
  - period: 1900-1952
    events: >-
      Bachelier models speculative prices as a random process in 1900 and is
      ignored. Working (1934) shows cumulated random numbers produce
      chart-like patterns; Cowles (1933) audits professional forecasters and
      finds no demonstrable skill; Kendall (1953) looks for cycles in share
      prices and finds a random wanderer. Meanwhile Graham and Dodd publish
      Security Analysis (1934) and found the opposite tradition: prices as
      offers to be judged against value.
  - period: 1952-1970
    events: >-
      Markowitz (1952) turns diversification into mathematics; Tobin (1958)
      separates the risky portfolio from the risk appetite; Sharpe (1964),
      Lintner (1965) and Mossin (1966) derive the capital asset pricing model;
      Samuelson (1965) supplies the theory linking competition to randomness;
      Fama (1965) documents both the random walk and the fat tails, and Fama,
      Fisher, Jensen and Roll (1969) invent the event study. Fama (1970)
      consolidates it all into the three forms of market efficiency. Jensen
      (1968) finds mutual funds do not beat the benchmark net of fees.
  - period: 1971-1985
    events: >-
      The theory becomes an industry: the first institutional index accounts in
      the early 1970s, Vanguard's retail index fund in 1976, and the Black and
      Scholes option formula (1973) arriving months before the Chicago Board
      Options Exchange opens. Then the trouble starts. Roll (1977) shows the
      capital asset pricing model may be untestable; Basu (1977) and Banz (1981)
      find anomalies; Grossman and Stiglitz (1980) show perfect efficiency is
      self-defeating; Shiller (1981) and LeRoy and Porter (1981) find excess
      volatility; De Bondt and Thaler (1985) find overreaction; Mehra and
      Prescott (1985) find the equity premium is too large to explain.
  - period: 1986-1999
    events: >-
      The two programmes formalise against each other. Marsh and Merton (1986)
      and Kleidon (1986) attack the volatility tests; Black's Noise address
      (1986) concedes prices may be within a factor of two of value; Fama and
      French (1992, 1993) replace beta with three factors and interpret the
      anomalies as risk; Lakonishok, Shleifer and Vishny (1994) interpret the
      same premium as extrapolation error; Jegadeesh and Titman (1993) document
      momentum, which neither camp explains comfortably. Long-Term Capital
      Management fails in 1998 with two Nobel laureates on its board. Shleifer
      and Vishny (1997) explain why arbitrage does not fix everything.
  - period: 2000-2008
    events: >-
      The dot-com peak and collapse, with Shiller's Irrational Exuberance
      published at the top and Lamont and Thaler (2003) documenting a mispricing
      that needs no asset pricing model to see. The Malkiel and Shiller
      exchange in the 2003 Journal of Economic Perspectives symposium states
      both positions cleanly. Index funds grow steadily; hedge fund assets grow
      faster. Danielsson and co-authors (2001) and Rajan (2005) warn that risk
      models understate crisis risk and that incentives encourage tail-risk
      taking, and are largely not acted on.
  - period: 2008-2013
    events: >-
      The global financial crisis destroys confidence in the risk apparatus:
      correlations converge, value at risk models calibrated on quiet data
      fail together, and the Financial Crisis Inquiry Commission reports in
      2011 with two dissents. Cochrane's 2011 presidential address reframes the
      field around discount rates and names the factor zoo. In 2013 the Nobel
      committee awards one prize to Fama, Hansen and Shiller, stating in its own
      background document that the interpretation of long-horizon
      predictability is unresolved.
  - period: 2014-present
    events: >-
      Two developments run in parallel. Passive investing moves from a minority
      practice to a structural feature of markets, crossing roughly half of US
      fund assets around the end of the decade, which raises new and unsettled
      questions about price discovery and ownership concentration. And the
      factor literature turns on itself: Harvey, Liu and Zhu (2016) apply
      multiple-testing corrections, McLean and Pontiff (2016) show anomalies
      decay after publication, Hou, Xue and Zhang (2020) fail to replicate a
      majority under a common protocol, and Jensen, Kelly and Pedersen (2023)
      reply that most factors do replicate under a different method. Verify
      current passive market share, current SPIVA results, and the state of the
      replication argument in live research rather than from this package.

core_concepts:

  # --- What a price is ------------------------------------------------------

  - id: price-as-discounted-expectation
    definition: >-
      A financial asset is a claim on future cash flows, and its price is the
      expectation of those cash flows discounted at a rate that compensates for
      time and risk. Two unobservables sit inside it: expected cash flows and
      the discount rate. Every dispute in this package is ultimately about
      which of the two is moving when a price moves, and no observation
      separates them without a model. The Campbell-Shiller identity makes the
      constraint precise: a high price relative to dividends must forecast
      either higher dividend growth or lower future returns.
    depends_on: []
    sources: [cochrane-2005, campbell-shiller-1988, cochrane-2011]

  - id: risk-and-expected-return
    definition: >-
      Higher expected return is compensation for bearing risk that others do
      not wish to bear; it is not a reward for effort, cleverness or courage.
      This has a hard consequence people resist: an investment with a higher
      expected return is one with a worse distribution of possible outcomes in
      the states of the world that matter, and there is no arrangement that
      raises expected return without adding some exposure. The disagreement in
      the field is not about the principle but about which exposures are priced
      and by how much.
    depends_on: [price-as-discounted-expectation]
    sources: [markowitz-1952, sharpe-1964, cochrane-2005]

  - id: arithmetic-and-geometric-returns
    definition: >-
      Wealth compounds multiplicatively, so the growth rate an investor
      actually experiences is the geometric mean, which is always below the
      arithmetic mean when returns vary, and the gap widens with volatility. A
      fifty percent loss requires a hundred percent gain to recover. This is
      arithmetic rather than theory, and it is why advertised average returns,
      dollar-weighted returns and realised terminal wealth are three different
      numbers.
    depends_on: [risk-and-expected-return]
    sources: [dichev-2007, bogle-2014]

  # --- Efficiency -----------------------------------------------------------

  - id: random-walk-and-martingale
    definition: >-
      If all knowable information is in the price, the next change is
      unforecastable — not because markets are chaotic but because forecastable
      changes would already have been made. Samuelson's result. The precise
      modern statement is a martingale with respect to an information set
      rather than a strict random walk, which matters because a martingale
      allows the volatility clustering and the drift that the data plainly show.
    depends_on: [price-as-discounted-expectation]
    sources: [samuelson-1965, bachelier-1900, kendall-1953, working-1934]

  - id: three-forms-of-efficiency
    definition: >-
      Fama's classification by information set. Weak form: prices already
      reflect the history of prices, so past price patterns carry no exploitable
      information. Semi-strong form: prices reflect all publicly available
      information, so trading on published news or accounts earns nothing
      abnormal. Strong form: prices reflect all information including private,
      which Fama himself treated as a benchmark that is known to fail — insider
      trading is profitable, which is why it is illegal. The three are nested
      and are tested by different methods: return predictability, event studies,
      and studies of insiders and specialists.
    depends_on: [random-walk-and-martingale]
    sources: [fama-1970, fama-1991, fama-fisher-jensen-roll-1969]

  - id: joint-hypothesis-problem
    definition: >-
      The load-bearing idea of the whole subject, and the one most often
      skipped. To say a return is abnormal one must say what normal is, which
      requires a model of expected returns. Any test of efficiency is therefore
      a simultaneous test of efficiency and of that model, and a rejection never
      says which one failed. Fama states this in 1970, sharpens it in 1991 to
      the conclusion that market efficiency per se is not testable, and repeats
      it in his Nobel lecture. Roll's critique is the specific case for the
      capital asset pricing model: the true market portfolio is unobservable, so
      the test is about the proxy. The problem cuts both ways — it protects
      efficiency from refutation and equally protects any anomaly from being
      explained away.
    depends_on: [three-forms-of-efficiency, risk-and-expected-return]
    sources: [fama-1970, fama-1991, roll-1977, fama-2014]

  - id: grossman-stiglitz-equilibrium
    definition: >-
      Information gathering is costly, so if prices reflected everything, no one
      would pay to gather anything, and prices would then reflect nothing. A
      market must be inefficient enough to pay the people who make it efficient.
      This converts the question from a yes-or-no into a magnitude, gives
      active management a theoretical reason to exist in equilibrium, and sets
      a ceiling on how much of it can be profitable at once.
    depends_on: [three-forms-of-efficiency]
    sources: [grossman-stiglitz-1980, black-1986]

  - id: limits-of-arbitrage
    definition: >-
      The claim that mispricings would be corrected assumes arbitrageurs with
      unlimited capital, unlimited patience and no agency relationship. Real
      arbitrage is delegated: when a mispricing widens the arbitrageur loses
      money and loses capital, precisely when the opportunity is best. Add
      short-sale constraints, borrowing costs and career risk and prices can
      stay wrong for years. This is why "someone would have arbitraged it away"
      is not an argument, and why observed mispricings such as the Palm and 3Com
      carve-out could persist in plain sight.
    depends_on: [grossman-stiglitz-equilibrium]
    sources: [shleifer-vishny-1997, delong-shleifer-summers-waldmann-1990, lamont-thaler-2003, brunnermeier-nagel-2004]

  # --- Portfolio theory and risk -------------------------------------------

  - id: diversification
    definition: >-
      Combining imperfectly correlated assets reduces portfolio variance
      without a proportionate reduction in expected return. Markowitz made this
      exact: the portfolio's variance depends on the covariances between
      holdings, not on the average variance of the holdings, so the useful
      question about any new position is what it correlates with rather than how
      risky it is alone. The benefit is real and it is bounded, and the bound is
      the next concept.
    depends_on: [risk-and-expected-return]
    sources: [markowitz-1952, evans-archer-1968, statman-1987]

  - id: systematic-versus-idiosyncratic-risk
    definition: >-
      Total risk splits into a part specific to the asset and a part shared with
      everything else. The specific part shrinks toward zero as holdings are
      added; the shared part does not shrink at all, and a fully diversified
      portfolio still carries the whole of it. The pricing implication is the
      core of the capital asset pricing model: only the undiversifiable part
      earns compensation, because the diversifiable part can be removed for
      free. Two consequences follow that people find unwelcome. Bearing
      idiosyncratic risk is uncompensated, and no amount of diversification
      protects against a market-wide decline.
    depends_on: [diversification]
    sources: [sharpe-1964, markowitz-1952, campbell-lettau-malkiel-xu-2001]

  - id: correlation-instability
    definition: >-
      The covariances that diversification depends on are estimated from the
      past and are not stable. Correlations between equity markets and between
      portfolios rise in extreme downward moves and do not rise symmetrically in
      extreme upward moves. Diversification therefore delivers least when it is
      needed most, and this is a documented distributional property established
      with extreme value methods, not a saying about one crisis.
    depends_on: [systematic-versus-idiosyncratic-risk]
    sources: [longin-solnik-2001, ang-chen-2002]

  - id: mean-variance-optimisation-and-estimation-error
    definition: >-
      The efficient frontier is computed from expected returns, variances and
      covariances that must be estimated. Optimisers concentrate weight in
      whatever inputs were most overestimated, which makes them error
      maximisers, producing extreme and unstable allocations. Equal weighting
      has proved hard to beat out of sample. The practical repairs — shrinkage,
      constraints, starting from market-implied returns and tilting only where a
      view exists — are all ways of admitting that the inputs are noisy.
    depends_on: [diversification]
    sources: [michaud-1989, demiguel-garlappi-uppal-2009, black-litterman-1992, markowitz-1959]

  - id: capm-and-beta
    definition: >-
      In equilibrium, expected return is linear in beta, the sensitivity of an
      asset to the market portfolio, and nothing else is priced. Beautiful,
      universally taught, and empirically in trouble almost immediately: the
      estimated relation is too flat, and after size and book-to-market are
      included beta adds little in the US cross-section. Roll's critique says
      this may never have been a fair test. The model survives as a conceptual
      device and as a cost-of-capital convention rather than as a description of
      returns.
    depends_on: [systematic-versus-idiosyncratic-risk, joint-hypothesis-problem]
    sources: [sharpe-1964, lintner-1965, black-jensen-scholes-1972, fama-french-1992, fama-french-2004, roll-1977]

  - id: multifactor-models
    definition: >-
      If one factor is not enough, use several. Fama and French add size and
      value in 1993 and profitability and investment in 2015; Carhart adds
      momentum in 1997; arbitrage pricing theory provides the general licence,
      and Merton's intertemporal model provides the risk story. What a factor
      model does uncontroversially is provide a benchmark, which is why fund
      performance is now reported against one. What it does controversially is
      claim the factor premia are compensation for risk rather than evidence of
      systematic error.
    depends_on: [capm-and-beta]
    sources: [fama-french-1993, fama-french-1996, fama-french-2015, carhart-1997, ross-1976, merton-1973-icapm]

  - id: anomalies
    definition: >-
      Documented patterns in average returns that a benchmark model does not
      explain. The durable ones: value, momentum, size (weaker after
      publication), profitability, low volatility and low beta. Momentum is the
      most robust across markets and asset classes and has no accepted risk
      explanation, which is uncomfortable for the efficiency reading; it also
      crashes sharply at reversals, which is uncomfortable for anyone trading
      it.
    depends_on: [multifactor-models]
    sources: [jegadeesh-titman-1993, basu-1977, banz-1981, novy-marx-2013, frazzini-pedersen-2014, asness-moskowitz-pedersen-2013]

  - id: factor-zoo-and-replication
    definition: >-
      Hundreds of factors have been published. When the scale of the search is
      taken into account, the conventional significance threshold is far too
      permissive, and under a common replication protocol a majority of
      published anomalies fail. Anomaly returns also decay after publication,
      most where trading is cheapest. A vigorous defence argues that the
      replication failures are largely artefacts of protocol choices and that
      most factors do survive. The dispute is about statistical method rather
      than about the data, which is why it has not resolved.
    depends_on: [anomalies]
    sources: [harvey-liu-zhu-2016, hou-xue-zhang-2020, mclean-pontiff-2016, jensen-kelly-pedersen-2023, cochrane-2011]

  # --- The behavioural side -------------------------------------------------

  - id: excess-volatility
    definition: >-
      If price is a forecast of discounted future dividends, price should be
      smoother than the after-the-fact perfect-foresight value, because a
      forecast is smoother than what it forecasts. Shiller found the opposite by
      a wide margin in US data from 1871, and LeRoy and Porter found it
      independently. The counterattack — dividend smoothing by managers, and
      non-stationarity of the dividend process — is serious and the tests in
      their original form did not survive it intact. What did survive, and is
      now mainstream, is the finding underneath: valuation ratios forecast
      long-horizon returns, so something in the discount rate moves a great
      deal. Whether that something is rational time-varying risk aversion or
      swings of sentiment is the entire Fama-Shiller dispute.
    depends_on: [price-as-discounted-expectation, joint-hypothesis-problem]
    sources: [shiller-1981, leroy-porter-1981, marsh-merton-1986, kleidon-1986, campbell-shiller-1988, cochrane-2011]

  - id: overreaction-and-mean-reversion
    definition: >-
      Portfolios of extreme past losers subsequently outperform extreme past
      winners over three-to-five-year horizons. De Bondt and Thaler motivated
      the test from the psychological finding that people overweight recent
      evidence, and this is where behavioural finance became an empirical
      programme rather than a critique. The standard reply is that loser
      portfolios are riskier or smaller in ways the benchmark missed, which is
      the joint hypothesis again — and notice that long-horizon reversal and
      medium-horizon momentum are opposite-signed effects that coexist, which
      neither camp explains elegantly.
    depends_on: [excess-volatility, anomalies]
    sources: [de-bondt-thaler-1985, lakonishok-shleifer-vishny-1994, fama-1998]

  - id: investor-behaviour
    definition: >-
      Documented in trading records rather than in laboratories: investors sell
      winners far more readily than losers (the disposition effect), net returns
      fall monotonically with turnover, overconfidence proxies predict excess
      trading, and dollar-weighted returns are materially below buy-and-hold
      returns because of when money enters and leaves. These findings are about
      the investor rather than about the price, which is why both camps accept
      them. The economic-psychology package carries the underlying bias
      literature and its replication status.
    depends_on: [overreaction-and-mean-reversion]
    sources: [odean-1998, barber-odean-2000, barber-odean-2001, dichev-2007, kahneman-tversky-1979]

  # --- Costs and the case for indexing --------------------------------------

  - id: cost-arithmetic
    definition: >-
      Sharpe's two pages. Divide all holdings into passively and actively
      managed. Passive holders collectively hold the market, so the active
      holders collectively hold the market too, and their aggregate gross return
      before costs must equal the market return. After costs, the average
      actively managed dollar must underperform the average passively managed
      dollar by the difference in costs. The argument uses only the definition
      of an average and does not require market efficiency, skill or its
      absence. Its force is that it holds regardless of what one believes about
      efficiency. The serious objection is definitional rather than logical:
      indices change composition and issuance changes the market, so tracking an
      index requires trading and passive holdings are not exactly the market.
    depends_on: [risk-and-expected-return]
    sources: [sharpe-1991, pedersen-2018, ellis-1975, french-2008, bogle-2014]

  - id: fees-and-compounding
    definition: >-
      A recurring annual cost compounds against the investor with the same
      mathematics that compounds returns for them, so a percentage that sounds
      small consumes a share of terminal wealth that is not small. The full cost
      stack is larger than the headline expense ratio: trading costs, bid-ask
      spreads, cash drag, taxes on realised gains, and any sales load. Costs are
      the only input to the outcome that is known in advance.
    depends_on: [cost-arithmetic, arithmetic-and-geometric-returns]
    sources: [bogle-2014, french-2008, bogle-1999]

  - id: performance-persistence
    definition: >-
      Whether past outperformance predicts future outperformance. Short-horizon
      persistence exists in the data and is largely attributable to momentum
      exposure and to expenses; longer-horizon persistence in net returns is
      weak, and the more reliable persistence is at the bottom, where high costs
      keep bad funds bad. Bootstrap and false-discovery methods find few funds
      with alpha sufficient to cover costs, and a larger group with genuinely
      negative alpha. Berk and Green supply the interpretation that unsettles
      both camps: if skill is real but scarce and money chases it until scale
      exhausts it, zero net alpha is what a rational market with skilled
      managers looks like.
    depends_on: [cost-arithmetic, factor-zoo-and-replication]
    sources: [carhart-1997, fama-french-2010, barras-scaillet-wermers-2010, berk-green-2004, hendricks-patel-zeckhauser-1993, spiva, jensen-1968]

  - id: survivorship-and-selection-bias
    definition: >-
      Funds that close or merge leave the database; markets that were
      expropriated leave the historical series; strategies that failed are not
      published; investors who lost do not write books. Every one of these
      removals biases the surviving record upward, and survivorship alone can
      manufacture apparent persistence out of pure noise. This is the single
      most useful habit in the subject: before assessing any track record, ask
      what is missing from the sample and why.
    depends_on: [performance-persistence]
    sources: [brown-goetzmann-ibbotson-ross-1992, elton-gruber-blake-1996, jorion-goetzmann-1999, brunnermeier-nagel-2004]

  - id: market-timing
    definition: >-
      Shifting between assets on a forecast of direction. The evidence is
      unfavourable on three separate grounds: forecasting records are poor from
      Cowles onward; the accuracy required to beat buy-and-hold after costs and
      taxes is high because the distribution of returns is concentrated in few
      days; and the dollar-weighted evidence shows that in practice flows move
      the wrong way. The familiar "missing the best days" demonstration is a
      real illustration of concentration but a weak argument on its own, since
      the best and worst days cluster in the same volatile periods and the
      symmetric calculation of missing the worst days is rarely shown.
    depends_on: [cost-arithmetic, three-forms-of-efficiency]
    sources: [cowles-1933, dichev-2007, spiva, barber-odean-2000]

  # --- Fat tails and model risk ---------------------------------------------

  - id: fat-tails
    definition: >-
      Return distributions have far more mass in the extremes than a normal
      distribution allows. Mandelbrot documented it in 1963 and Fama reported
      it in his own 1965 dissertation, so it is not a heterodox discovery.
      Consequences: the sample standard deviation is a poor summary, the largest
      observation in a sample carries a large share of the total variation, the
      historical worst case understates the possible worst case, and estimates
      converge slowly, so a long quiet record is weak evidence of safety.
      Volatility also clusters, so calm and turbulent periods come in runs.
    depends_on: [risk-and-expected-return]
    sources: [mandelbrot-1963, fama-1965, mandelbrot-hudson-2004, taleb-2007]

  - id: what-is-risk
    definition: >-
      Variance is the tractable definition, not an agreed one. Markowitz
      himself discussed semi-variance. The competing candidates are permanent
      loss of capital, shortfall against a liability or a goal, drawdown depth
      and duration, and the probability of ruin. The choice is not cosmetic: a
      strategy that is attractive on variance can be unattractive on shortfall,
      and measures based on a symmetric distribution treat an upward surprise
      as identical to a downward one. Value at risk fails the subadditivity
      axiom, so it can penalise diversification, and says nothing about the size
      of losses beyond its threshold.
    depends_on: [fat-tails, systematic-versus-idiosyncratic-risk]
    sources: [artzner-delbaen-eber-heath-1999, markowitz-1959, sharpe-1966, jorion-2006]

  - id: model-risk
    definition: >-
      Every risk number is the output of a model with assumptions, estimated on
      a sample. The assumptions that failed in 2008 are known and specific:
      normal or thin-tailed return distributions, correlations estimated from
      quiet periods, historical samples containing no analogous event, ratings
      treated as inputs rather than as opinions, and the reflexive problem that
      when many institutions run similar models they sell the same assets at the
      same moment, so measured risk is endogenous to the measurement. Warnings
      to this effect were published in 2001 and 2005 and were available in
      advance.
    depends_on: [what-is-risk, correlation-instability]
    sources: [danielsson-et-al-2001, rajan-2005, haldane-2009, fcic-2011, artzner-delbaen-eber-heath-1999, mackenzie-2006]

  - id: leverage-and-ruin
    definition: >-
      Leverage multiplies returns in both directions and converts a temporary
      adverse move into a permanent loss by forcing liquidation at the worst
      price. It is the mechanism common to Long-Term Capital Management in
      1998, the shadow banking system in 2008 and most individual disasters. The
      distinguishing feature of a levered position is not a worse expected
      return but the possibility of an outcome from which recovery is
      impossible, which is why a rule about survival is not the same kind of
      rule as a rule about optimisation.
    depends_on: [fat-tails, model-risk]
    sources: [lowenstein-2000, fcic-2011, kindleberger-aliber-1978]

  # --- Bubbles and history --------------------------------------------------

  - id: bubbles
    definition: >-
      A price far above any defensible estimate of fundamental value, sustained
      by the expectation of selling to someone else. The definition is the
      problem: fundamental value is unobservable, so identifying a bubble
      requires the model whose correctness is in question — the joint hypothesis
      once more. Fama's position is that the term has no operational content
      unless it predicts something. Greenwood, Shleifer and You supplied the
      operational version: large industry-level run-ups do not reliably lower
      expected returns but do sharply raise the probability of a crash, which is
      a testable and tested claim.
    depends_on: [limits-of-arbitrage, excess-volatility]
    sources: [greenwood-shleifer-you-2019, kindleberger-aliber-1978, shiller-2000, ofek-richardson-2003, garber-1989]

  - id: mania-anatomy
    definition: >-
      Kindleberger's sequence, built on Minsky: a displacement that plausibly
      justifies new optimism, credit expansion that funds it, euphoria and the
      entry of inexperienced participants, distress as insiders exit, then
      revulsion and forced selling. The frame is genuinely useful for reading an
      episode and genuinely weak for timing one, because every stage is
      identified after the fact. Credit is the load-bearing element and the link
      to the business-cycles package, where the same claim is tested on long-run
      panel data.
    depends_on: [bubbles]
    sources: [kindleberger-aliber-1978, galbraith-1955, chancellor-1999, reinhart-rogoff-2009]

  - id: reading-financial-history
    definition: >-
      Financial history is transmitted through stories, and the stories are
      selected for usefulness rather than accuracy. Tulip mania is the standard
      case: the narrative every popular finance book repeats descends from
      Mackay in 1841, who drew on moralising pamphlets, and archival research
      does not support the economy-wide ruin it describes. The habit to build is
      to ask of any historical claim in a finance book where the author got it,
      and whether anyone has checked.
    depends_on: [mania-anatomy, survivorship-and-selection-bias]
    sources: [goldgar-2007, garber-1989, mackay-1841, thompson-2007, lewis-2010]

  # --- Long-run evidence ----------------------------------------------------

  - id: equity-premium
    definition: >-
      Equities have historically returned more than short-term government debt
      by a margin no standard model explains with plausible risk aversion. The
      candidate resolutions — habit formation, rare disasters, myopic loss
      aversion, survivorship in the data used — are all live and none is
      agreed. Practically, the premium is the reason for holding equities at
      all, its size is uncertain, and the historical estimate is upward-biased
      by studying the most successful market.
    depends_on: [risk-and-expected-return, survivorship-and-selection-bias]
    sources: [mehra-prescott-1985, benartzi-thaler-1995, dimson-marsh-staunton-2002, jorion-goetzmann-1999, mcquarrie-2024]

  - id: horizon-and-time-diversification
    definition: >-
      Over longer horizons the probability of an equity shortfall falls while
      the magnitude of a possible shortfall grows. Samuelson showed repetition
      does not make a gamble safe; Bodie priced the insurance against
      underperforming the risk-free rate and found the cost rises with horizon.
      Meanwhile the record contains markets that were closed, expropriated or
      taken to zero. The honest statement is that a long horizon improves the
      odds and does not remove the risk, and that whose horizon it is matters,
      since sequence of returns dominates outcomes for anyone withdrawing.
    depends_on: [equity-premium, fat-tails]
    sources: [samuelson-1963, bodie-1995, jorion-goetzmann-1999, siegel-1994, dimson-marsh-staunton-2002]

  - id: concentration-versus-breadth
    definition: >-
      The cross-sectional distribution of long-run stock returns is extremely
      skewed: most individual US stocks underperformed one-month Treasury bills
      over their lifetimes, and aggregate net wealth creation traces to a small
      minority. A concentrated portfolio therefore has a median outcome far
      below its mean outcome, and owning the whole market is the way to be
      guaranteed to hold the few that matter. This is the strongest empirical
      argument for breadth, and it is independent of any view on efficiency.
    depends_on: [diversification, fat-tails]
    sources: [bessembinder-2018, dimson-marsh-staunton-2002]

  - id: markets-versus-the-economy
    definition: >-
      Economic growth and equity returns are not the same thing and are not
      reliably positively related across countries. Growth that is anticipated
      is already priced; growth financed by issuing new shares dilutes existing
      holders; and the listed market is not the economy, since it excludes
      private and state firms and includes foreign earnings. The practical
      consequence is that a correct macroeconomic forecast is not by itself an
      investment edge.
    depends_on: [price-as-discounted-expectation]
    sources: [ritter-2005, dimson-marsh-staunton-2002]

  - id: passive-and-price-discovery
    definition: >-
      Index investing is a free ride on the price discovery performed by active
      traders, which Grossman and Stiglitz showed must be paid for by someone.
      As the passive share rises, the open questions are how much active
      trading price discovery actually requires, whether index inclusion effects
      distort relative prices, and what concentrated voting power in a few asset
      managers implies for governance. There is a live empirical literature and
      no settled answer, and the topic attracts strong claims from parties with
      commercial interests on both sides.
    depends_on: [cost-arithmetic, grossman-stiglitz-equilibrium]
    sources: [grossman-stiglitz-1980, pedersen-2018, sharpe-1991]

  - id: adaptive-markets
    definition: >-
      Lo's mediating proposal: efficiency is not a fixed property of a market
      but varies with the number of competitors, the capital chasing an
      opportunity and the environment, so inefficiencies appear, get competed
      away and can reappear. It fits the pattern of anomalies decaying after
      publication. Hold it with the standard objection attached: a framework
      that accommodates every observation is difficult to test, and
      accommodation is not explanation.
    depends_on: [factor-zoo-and-replication, grossman-stiglitz-equilibrium]
    sources: [lo-2004, mclean-pontiff-2016, lo-mackinlay-1999]

episodes:
  # Four episodes taught as distinct mechanisms rather than four instances of
  # one thing. The contrast is the fastest route to seeing that no single
  # account of how prices go wrong covers all of them.
  - id: tulipmania-1637
    dating: >-
      Dutch bulb trade intensifies from about 1634; the collapse of contract
      prices comes in February 1637.
    mechanics: >-
      Forward contracts on tulip bulbs traded among a network of merchants,
      artisans and connoisseurs in a limited number of Dutch towns, largely in
      taverns and outside the formal exchange, with settlement due at bulb
      lifting in summer. The highest recorded prices attach to a small number of
      rare varieties. When bidding collapsed in February 1637, most contracts
      had never been paid; enforcement was suspended and disputes were later
      settled at a small fraction of contract value.
    competing_readings: >-
      Mackay's moral tale of national ruin (mackay-1841); Garber's argument
      that rare-bulb prices are broadly consistent with the fundamentals of a
      slowly propagated luxury good and that comparable prices recur for novel
      varieties (garber-1989); Thompson's argument that the late spike reflects
      a change in the legal character of the contracts toward option-like
      obligations (thompson-2007); and Goldgar's archival finding that the
      social and economic devastation simply is not in the records, and that the
      real crisis was one of trust, honour and classification (goldgar-2007).
      All three revisions disagree with Mackay and with each other.
    sources: [goldgar-2007, garber-1989, thompson-2007, mackay-1841]

  - id: crash-1929
    dating: 'US peak September 1929; the crash of late October 1929; the market trough in 1932.'
    mechanics: >-
      A speculative rise financed substantially by margin lending, investment
      trusts holding other investment trusts with layered leverage, and a
      reassurance industry that continued to issue confident statements through
      the decline. The crash itself was followed by several false recoveries and
      a much longer decline, which is why the crash and the Depression are two
      events rather than one.
    competing_readings: >-
      Galbraith's account of mania and leverage (galbraith-1955); the monetary
      and banking readings of the Depression that followed, which belong to the
      business-cycles package and attribute the catastrophe to what happened
      after 1929 rather than to the crash itself. The useful lesson for this
      package is narrower and firm: leverage converted a price decline into
      forced selling.
    sources: [galbraith-1955, kindleberger-aliber-1978]

  - id: dot-com-1995-2002
    dating: 'US technology index peak March 2000; trough in 2002.'
    mechanics: >-
      A genuine technological displacement, an unusually large volume of new
      listings with small free floats and staged lock-up expirations, valuation
      by metrics disconnected from cash flows, and short-sale constraints that
      kept pessimists out of the price. The 3Com and Palm carve-out priced the
      parent below the value of its stake in the subsidiary.
    competing_readings: >-
      Mispricing with a concrete mechanism, short-sale constraints and lock-up
      expiry (ofek-richardson-2003, lamont-thaler-2003); feedback between price,
      media and belief (shiller-2000); and the efficiency-side reading that ex
      ante the distribution of outcomes for a genuinely new technology was wide
      enough to justify high prices, with the failures visible only afterwards.
      Brunnermeier and Nagel add the finding that sophisticated investors rode
      the boom rather than correcting it, which damages the assumption that
      smart money enforces value.
    sources: [ofek-richardson-2003, lamont-thaler-2003, brunnermeier-nagel-2004, shiller-2000]

  - id: crisis-2008
    dating: 'US housing peak 2006; credit markets seize from mid-2007; the acute phase September to October 2008.'
    mechanics: >-
      Leverage in a shadow banking system funded by short-term wholesale money,
      securitisation that dispersed and disguised exposure, ratings treated as
      measurements, and risk models whose historical samples contained no
      national house price decline. When the correlation assumption failed,
      instruments rated as nearly riskless defaulted together, and firms running
      similar models sold the same assets simultaneously.
    competing_readings: >-
      Whether the episode refutes market efficiency is genuinely disputed. The
      efficiency reading is that prices fell because a severe recession was
      arriving and no one, including the critics, forecast it with a dated
      claim; the mispricing reading is that housing and credit prices were
      demonstrably detached from fundamentals for years while arbitrage was
      constrained; the model-risk reading, which is separate from both, is that
      the failure was in the risk apparatus rather than in the price. The
      official inquiry itself shipped with two dissents. The business-cycles
      package carries the macroeconomic causation dispute.
    sources: [fcic-2011, danielsson-et-al-2001, rajan-2005, haldane-2009, fama-2014]

mental_models:
  - price equals expected cash flows divided by a discount rate — when a price
    moves, always ask which of the two moved
  - the joint hypothesis — any claim about abnormal returns is also a claim
    about what normal is, and a rejection never says which half failed
  - diversifiable versus undiversifiable — the market pays only for the risk
    that cannot be removed for free
  - the arithmetic of averages — active and passive together are the market, so
    costs decide the aggregate outcome regardless of skill
  - costs are the only certainty in the equation
  - what is missing from this sample, and why was it removed
  - the strategy was found by searching, so ask how many other strategies were
    tried
  - fat tails — the worst thing in the sample is not the worst thing possible
  - correlations are conditional; the ones in a crisis are not the ones in the
    spreadsheet
  - the median outcome and the mean outcome of a skewed distribution are very
    far apart
  - survival first — a levered position has outcomes from which no later
    correctness helps
  - narrative selection — the people who were right write the books, and the
    base rate of confident people who were wrong is invisible
  - two Nobel laureates can read one dataset and disagree, and neither is
    being unreasonable

key_people:
  efficient_markets_and_chicago:
    - 'Eugene F. Fama — the three forms of efficiency, the joint hypothesis, the event study, the three- and five-factor models; Nobel 2013'
    - 'Paul A. Samuelson — why properly anticipated prices fluctuate randomly, and the fallacy of large numbers over long horizons; Nobel 1970'
    - 'Kenneth R. French — the factor models with Fama, the aggregate cost of active investing, and the public data library that made factor research reproducible'
    - 'Michael C. Jensen — fund performance measurement and Jensen''s alpha'
    - 'Richard Roll — the critique that the market portfolio is unobservable, so the model may be untestable'
    - 'Burton G. Malkiel — the popular statement of the efficiency case and its running revision'
    - 'John H. Cochrane — the discount-rate reframing, and the author who named the factor zoo from inside the tradition'
  portfolio_theory_and_asset_pricing:
    - 'Harry Markowitz — mean-variance portfolio selection; Nobel 1990'
    - 'James Tobin — the separation theorem; Nobel 1981'
    - 'William F. Sharpe — the capital asset pricing model, the Sharpe ratio, and the arithmetic of active management; Nobel 1990'
    - 'John Lintner, Jan Mossin & Jack Treynor — independent derivations of the same equilibrium model'
    - 'Stephen A. Ross — arbitrage pricing theory, which frees asset pricing from the market portfolio'
    - 'Robert C. Merton — intertemporal asset pricing, option pricing, and a leading critic of the excess-volatility tests; Nobel 1997'
    - 'Fischer Black & Myron Scholes — option pricing; Black''s Noise address is also the most candid statement of how imprecise efficient prices may be'
    - 'Lars Peter Hansen — the econometrics both camps use, and the distinction between risk inside a model and uncertainty about the model; Nobel 2013'
  behavioural_finance:
    - 'Robert J. Shiller — excess volatility, valuation ratios and long-horizon returns, feedback booms, narrative economics; Nobel 2013 alongside Fama'
    - 'Richard H. Thaler — the Anomalies column, overreaction with De Bondt, the carve-out mispricings; Nobel 2017'
    - 'Werner F. M. De Bondt — the overreaction result that founded the empirical programme'
    - 'Daniel Kahneman & Amos Tversky — prospect theory and the judgment research the field imported; Kahneman Nobel 2002'
    - 'Andrei Shleifer & Robert W. Vishny — the limits of arbitrage, the theoretical core of the behavioural case'
    - 'Terrance Odean & Brad M. Barber — the disposition effect, turnover and overconfidence in real trading records'
    - 'Stephen F. LeRoy — the independent derivation of the variance bounds result'
    - 'Josef Lakonishok — the extrapolation reading of the value premium'
  costs_indexing_and_practice:
    - 'John C. Bogle — the index fund as a retail product, and the full cost stack argument'
    - 'Charles D. Ellis — the loser''s game framing of professional investing'
    - 'Benjamin Graham — margin of safety, Mr Market, and the tradition the efficiency literature was arguing against'
    - 'Warren E. Buffett — the Graham-and-Doddsville argument against the efficiency conclusion, and the public wager against funds of hedge funds'
    - 'David F. Swensen — the endowment model, with its author''s own statement of why it does not transfer to individuals'
    - 'Lasse Heje Pedersen — betting against beta, and the sharpest published objection to Sharpe''s arithmetic'
    - 'Antti Ilmanen & Andrew Ang — the practitioner syntheses of the factor evidence, honest about implementation costs'
  risk_and_fat_tails:
    - 'Benoit Mandelbrot — non-normal returns, volatility clustering, and four decades of dissent from Gaussian finance'
    - 'Nassim Nicholas Taleb — the popular case for tail risk and against models calibrated on quiet periods; substantive and polemical in unequal measure'
    - 'Philippe Artzner, Freddy Delbaen, Jean-Marc Eber & David Heath — coherent risk measures, and the formal defect in value at risk'
    - 'Jón Daníelsson & Hyun Song Shin — endogenous risk, and the warning that common models synchronise selling'
    - 'Raghuram G. Rajan — the 2005 Jackson Hole warning about incentives and tail risk'
    - 'Andrew G. Haldane — the financial system as a network, from the Bank of England'
  historians_of_bubbles:
    - 'Charles P. Kindleberger & Robert Z. Aliber — the recurring anatomy of manias and panics'
    - 'John Kenneth Galbraith — the 1929 narrative and the argument that financial memory is short'
    - 'Anne Goldgar — the archival correction to tulip mania, and the model of how to check a story'
    - 'Peter M. Garber — the fundamentals-based revision of the famous early bubbles'
    - 'Carmen M. Reinhart & Kenneth S. Rogoff — eight centuries of crises and the recurring belief that this time is different'
    - 'Edward Chancellor — the narrative history of speculation'
    - 'Donald MacKenzie — how models changed the markets they claimed to describe'
  mediators_and_measurers:
    - 'Andrew W. Lo — the adaptive markets hypothesis, and the technical evidence against the strict random walk'
    - 'John Y. Campbell — the present-value identity, and the long-horizon predictability evidence both camps use'
    - 'Elroy Dimson, Paul Marsh & Mike Staunton — the survivorship-corrected long-run global return record'
    - 'Hendrik Bessembinder — the skewness of long-run individual stock returns'
    - 'Campbell R. Harvey — the multiple-testing critique of the factor literature, and the gold evidence'
    - 'Kewei Hou, Chen Xue & Lu Zhang — the systematic replication of published anomalies'
    - 'Peter L. Bernstein — the intellectual history of the whole enterprise'

