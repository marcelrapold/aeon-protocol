  - name: Arthur Aron
    contribution: closeness through reciprocal self-disclosure (S26)

historical_context:
  - Weber framed charisma as a form of authority; early psychology treated it as a fixed trait.
  - >-
    Modern research reframed charisma as perception produced by observable,
    trainable signals (Antonakis and colleagues), while social perception
    research converged on warmth and competence as base coordinates.
  - Conversation analysis grew out of 1970s ethnomethodology and supplies the micro-structure (turn-taking, overlap, repair).
  - >-
    The replication crisis pruned popular claims in this space (notably power
    posing), which is why the fixture leans on congruence and behaviour rather
    than display tactics.

current_state:
  - Charismatic signalling is trainable with measurable perception effects; durability and transfer are less settled.
  - Listening and psychological-safety research are active and increasingly central to leadership communication.
  - Emotion-perception universality is genuinely contested (see controversies).

major_controversies:
  - id: emotion-universality
    question: Are facial expressions of emotion universally recognised?
    position: >-
      Basic-emotions program (Ekman & Friesen cross-cultural studies) claims a
      small set of universally recognised expressions.
    counterposition: >-
      Constructionist account (Barrett; Gendron et al., S16) shows recognition
      varies with culture, language and context; universality claims rest
      partly on forced-choice methods.
    status: live scientific controversy; the fixture teaches the cautious reading
    sources: [S16, S15]

  - id: power-posing
    question: Do expansive postures change hormones and outcomes?
    position: 'Carney, Cuddy & Yap (2010): expansive posing raises testosterone, lowers cortisol, increases risk tolerance.'
    counterposition: >-
      Ranehill et al. (2015) failed to replicate the hormonal and behavioural
      effects; first author Carney disavowed the effect in 2016. Cuddy, Schultz
      & Fosse (2018) defend only a felt-power effect.
    status: expansive claims unsupported; the fixture deliberately teaches congruence, not dominance display
    sources: [S14]

  - id: feedback-effectiveness
    question: Does feedback reliably improve performance?
    position: Common management assumption that more feedback is always better.
    counterposition: >-
      Kluger & DeNisi (S17): over one third of feedback interventions worsened
      performance; effects depend on whether attention lands on task or self.
    status: established boundary
    sources: [S17]

  - id: thin-slice-scope
    question: How far do thin-slice judgements carry?
    position: Brief behaviour slices predict social outcomes (S4).
    counterposition: >-
      Effect sizes are modest and domain-dependent; for deception detection,
      Bond & DePaulo (2006) meta-analysis puts accuracy near chance (~54%).
    status: accuracy is real but limited; overinterpretation is the practical failure mode
    sources: [S4, S15]

common_misconceptions: see common-misconceptions.yaml

practical_applications:
  - meetings and structured contribution
  - feedback and difficult conversations
  - negotiation and boundary setting
  - leadership presence and storytelling
  - networking and relationship building

failure_modes:
  - >-
    Knowledge consumption without behavioural repetition — the fixture's own
    rule: "Nichts davon funktioniert als Wissenskonsum."
  - Performing tactics without congruence, which reads as manipulation.
  - Dominance simulation instead of warmth-plus-competence.
  - Overreading single nonverbal signals.
  - Overperforming energy; calibration beats intensity.

open_questions:
  - Cross-cultural generality of warmth/competence weighting and of specific operators.
  - Durability and transfer of short training interventions to spontaneous behaviour.
  - How presence signals change over video and asynchronous channels.
  - Individual differences in trainability of charismatic signalling.
