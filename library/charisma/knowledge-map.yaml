  - name: Nalini Ambady, Robert Rosenthal
    contribution: thin-slice judgement research (S4)
  - name: Alexander Todorov
    contribution: trait inference from faces and voices (S5, S6)
  - name: Albert Bandura
    contribution: self-efficacy and social cognitive theory (S9)
  - name: Amy Edmondson
    contribution: psychological safety in teams (S10)
  - name: Elizabeth Morrison
    contribution: employee voice and silence (S11)
  - name: Melanie Green, Timothy Brock
