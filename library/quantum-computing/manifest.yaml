  - 'David Deutsch: Quantum Theory, the Church-Turing Principle and the Universal Quantum Computer (1985)'
  - 'Peter W. Shor: Polynomial-Time Algorithms for Prime Factorization and Discrete Logarithms on a Quantum Computer (1994/1997)'
  - 'Lov K. Grover: A Fast Quantum Mechanical Algorithm for Database Search (1996)'
  - 'Charles H. Bennett, Ethan Bernstein, Gilles Brassard & Umesh Vazirani: Strengths and Weaknesses of Quantum Computing (1997)'
  - 'Ethan Bernstein & Umesh Vazirani: Quantum Complexity Theory (1997)'
  - 'Peter W. Shor: Scheme for Reducing Decoherence in Quantum Computer Memory (1995)'
  - 'Andrew M. Steane: Error Correcting Codes in Quantum Theory (1996)'
  - 'Dorit Aharonov & Michael Ben-Or: Fault-Tolerant Quantum Computation with Constant Error Rate (1997/2008)'
  - 'Alexei Yu. Kitaev: Fault-Tolerant Quantum Computation by Anyons (2003)'
  - 'David P. DiVincenzo: The Physical Implementation of Quantum Computation (2000)'
  - 'Michael A. Nielsen & Isaac L. Chuang: Quantum Computation and Quantum Information (2000/2010)'
  - 'Austin G. Fowler, Matteo Mariantoni, John M. Martinis & Andrew N. Cleland: Surface Codes — Towards Practical Large-Scale Quantum Computation (2012)'
  - 'John Preskill: Quantum Computing in the NISQ Era and Beyond (2018)'
  - 'Frank Arute et al.: Quantum Supremacy Using a Programmable Superconducting Processor (2019)'
  - 'Craig Gidney & Martin Ekerå: How to Factor 2048 Bit RSA Integers in 8 Hours Using 20 Million Noisy Qubits (2021)'
  - 'Torsten Hoefler, Thomas Häner & Matthias Troyer: Disentangling Hype from Practicality — On Realistically Achieving Quantum Advantage (2023)'
  - 'Google Quantum AI: Quantum Error Correction Below the Surface Code Threshold (2024)'

