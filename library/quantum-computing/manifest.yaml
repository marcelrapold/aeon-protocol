prerequisites: []

# Packages that share load-bearing structure with this one. cryptography
# supplies the hardness assumptions Shor's algorithm dissolves (integer
# factoring, discrete logarithms) and the lattice- and hash-based replacements
# NIST standardised in 2024, so the harvest-now-decrypt-later question is
# answered there rather than guessed here. information-theory supplies
# entropy, channel capacity and error-correcting codes in their classical
# form — the quantum versions in this package are generalisations that mostly
# preserve the shape and occasionally break it.
related_packages:
  - cryptography
  - information-theory
