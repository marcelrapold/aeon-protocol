# ÆON deep-dive library — quantum-computing — package manifest
# Shape: schemas/topic-package.schema.json
# Related packages: cryptography (library/cryptography/) carries the systems
# whose security assumptions Shor's algorithm attacks and the post-quantum
# replacements now standardised; information-theory (library/information-theory/)
# supplies the classical entropy, capacity and coding vocabulary that quantum
# information generalises — and hastings-2009 there is the point where the
# classical structure stops surviving the generalisation. See related_packages.

id: quantum-computing
name: Quantum Computing

version: 1

description: >-
  What a quantum computer is, what is proved about its power, and what has
  actually been built. The speedup lives in interference — amplitudes that
  cancel on wrong answers and reinforce on right ones — not in trying every
  branch at once, and the amplitude-to-outcome bottleneck is why the known
  algorithms are few and structured rather than general. From Feynman's 1982
  simulation argument and Deutsch's 1985 universal quantum Turing machine,
  through the algorithmic core (Deutsch-Jozsa, Simon, Shor 1994, Grover 1996)
  and the BBBV limit that bounds unstructured search at quadratic, to the
  discovery that decoherence is survivable (Shor 1995, Steane 1996, the
  threshold theorem) and the surface-code engineering programme that followed.
  Grounded in the measured record: the DiVincenzo criteria, the NISQ diagnosis,
  the supremacy and advantage claims with their classical rebuttals, the
  2023-2025 below-threshold error-correction results, and the resource
  estimates that separate a cryptographically relevant machine from the ones
  that exist.

domains:
  - quantum physics
  - computational complexity theory
  - quantum information theory
  - algorithms
  - error correction and fault tolerance
  - device physics and engineering
  - cryptography
  - computational chemistry and materials science

canonical_sources:
