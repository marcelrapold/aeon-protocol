# ÆON deep-dive library — quantum-computing — common misconceptions
# Feeds the misconception slot of the knowledge map (MAPPING) and the boundary
# step of sessions (products/learn/session.md, "what it does NOT prove").
# Source ids resolve via canonical-sources.yaml; supplementary citations are
# named inline. Each item names the concept it distorts (knowledge-map.yaml).
#
# Statuses: debunked · debunked-as-stated (kernel of truth, claim false as
# popularly made) · boundary-correction (real effect, popular reading
# overshoots) · contested-correction (correction itself carries open debate).
#
# Note on tone and on standing. This subject carries more distortion per unit
# of coverage than anything else in the library, and almost none of it comes
# from the researchers. The corrections below are the field's own — Aaronson
# wrote the standard refutation of the parallelism story, Preskill named the
# limits of the present era, Bennett, Bernstein, Brassard and Vazirani proved
# that brute-force search is capped, and Google's own team published the
# obstruction to the NISQ algorithm family. Correcting these claims is not
# scepticism about quantum computing; it is what people who work on quantum
# computing say. The intuitions behind several of them are also reasonable
# first guesses from an honest reading of popular physics, and the corrections
# draw boundaries rather than mock.

package: quantum-computing
version: 1

misconceptions:
  - id: tries-all-answers-at-once
    claim: >-
      A quantum computer tries all possible answers simultaneously and picks
      the right one, so it solves anything with a large search space
      instantly.
    status: debunked
    distorts: interference-as-the-mechanism
    origin: >-
      A half-true picture of superposition, repeated in almost every popular
      article and most corporate explainers: a register of n qubits really
      does hold amplitudes on all two-to-the-n bit strings at once, and the
      obvious next sentence — so it evaluates the function on all of them and
      returns the good one — is never said out loud by the physics. The
      many-worlds framing, which Deutsch himself advances (deutsch-1985),
      makes the wrong reading feel authorised.
    correction: >-
      The superposition half is right and the extraction half is where the
      claim collapses. You can apply a function to a register in superposition
      and obtain a state carrying amplitudes for every input-output pair. Then
      you measure, and you get exactly one of them, chosen at random according
      to the squared magnitude of its amplitude, with the rest destroyed. If
      the amplitudes are uniform, that is an expensively built coin flip and
      no better than guessing. Holevo's bound makes the accounting explicit:
      n qubits deliver at most n classical bits per transmission, no matter
      how many amplitudes they carry. The actual mechanism is interference.
      Amplitudes are complex numbers and can cancel, which is the one thing
      classical probability cannot do — nothing is ever less likely because
      there are more ways for it to happen. An algorithm earns its speedup by
      arranging the unitary operations so that contributions to wrong answers
      destructively interfere and contributions to the right answer reinforce,
      concentrating amplitude before the measurement. That arrangement is only
      known to be constructible when the problem has exploitable structure:
      hidden periodicity for Shor (shor-1994), the promise structure in
      Deutsch-Jozsa (deutsch-jozsa-1992), and a slow rotation toward the
      marked item for Grover (grover-1996). The decisive evidence against the
      parallelism reading is a theorem, not a preference: for unstructured
      search, no quantum algorithm can beat order square-root-of-N queries
      (bbbv-1997), which is exactly the bound you would not expect if the
      machine could test every candidate at once. Aaronson's one-sentence
      version, on the masthead of his blog and in his Scientific American
      article, is the formulation to memorise — quantum computers would not
      solve hard search problems instantaneously by simply trying all possible
      solutions at once (aaronson-2008-limits).
    evidence: [bbbv-1997, aaronson-2008-limits, deutsch-jozsa-1992, aaronson-2013-democritus]

  - id: quantum-breaks-all-encryption
    claim: Quantum computers will break all encryption, and nothing will be private.
    status: debunked-as-stated
    distorts: cryptographic-impact-and-post-quantum-migration
    origin: >-
      A real and important result — Shor's polynomial-time factoring
      (shor-1994) — flattened by headlines into a general statement about
      cryptography, helped along by the security industry's interest in
      urgency and by the genuine strangeness of a result that makes a
      thirty-year-old infrastructure obsolete.
    correction: >-
      Three separate corrections, and the claim survives none of them intact.
      First, scope: Shor's algorithm attacks the number-theoretic public-key
      family — RSA, finite-field Diffie-Hellman, elliptic-curve key exchange
      and signatures — because all of them reduce to hidden-period problems.
      That is a large and load-bearing part of deployed cryptography, and it
      is not all of it. Second, symmetric cryptography and hash functions face
      only Grover's quadratic speedup, which halves the effective key length
      in the exponent — AES-256 still faces roughly two-to-the-128 operations,
      and doubling parameters restores any margin. The practical erosion is
      smaller even than that arithmetic suggests, because Grover's iterations
      are inherently sequential and parallelise badly, which is why NIST's
      own post-quantum call framed attack costs with an explicit depth limit.
      Third, the replacements exist and are standardised: NIST published
      ML-KEM, ML-DSA and the hash-based SLH-DSA in August 2024 after an
      eight-year open competition (nist-fips-203-2024), and hybrid key
      exchange combining a classical scheme with ML-KEM has been shipping in
      major browsers and protocols since 2023. And the machine is not close:
      the 2021 reference estimate for RSA-2048 was twenty million physical
      qubits running eight hours (gidney-ekera-2021), against hardware with
      hundreds of physical qubits and one logical qubit. The genuine
      present-tense threat is narrower and duller than the headline —
      harvest-now-decrypt-later, in which traffic recorded today is decrypted
      after migration lags, which is why Mosca's inequality frames the
      decision without needing a date (mosca-2018). What is being migrated to,
      and the disputes about its parameters, belong to the cryptography
      package.
    evidence: [shor-1994, nist-fips-203-2024, gidney-ekera-2021, mosca-2018]

  - id: just-faster-classical-computers
    claim: >-
      Quantum computers are simply much faster computers — they will speed up
      everything, and one day they will replace the machine on your desk.
    status: debunked
    distorts: bqp-and-the-complexity-landscape
    origin: >-
      The word "computer", plus a decade of coverage that reports quantum
      results with the vocabulary of processor benchmarks, plus the reasonable
      inductive expectation that new computing technology has always meant
      general speed.
    correction: >-
      It is a different model of computation with a different and largely
      incomparable profile, not a faster instance of the same one. On raw
      speed, quantum hardware loses badly: superconducting gate times are in
      the tens of nanoseconds and trapped-ion gates in microseconds, against
      classical operations at gigahertz, and error correction multiplies every
      logical operation by a large constant factor. What a quantum computer
      offers is a better scaling exponent on a short list of problems.
      Montanaro's survey is the inventory to check any claim against
      (montanaro-2016): exponential speedups for period-finding and its
      algebraic relatives and for simulating quantum systems, quadratic
      speedups from amplitude amplification for problems with a checkable
      predicate, and a long tail of heuristics with no proof. For sorting,
      arithmetic, databases, rendering, compilation, web serving and almost
      everything a computer actually does, there is no known quantum speedup
      and no reason to expect one. Two deeper points belong here. Nobody has
      proved that quantum computers are more powerful at all — BQP has not
      been separated from BPP, and the belief rests on the same kind of
      unproven hardness assumptions that classical cryptography rests on
      (bernstein-vazirani-1993). And even a proved asymptotic advantage has to
      survive slow clocks, error-correction overhead and the cost of moving
      data in and out, which is why the practical filter concludes that
      quadratic speedups will not pay for themselves and that credible
      applications need superquadratic advantage on small inputs
      (hoefler-haner-troyer-2023). The realistic picture is a coprocessor: a
      specialised accelerator called by classical software for particular
      subroutines, the way a GPU is, and useless on its own.
    evidence: [montanaro-2016, hoefler-haner-troyer-2023, bernstein-vazirani-1993, aaronson-2013-democritus]

  - id: supremacy-means-useful-now
    claim: >-
      Quantum supremacy was achieved in 2019, so quantum computers now
      outperform classical computers and are ready for real work.
    status: debunked-as-stated
    distorts: quantum-advantage-claims-and-their-verification
    origin: >-
      An unfortunate term meeting an ambitious press cycle. Preskill coined
      "quantum supremacy" for a demonstration that hardware performed a task
      no classical machine can feasibly perform, with no requirement that the
      task be useful (preskill-2012-supremacy); the coverage of
      Google's 2019 result dropped the qualification, and "supremacy" reads
      like a general ranking rather than a single benchmark.
    correction: >-
      The task was random circuit sampling: apply a randomly chosen sequence
      of gates to 53 qubits and sample from the resulting output distribution.
      It computes nothing anyone wants. It was selected precisely because it
      is hard to simulate classically and for no other reason, and the paper
      says so (arute-2019). Nothing about it implies that a useful computation
      is near, and the same processor could not run Shor's algorithm on any
      interesting integer. That much is not disputed by anyone, including
      Google. The second half of the correction is more interesting and is not
      settled. The headline comparison — 200 seconds against an estimated
      10,000 years on the Summit supercomputer — did not survive contact with
      classical algorithm research. IBM showed within days that using
      secondary storage brought the estimate to about two and a half days
      (pednault-2019); a Sunway supercomputer simulation won the 2021 Gordon
      Bell Prize doing it in hours (liu-2021-sunway); and Pan, Chen and Zhang
      matched the sampling task on a cluster of consumer graphics processors
      (pan-chen-zhang-2022). The same pattern then repeated on other
      platforms: photonic advantage claims narrowed under classical spoofing
      algorithms, and IBM's own 2023 utility claim was reproduced classically
      within weeks (kim-2023-utility; tindall-2024). Google's position is that
      the rebuttals attack an estimate rather than the experiment, and that
      later random-circuit runs on larger processors restored a substantial
      gap that no classical method has closed — which is a live argument, not
      a closed one. Two things to carry: the classical baseline is a research
      target that improves when someone is motivated to attack it, so treat
      hardness claims as provisional for at least a year; and a milestone in
      complexity theory is not a product. Harrow and Montanaro set out the
      criteria two years before Sycamore, and identified verification as the
      hard part, which it remains (harrow-montanaro-2017).
    evidence: [arute-2019, pan-chen-zhang-2022, preskill-2012-supremacy, harrow-montanaro-2017, tindall-2024]

  - id: more-qubits-is-the-whole-story
    claim: >-
      Progress is measured in qubits — a 1,000-qubit machine is roughly ten
      times as capable as a 100-qubit one, and we just need to keep adding
      more.
    status: debunked-as-stated
    distorts: surface-codes-and-logical-qubits
    origin: >-
      Qubit count is the one number in the field that is easy to report,
      comparable across vendors and monotonically increasing, so it became the
      scoreboard — assisted by the analogy to transistor counts, where the
      metric genuinely did track capability for decades.
    correction: >-
      Qubit count matters and it is nowhere near sufficient, for three
      separate reasons. First, error rates. Circuit depth is limited by
      accumulated error, so a device with a two-qubit gate infidelity of one
      percent runs out of coherence after roughly a hundred gates regardless
      of how many qubits it has; the useful figures are two-qubit gate
      fidelity, coherence time divided by gate time, and readout error, not
      the qubit total. Second, connectivity. If qubits interact only with
      their neighbours, entangling distant ones costs a chain of swap
      operations, each adding error — which is why 48 logical qubits in 280
      neutral atoms with arbitrary connectivity (bluvstein-2024) is a
      different kind of achievement from the same number of fixed-lattice
      superconducting qubits. Third, and decisively, the logical-versus-
      physical distinction. Algorithms are written for logical qubits;
      hardware provides physical ones; and the surface code's exchange rate is
      hundreds to thousands of physical qubits per logical qubit at realistic
      error rates, plus magic-state factories for the non-Clifford gates that
      make the machine universal (fowler-2012-surface-codes). This is the
      factor of a thousand that makes headline counts and algorithmic
      requirements incommensurable: breaking RSA-2048 needs a few thousand
      logical qubits, which was twenty million physical ones on the 2021
      accounting (gidney-ekera-2021). The industry's own behaviour confirms
      the point — IBM built a 1,121-qubit processor in 2023 and then
      concentrated on smaller devices with better error rates and on error
      correction, because adding noisy qubits to a noisy machine buys nothing.
      The result that actually moved the field was not a qubit count but a
      demonstration that increasing surface-code distance reduces the logical
      error rate, and does so below threshold (google-2024-below-threshold).
      A useful habit when reading any announcement: ask for the two-qubit gate
      fidelity, the connectivity, and whether the qubits quoted are logical or
      physical.
    evidence: [fowler-2012-surface-codes, google-2024-below-threshold, gidney-ekera-2021, bluvstein-2024]

  - id: entanglement-transmits-information
    claim: >-
      Entanglement lets particles influence each other instantly at any
      distance, so quantum computers communicate faster than light and quantum
      networks send messages instantaneously.
    status: debunked
    distorts: entanglement
    origin: >-
      Einstein's phrase "spooky action at a distance" outliving the argument
      it belonged to, plus popular accounts of Bell tests that describe
      correlations as influences. The correlations are real, confirmed to
      extraordinary precision, and honoured with the 2022 physics Nobel to
      Aspect, Clauser and Zeilinger — which makes the overreading
      understandable.
    correction: >-
      Measuring one half of an entangled pair produces a locally random
      outcome with no dependence on what was done to the other half. Nothing
      in the local statistics changes, so nothing can be signalled — this is
      the no-communication theorem, and it is a straightforward consequence of
      the formalism rather than an added postulate. The correlation appears
      only when the two records are brought together, which requires a
      classical channel and therefore travels no faster than light.
      Quantum teleportation, whose name does most of the damage, illustrates
      the rule rather than breaking it: transferring a state consumes an
      entangled pair and requires two classical bits to be sent by ordinary
      means before the receiver can reconstruct anything. Inside a quantum
      computer, entanglement is a computational resource, not a communication
      one: it is necessary for exponential speedup, since product states are
      efficiently simulable classically, and it is not sufficient, because the
      Gottesman-Knill theorem shows that circuits producing enormous
      entanglement from Clifford gates alone can be simulated efficiently on a
      classical machine (Daniel Gottesman, The Heisenberg Representation of
      Quantum Computers, 1998). Both halves of that sentence are worth
      keeping — the first blocks the claim that entanglement is unnecessary,
      the second blocks the claim that it is the whole mechanism.
    evidence: [nielsen-chuang-2000, aaronson-2013-democritus, bernstein-vazirani-1993]

  - id: a-qubit-stores-unlimited-information
    claim: >-
      A qubit holds infinitely many values because its state is a continuum,
      so a handful of qubits can store more data than every hard drive on
      earth.
    status: debunked-as-stated
    distorts: no-cloning-and-the-information-bottleneck
    origin: >-
      A true statement about the state space — specifying a single qubit's
      state exactly requires two real parameters, hence infinite precision —
      combined with the true statement that n qubits carry two-to-the-n
      amplitudes. The storage conclusion follows from neither, but the
      arithmetic is seductive and appears in a great deal of investor-facing
      material.
    correction: >-
      Storage is defined by what can be written and later read, and on that
      measure a qubit holds one bit. Holevo's bound is the exact statement: no
      measurement of n qubits can yield more than n classical bits of
      information about how they were prepared. The continuum in the state
      space is not addressable — you cannot write an arbitrary real number
      into a qubit and read it back, because measurement returns a single
      outcome and destroys the superposition, and repeated preparation and
      measurement recovers the parameters only slowly and approximately. Two
      further constraints close the door. No-cloning forbids copying an
      unknown state, so you cannot make the many copies that estimating those
      parameters would require. And the state is not stable — decoherence
      degrades it in microseconds to seconds depending on the platform, which
      is the opposite of a storage medium. The exponential dimension is real
      and it is genuinely the reason classical simulation of quantum systems
      is hard (feynman-1982); it is simply not a channel into which data can
      be poured. Superdense coding is the honest boundary case and it proves
      the rule: two classical bits can be sent using one qubit, but only by
      consuming a pre-shared entangled pair, so the total qubit budget is two
      either way.
    evidence: [nielsen-chuang-2000, feynman-1982, aaronson-2008-limits]

  - id: no-cloning-forbids-error-correction
    claim: >-
      Quantum states cannot be copied and measuring destroys them, so error
      correction is impossible and noise will always defeat quantum computers.
    status: debunked
    distorts: quantum-error-correction
    origin: >-
      The consensus of the field's own first decade, and a genuinely good
      argument at the time: classical error correction works by redundancy,
      no-cloning forbids redundancy, quantum errors are continuous rather than
      discrete flips, and checking for an error means measuring, which
      collapses the state. Three apparently decisive objections, held by
      serious people until 1995.
    correction: >-
      All three dissolve for the same reason, and Shor's nine-qubit code
      showed how in four pages (shor-1995-qec). Information is spread across
      an entangled block rather than copied into duplicates, which respects
      no-cloning because no individual qubit carries the logical state.
      Syndrome measurement then measures operators that reveal which error
      occurred without revealing anything about the encoded data — the
      measurement collapses the error, not the computation. And that same
      collapse discretises continuous errors: an arbitrary small rotation is
      projected onto a discrete set of correctable errors, so a continuum of
      possible faults reduces to a finite set of corrections. Steane and,
      independently, Calderbank and Shor generalised the construction from
      classical linear codes (steane-1996), Kitaev added topological
      protection (kitaev-2003), and the threshold theorem completed the
      argument: below a fixed physical error rate, arbitrarily long
      computations run with polylogarithmic overhead (aharonov-benor-1997;
      knill-laflamme-zurek-1998). The remaining objection is not about
      possibility but about assumptions — Kalai argues that realistic noise is
      correlated in ways the threshold proofs exclude (kalai-2020) — and that
      objection is now being answered empirically rather than theoretically:
      Google demonstrated logical error rates falling with code distance
      (google-2023-surface-code) and then below-threshold operation, with a
      distance-7 logical qubit outliving its best physical constituent
      (google-2024-below-threshold). What remains genuinely hard is the price,
      not the principle.
    evidence: [shor-1995-qec, steane-1996, aharonov-benor-1997, google-2024-below-threshold]

  - id: annealers-and-networks-are-quantum-computers
    claim: >-
      Quantum computers are already commercially available and in production
      use — companies sell them, and quantum encryption is running on live
      networks.
    status: debunked-as-stated
    distorts: physical-platforms-and-divincenzo-criteria
    origin: >-
      Four different technologies share the adjective, and press coverage
      rarely distinguishes them: universal gate-model quantum computers,
      quantum annealers, quantum key distribution, and quantum sensing. Cloud
      access to real NISQ processors since 2016 adds a further ambiguity —
      the machines are genuinely available and genuinely cannot do what the
      word implies.
    correction: >-
      Separate the four. Gate-model devices are what this package is about;
      several vendors do provide cloud access to real ones, and they are
      NISQ-class — tens to a few hundred noisy physical qubits, no error
      correction at useful scale, and no demonstrated commercial result a
      classical computer could not match (preskill-2018-nisq). Quantum
      annealers, the D-Wave line, are special-purpose hardware for finding low
      states of a particular class of optimisation problem; they are not
      universal, cannot run Shor or Grover, and a decade of careful benchmark
      studies has not established a clear speedup over well-tuned classical
      heuristics — the machines are real, the "quantum computer" label
      oversells what they compute. Quantum key distribution is a
      communications technology deployed on fibre and satellite links: it
      derives security from measurement disturbance rather than computational
      hardness, requires no quantum computer at either end, and its practical
      weaknesses are implementation side channels and the need for trusted
      relays. Quantum sensing — clocks, magnetometers, gravimeters — is the
      most commercially mature of the four and involves no computation at all.
      A working test when reading an announcement: ask which of the four is
      being sold, and for gate-model claims ask for two-qubit gate fidelity
      and whether the qubits are logical or physical. The National Academies
      review is the reference inventory of what each technology can currently
      do (nas-2019).
    evidence: [preskill-2018-nisq, nas-2019, divincenzo-2000, das-sarma-2022]

  - id: quantum-machine-learning-exponential-speedups
    claim: >-
      Quantum computers will give exponential speedups for machine learning,
      optimisation and big-data analytics.
    status: boundary-correction
    distorts: proved-limits-of-quantum-speedup
    origin: >-
      A genuine result — the Harrow-Hassidim-Lloyd algorithm solves certain
      linear systems in time logarithmic in the dimension — read without its
      preconditions, and then generalised into a claim about data-heavy
      industries by people selling access to hardware. The intuition that
      large state spaces suit large datasets is natural and wrong.
    correction: >-
      The correction has three layers and the first is the most useful.
      Asymptotic speedups in this family are stated relative to input access
      assumptions that nobody has built: the linear-systems algorithm needs
      the input loaded into quantum random-access memory, needs the matrix
      sparse and well conditioned, and returns a quantum state from which only
      limited statistics can be extracted — so an exponential speedup on paper
      can be spent entirely on getting the data in and the answer out
      (aaronson-2015-fine-print). Second, several of the claimed speedups
      turned out not to be speedups at all. Granting a classical algorithm
      sampling access comparable to what the quantum version assumed of its
      input, Tang matched the quantum recommendation-systems algorithm to
      polynomial factors, and a family of dequantisation results followed for
      other quantum machine-learning proposals (tang-2019). Third, the
      near-term variational approach has a structural obstruction: gradients
      of randomly initialised parameterised circuits vanish exponentially in
      the qubit count, so training stalls as the machine grows — barren
      plateaus, published by Google's own quantum team (mcclean-2018-barren-plateaus).
      What survives is narrower and real. Grover-derived quadratic speedups
      apply to many optimisation subroutines, and quantum algorithms for
      linear algebra and simulation are proved. But the overhead analysis
      argues that quadratic gains will not repay error-correction costs and
      slow gate times, leaving problems with small inputs and superquadratic
      advantage — which points at simulation and cryptanalysis rather than at
      analytics (hoefler-haner-troyer-2023). The defensible statement: no
      quantum advantage has been demonstrated for any practical machine
      learning or optimisation task, the theoretical case for the exponential
      version is weaker than it was a decade ago, and the question is open
      rather than closed.
    evidence: [aaronson-2015-fine-print, tang-2019, mcclean-2018-barren-plateaus, hoefler-haner-troyer-2023]
