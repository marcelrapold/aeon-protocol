major_controversies:
  - id: recovered-memory
    question: >-
      Can therapy recover accurate memories of forgotten childhood events,
      and what does the attempt risk?
    background: >-
      Through the 1980s and early 1990s, a body of clinical practice held
      that adult symptoms could indicate childhood abuse the person did not
      remember, and that the memories could be recovered through hypnosis,
      guided regression imagery, dream work, symptom checklists and
      persistent questioning. Inner-child and regression-flavoured techniques
      were part of this repertoire. Large numbers of accusations followed,
      many later retracted, alongside the satanic ritual abuse panic and a
      wave of litigation in both directions.
    position: >-
      The memory-science position (loftus-1993, loftus-pickrell-1995,
      scoboria-2017, mcnally-2003, otgaar-2019): memory is reconstructive;
      suggestive procedures reliably produce confident false autobiographical
      memories in a substantial minority of people; trauma is more often
      remembered too well than forgotten; and there is no validated technique
      for distinguishing a recovered true memory from a created one by its
      subjective qualities. Professional bodies converged on guidance against
      memory-recovery practice (brandon-1998, and the American Psychological
      Association and British Psychological Society working groups).
    counterpositions:
      - 'Brewin & Andrews (brewin-andrews-2017): when coding is strict, full false memories occur in a smaller minority than headline figures suggest; the phenomenon is real but its prevalence is overstated. Scoboria and colleagues dispute the reanalysis.'
      - 'Dalenberg et al. (dalenberg-2012): dissociation and dissociative amnesia are trauma-related phenomena with empirical support, not artefacts of suggestion; answered directly by Lynn and colleagues in Psychological Bulletin (2014).'
      - 'Clinical practice: survey evidence (patihis-2014) shows many practising clinicians continue to hold that traumatic memories can be repressed and later accurately recovered, a position most memory researchers reject.'
    what_this_is_not: >-
      Not a claim that childhood abuse is rare, that people who report it are
      lying, or that anyone who found an inner-child book helpful has been
      deceived. Abuse is common and consequential, and most people who
      remember it always remembered it. The dispute is narrowly about
      techniques that aim to produce memories, and about what confidence in a
      memory does and does not establish.
    status: >-
      Settled enough to be a safety rule: do not use techniques designed to
      recover memories, and do not treat symptoms as evidence of forgotten
      events. Genuinely open: the mechanisms and prevalence of dissociative
      amnesia, and the size of the implantation effect under strict coding.
      The practice guidance does not depend on resolving the open part.

  - id: popular-simplification
    question: >-
      Is the Schattenkind/Sonnenkind framework a scientific model, and how
      should a package treat a book that millions found useful?
    background: >-
      Stahl's Das Kind in dir muss Heimat finden (stahl-2015) is the dominant
      German-language entry point and among the best-selling German
      non-fiction titles of its decade. Its structure — early negative
      beliefs plus the protective strategies built on them, set against
      resources and workable beliefs, with the adult learning to hold both —
      corresponds closely to schema-therapy mode language.
    position: >-
      The framework is a competent popular simplification of a clinical model
      that carries real trial evidence. Its exercises resemble bounded
      clinical techniques in self-directed form. Read this way it is a
      reasonable on-ramp: it gives readers vocabulary for their own patterns
      and points, in effect, at schema therapy.
    counterposition: >-
      As a named framework it has not been independently evaluated in
      controlled trials, and its popular reception routinely treats it as
      established psychology. Simplification also drops the parts that carry
      the safety: the clinical model specifies indication, therapist
      containment, and explicit cautions around imagery work, none of which
      survive in a self-directed format. The same critique applies to
      bradshaw-1990 in its era and to van-der-kolk-2014 in the present one.
    what_this_is_not: >-
      Not a verdict on the reader. Someone who recognised themselves in this
      book and changed something as a result has not made an epistemic error;
      they used a tier 4 text for what tier 4 texts are good at. The
      correction is about which layer carries the evidence, not about whether
      anyone was foolish to read it.
    status: >-
      Uncontested on the facts, widely ignored in practice. The teaching move
      is to route readers from the framework to young-klosko-weishaar-2003
      and the trials, and to keep the distinction between "this described me"
      and "this is validated" explicit.

  - id: attachment-determinism
    question: How much does early attachment actually predict about adult life?
    position: >-
      Attachment classification is a real construct with real correlates:
      insecure and especially disorganised classifications predict later
      externalising problems and other difficulties (fearon-2010), parental
      representations predict infant classification (van-ijzendoorn-1995), and
      severe early deprivation leaves measurable long-term effects
      (sonuga-barke-2017).
    counterpositions:
      - 'Effect sizes are small to moderate, and long-interval continuity is modest (fraley-2002) — compatible with revisable working models rather than fixed ones.'
      - 'Interventions change the target: brief, behaviourally focused programmes improve parental sensitivity and, less reliably, attachment security (bakermans-kranenburg-2003).'
      - 'The adult self-report attachment-style literature and the developmental interview literature are distinct traditions with only partial convergence; popular writing merges them.'
      - 'Cross-cultural critique: the Strange Situation classifications reflect caregiving norms that vary by culture, and distributions differ between countries (van-ijzendoorn-kroonenberg-1988).'
    status: >-
      Predictive, not determinative. The honest summary is a probabilistic
      tilt that many other factors can offset — which is exactly the summary
      that neither the popular literature nor its dismissive critics find
      satisfying.

  - id: ace-screening
    question: Should ACE scores be used with individuals?
    position: >-
      The dose-response association is robust and replicated
      (felitti-1998, hughes-2017), and awareness of it has usefully changed
      how services think about adversity.
    counterposition: >-
      Individual prediction is a different task from population description.
      Prospective cohort testing found poor discrimination and high
      misclassification when ACE scores were used as a screening instrument
      (baldwin-2021), and the original investigators published explicitly
      against that use (anda-2020). Retrospective self-report, unweighted
      categories, and heavy overlap of outcome distributions all limit what a
      score can say about a person.
    status: >-
      The association is established; individual-level screening and
      prophecy are not supported by the people who produced the association.
      This is one of the cleanest available examples of a finding being used
      in a way its authors reject.

  - id: parts-work-evidence
    question: How well evidenced is Internal Family Systems?
    position: >-
      IFS offers a coherent model, a well-specified technique, high clinical
      acceptability, and a large practitioner community; its parts language
      has become the common vocabulary of contemporary popular
      psychotherapy.
    counterposition: >-
      The trial base is thin: one small randomised trial with a null result
      on its objective primary outcome (shadick-2013), uncontrolled pilots
      elsewhere, and a listing on a US registry that was discontinued in 2018
      after sustained criticism of its standards. Reification is a live risk
      with any parts model, and the popular presentation (schwartz-2021)
      encourages it.
    status: >-
      Emerging rather than mature. Tier it honestly, teach it as a model
      whose evidence has not caught up with its reach, and do not present it
      alongside schema therapy as though the two carry equivalent support.

  - id: schema-therapy-trial-quality
    question: How strong is the schema-therapy evidence base, really?
    position: >-
      Multiple randomised trials across borderline and other personality
      disorders, including a large multi-site trial, support the model
      against active and usual-care comparators — an unusually good record
      for a psychotherapy in this indication.
    counterpositions:
      - 'Researcher allegiance: several key trials come from teams closely identified with the model, and allegiance is a documented inflator of psychotherapy effect sizes.'
      - 'Comparison fidelity: a published commentary (Yeomans, 2007) questioned how the comparison treatment was implemented in giesen-bloo-2006.'
      - 'Systematic review (taylor-bee-haddock-2017) documents small samples, heterogeneous outcomes, and limited evidence that the schemas themselves change as the theory predicts.'
    status: >-
      Good by the standards of personality-disorder psychotherapy research,
      not beyond criticism. Strong evidence rather than established finding.

  - id: trauma-narrative-versus-resilience-narrative
    question: >-
      Does the popular framing of universal childhood wounding help people or
      harm them?
    position: >-
      Adversity is common and consequential; naming it reduces shame,
      legitimises help-seeking, and reaches people who would never enter a
      consulting room. Trauma-informed practice began as a corrective to
      services that ignored history entirely.
    counterpositions:
      - 'Resilience data (masten-2001, bonanno-2004, werner-smith-1982) show that most people exposed to adversity adapt, and that presuming damage misdescribes the majority.'
      - 'Concept creep: the widening of trauma vocabulary to cover ordinary difficulty is argued to reduce the usefulness of the term and to pathologise normal distress.'
      - 'Iatrogenic risk: psychological debriefing after trauma, once standard, was found in trials to be ineffective and in some cases harmful — a documented instance of a well-intentioned framing making outcomes worse.'
    status: >-
      Both sides hold something true and the evidence supports neither
      extreme. The defensible position is symmetric: adversity matters, most
      people recover, and the narrative should not tell anyone in advance
      which group they are in.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (eight items with
  corrections and evidence); each is attached there to the concept it
  distorts.

practical_applications:
  - recognising a schema or mode in the moment — naming the state instead of acting from it, which is the transferable core of the mode model
  - distinguishing an on-ramp from a treatment — using a popular book for vocabulary and motivation while knowing what it cannot do
  - reading an epidemiological gradient without converting it into a personal forecast, a skill that transfers well beyond this subject
  - choosing a therapy with an evidence base for the presenting problem, and knowing what to ask a prospective therapist about method
  - recognising and declining memory-recovery technique — a practical safety rule with a documented history behind it
  - self-compassion practice as the evidenced version of what inner-child exercises reach for, available without adopting the metaphor
  - parenting and caregiving applications from the sensitivity-intervention literature, which are specific and unglamorous rather than sweeping
  - separating claim from reader in conversation — talking about a book's evidential standing without telling someone their experience was invalid

failure_modes:
  - treating a tier 4 bestseller as the science of the subject, in either direction of enthusiasm or contempt
  - using any technique aimed at recovering memories, or reading symptoms as evidence of forgotten events
  - converting an ACE score or an attachment classification into a personal prophecy
  - reifying the metaphor until the inner child becomes an authority to be obeyed rather than a state to be understood
  - substituting insight for change — extensive self-understanding with no alteration in behaviour, which the habit-formation package addresses directly
  - self-diagnosing a family, retroactively reinterpreting a childhood, or acting on new certainty about events without independent grounds
  - using self-directed exercises in place of indicated treatment for post-traumatic stress disorder, depression or personality disorder
  - dismissing attachment research, schema therapy and trauma-informed practice as pseudoscience because their popularisations overclaimed

open_questions:
  - the transmission gap — what carries attachment patterns between generations beyond observed parental sensitivity
  - whether early maladaptive schemas change as schema theory says they do, or whether symptom change comes by another route
  - how large the false-memory implantation effect is under strict coding, and how susceptibility varies between people
  - the mechanisms and prevalence of dissociative amnesia, still genuinely contested
  - whether IFS produces outcomes beyond common factors, which adequately powered controlled trials could answer
  - which mechanisms mediate ACE associations — stress physiology, health behaviour, socioeconomic pathways, shared genetic liability, and in what proportion
  - what protects people, at the level of specific mechanism rather than correlate, in resilient trajectories
  - whether self-directed formats of clinical techniques help, do nothing, or occasionally harm, which almost nobody has trialled

current_state: >-
  A layered field in an unusual public position. The empirical substrate is
  mature: attachment research has meta-analytic estimates and randomised
  intervention trials; the ACE association is replicated across populations
  and its limits have been stated by its own authors; resilience research is
  four decades deep. The clinical layer is uneven: schema therapy has the
  strongest randomised record of the models here, transactional analysis
  remains theoretically influential with a small outcome literature, and
  Internal Family Systems has reach far ahead of its evidence. The popular
  layer is the largest it has ever been and is where nearly everyone starts.
  The recovered-memory episode remains the field's defining cautionary
  history, its practice guidance is settled even where the underlying science
  is not, and survey data show the belief it corrected is still widely held
  outside memory research. The subject is worth teaching carefully precisely
  because the people who arrive at it are rarely browsing.
