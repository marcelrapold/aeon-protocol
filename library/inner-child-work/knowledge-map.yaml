# ÆON deep-dive library — inner-child-work — knowledge map
# Prior structure for the MAPPING phase (products/learn/knowledge-map.md).
# Test it against live research; it does not substitute for mapping.
# Source ids resolve via canonical-sources.yaml.
#
# Educational-content notice. This file describes research literatures and
# clinical models. It is educational content, not therapy and not medical
# advice. It cannot assess anyone, and it is not a substitute for a qualified
# professional who knows the individual. Persistent distress, intrusive
# memories, self-harm risk, or difficulty functioning warrant professional
# support, and nothing here should be used to delay seeking it. Readers who
# recognise their own history in this material may find parts of it
# uncomfortable; the memory section in particular is written for
# understanding, not for self-application.
#
# Epistemic note: this subject is a ladder. The popular layer is enormous and
# tier 4; beneath it sit clinical models of varying maturity; beneath those
# sits genuine empirical research on attachment, adversity and resilience.
# The package's central teaching task is keeping the rungs distinct — which
# is also what protects learners from the two symmetrical errors of treating
# a bestseller as science and dismissing the whole field because a bestseller
# oversold it. The recovered-memory section is safety-critical and is
# presented as the field's own hard-won lesson, with named positions on both
# sides.

package: inner-child-work
version: 1

overview: >-
  Inner-child work is the popular name for the proposition that early
  relational experience leaves durable patterns — in what a person expects
  from others, what they believe about themselves, and how they protect
  themselves — and that adults can identify those patterns and change how
  they operate. The proposition is not one thing. As a metaphor it descends
  from Jung's child archetype and Berne's Child ego state; as a clinical
  technology it lives in schema therapy's mode model and in parts work; as an
  empirical claim it rests on attachment research, on the adverse childhood
  experiences literature, and, in the other direction, on decades of
  resilience research showing that most people exposed to adversity do not go
  on to develop disorders. The German-language public meets the subject
  mainly through Stefanie Stahl's Schattenkind and Sonnenkind, and shares a
  shelf with John Strelecky's café parable about purpose. Learning the
  subject well means learning which layer any given claim belongs to, and
  learning why the field's own history — the recovered-memory episode of the
  1990s — made careful practice a safety question rather than a stylistic
  preference.

historical_context:
  - period: 1900-1960
    events: >-
      Psychoanalytic accounts place the origin of adult neurosis in
      childhood. Jung describes the child archetype (Collected Works volume
      9i), supplying the mythic version of an inner child. Bowlby, working
      with institutionalised and separated children, breaks with drive theory
      and begins constructing attachment theory from ethology and control
      systems; his 1951 World Health Organization report on maternal care
      brings the topic into public health.
  - period: 1961-1979
    events: >-
      Berne publishes Transactional Analysis in Psychotherapy (1961) with
      Parent, Adult and Child ego states, then Games People Play (1964),
      which becomes a mass bestseller and puts the Child into everyday
      language. Missildine's Your Inner Child of the Past (1963) uses the
      phrase directly. Ainsworth develops the Strange Situation (1970) and
      publishes Patterns of Attachment (1978). Bowlby completes the Attachment
      and Loss trilogy (1969, 1973, 1980). Alice Miller's Das Drama des
      begabten Kindes (1979) shapes German-language public thinking.
  - period: 1980-1992
    events: >-
      The recovery movement in the United States turns the inner child into a
      mass phenomenon: Woititz on adult children of alcoholics (1983),
      Beattie on codependency (1986), Whitfield's Healing the Child Within
      (1987), Bradshaw's Homecoming (1990). Main and Solomon add the
      disorganised attachment classification (1990); the Adult Attachment
      Interview extends attachment research to adults. Young publishes
      Cognitive Therapy for Personality Disorders (1990), founding schema
      therapy. Werner and Smith report the Kauai cohort's resilient
      trajectories (1982, 1992). Schwartz begins developing Internal Family
      Systems.
  - period: 1993-2000
    events: >-
      The memory wars. Loftus's The Reality of Repressed Memories (1993) and
      the Loftus and Pickrell implantation study (1995) meet a wave of
      recovered-memory litigation and the satanic ritual abuse panic. Felitti
      and Anda publish the ACE study (1998). Professional bodies issue
      guidance against memory-recovery techniques: the British Psychological
      Society working party (1995), the Royal College of Psychiatrists
      working group (Brandon et al., 1998), the American Psychological
      Association working group (final conclusions, 1998). Schwartz publishes
      Internal Family Systems Therapy (1995).
  - period: 2001-2014
    events: >-
      Masten's ordinary magic (2001) and Bonanno's resilience trajectories
      (2004) recentre the developmental literature on adaptation rather than
      damage. Fraley's meta-analysis (2002) quantifies modest attachment
      continuity. Young, Klosko and Weishaar publish the schema therapy
      manual (2003); Giesen-Bloo and colleagues publish the first large
      randomised trial (2006). McNally's Remembering Trauma (2003) and the
      APSAC attachment-therapy task force report (2006) consolidate the
      corrective literature. Bamelis and colleagues extend the schema-therapy
      evidence beyond borderline personality disorder (2014). Van der Kolk's
      The Body Keeps the Score (2014) becomes the decade's dominant popular
      trauma book.
  - period: 2015-present
    events: >-
      Stahl's Das Kind in dir muss Heimat finden (2015) makes Schattenkind and
      Sonnenkind German household terms and sells in the millions; Strelecky's
      café parable, first published in 2003, becomes a long-running German
      bestseller in translation. ACE screening spreads through health systems
      while the original investigators (Anda et al., 2020) and prospective
      cohort work (Baldwin et al., 2021) warn against individual-level
      prediction. Otgaar and colleagues (2019) document how repressed-memory
      assumptions persist under new vocabulary. Internal Family Systems
      reaches mass readership through No Bad Parts (2021) on a thin trial
      base. Schema therapy's largest multi-site randomised trial reports in
      JAMA Psychiatry (2022).

core_concepts:
  - id: ego-states
    definition: >-
      Berne's model of the person as switching between three observable
      states: Parent (borrowed attitudes and injunctions), Adult
      (present-focused appraisal), and Child (patterns of feeling and
      response laid down early). Ego states are phenomenological categories
      for behaviour that can be watched in a conversation, not compartments
      inside the skull, and Berne distinguished them explicitly from Freud's
      superego, ego and id. This is where the language of an inner child
      enters psychotherapy.
    depends_on: []
    sources: [berne-1961, berne-1964, berne-1972]

  - id: early-attachment
    definition: >-
      The infant's tie to a caregiver as an evolved behavioural system for
      obtaining protection, measurable in the Strange Situation through how
      the child uses the caregiver as a secure base and how it recovers on
      reunion. Classifications: secure, avoidant, ambivalent-resistant, and
      later disorganised. In low-risk samples roughly half to two thirds of
      infants classify as secure, with distributions varying across cultures
      and sharply in high-risk populations.
    depends_on: []
    sources: [bowlby-trilogy, ainsworth-bell-1970, ainsworth-1978, van-ijzendoorn-kroonenberg-1988]

  - id: internal-working-models
    definition: >-
      Bowlby's proposal that repeated interaction builds representations of
      self and other — expectations about whether help arrives, whether
      distress is tolerable, whether one is worth attending to — which are
      carried into new relationships and shape how they are read. Working
      models are the mechanism by which early experience could persist, and
      Bowlby framed them as revisable, not fixed. Everything popular
      inner-child writing asserts about "patterns from childhood" is a
      restatement of this idea.
    depends_on: [early-attachment]
    sources: [bowlby-trilogy, van-ijzendoorn-1995, fraley-2002]

  - id: attachment-continuity-and-its-limits
    definition: >-
      What attachment classification actually predicts. Continuity from
      infancy into adulthood is real but modest, and long intervals attenuate
      it; insecure and especially disorganised classifications predict later
      difficulties with small to moderate effect sizes; parental interview
      classifications predict infant classification with a substantial gap
      still unexplained by observed sensitivity. The adult self-report
      "attachment style" tradition founded by Hazan and Shaver converges only
      partially with the developmental interview tradition and should not be
      treated as the same measure.
    depends_on: [internal-working-models]
    sources: [fraley-2002, fearon-2010, van-ijzendoorn-1995, hazan-shaver-1987, bakermans-kranenburg-2003]

  - id: early-maladaptive-schemas
    definition: >-
      Young's construct: enduring themes about oneself and one's
      relationships — abandonment, defectiveness and shame, emotional
      deprivation, mistrust, failure, subjugation and others, organised in
      five domains — formed when core emotional needs went unmet, and
      maintained afterwards through the coping styles of surrender, avoidance
      and overcompensation. The clinical descendant of internal working
      models, defined operationally enough to be measured and targeted.
    depends_on: [internal-working-models]
    sources: [young-1990, young-klosko-weishaar-2003]

  - id: schema-modes
    definition: >-
      The state-level layer of schema therapy: the moment-to-moment
      configuration a person is in. Child modes (vulnerable child, angry
      child, impulsive child, happy child), maladaptive coping modes
      (compliant surrenderer, detached protector, self-aggrandiser),
      internalised parent modes (punitive parent, demanding parent), and the
      healthy adult mode that therapy builds up. The vulnerable-child mode is
      the specific clinical construct that popular inner-child frameworks
      simplify; the therapeutic aim is a stronger healthy adult, not a
      liberated child.
    depends_on: [early-maladaptive-schemas, ego-states]
    sources: [young-klosko-weishaar-2003, giesen-bloo-2006, bamelis-2014]

  - id: schema-therapy-evidence
    definition: >-
      What the model has actually shown. Randomised trials in borderline
      personality disorder (Giesen-Bloo 2006; a group format in Farrell 2009;
      a large multi-site trial in 2022) and across several other personality
      disorders (Bamelis 2014) support schema therapy against active or
      usual-care comparators. Weak points are documented and worth teaching:
      small samples in the early trials, few fully independent research
      groups, heterogeneous outcome measures, and the researcher-allegiance
      problem common to all psychotherapy comparisons.
    depends_on: [schema-modes]
    sources: [giesen-bloo-2006, farrell-shaw-webber-2009, bamelis-2014, arntz-2022, taylor-bee-haddock-2017]

  - id: inner-child-metaphor
    definition: >-
      The metaphor itself, treated as an object rather than assumed. Naming a
      pattern as a younger self does real work: it externalises self-criticism,
      permits compassion where self-directed contempt was habitual, and gives
      a diffuse feeling a handle. It is a map, and a map's value is what it
      lets you do. It is not a claim that a distinct entity exists inside a
      person, and treating the map as territory is where the concept starts
      producing errors — including the belief that the inner child holds
      accurate records of forgotten events.
    depends_on: [schema-modes, ego-states]
    sources: [young-klosko-weishaar-2003, berne-1961, missildine-1963]

  - id: ifs-parts-work
    definition: >-
      Schwartz's Internal Family Systems: mind as a system of parts — exiles
      carrying pain, managers preventing its activation, firefighters
      suppressing it once activated — around a core Self capable of leading.
      Structurally the closest clinical model to what popular inner-child
      practice does, with the most articulated technique. Evidentially the
      thinnest of the models in this package: one small randomised trial in
      rheumatoid arthritis, uncontrolled pilots elsewhere, and a discontinued
      US registry listing that is weak support.
    depends_on: [inner-child-metaphor]
    sources: [schwartz-1995, shadick-2013, schwartz-2021]

  - id: ace-dose-response
    definition: >-
      The Adverse Childhood Experiences finding: the more categories of
      childhood adversity a person retrospectively reports, the higher their
      average adult risk across many health outcomes, in a graded
      dose-response pattern replicated in many populations. Association
      strength varies substantially by outcome — larger for mental health,
      substance use and interpersonal violence, more modest for physical
      disease.
    depends_on: []
    sources: [felitti-1998, hughes-2017]

  - id: population-versus-individual-inference
    definition: >-
      The distinction that decides how ACE evidence may be used. A robust
      population-level association can coexist with poor individual
      prediction, because the outcome distributions at each score overlap
      heavily. Prospective cohort testing found ACE scores discriminate
      poorly as an individual screening instrument, and the original
      investigators have published explicitly against that use. The general
      skill — reading a group-level gradient without converting it into a
      personal forecast — transfers to most of health epidemiology.
    depends_on: [ace-dose-response]
    sources: [baldwin-2021, anda-2020, hughes-2017]

  - id: resilience
    definition: >-
      Good adaptation despite significant adversity, studied longitudinally
      rather than assumed. In the Kauai cohort roughly a third of
      high-risk children became competent adults, and more recovered later in
      life. Masten's synthesis locates resilience in ordinary adaptive
      systems — a stable caring relationship, self-regulation, motivation,
      schooling, community — rather than in rare toughness, hence "ordinary
      magic". Bonanno's trauma and bereavement data show stable healthy
      functioning as the most common trajectory after aversive events.
      Resilience is the counterweight that keeps adversity research honest.
    depends_on: [ace-dose-response]
    sources: [werner-smith-1982, masten-2001, bonanno-2004, sonuga-barke-2017]

  - id: reconstructive-memory
    definition: >-
      Memory is not a recording. Retrieval reconstructs an event from partial
      traces plus current knowledge, expectation and suggestion, and the
      product feels like a memory regardless of its accuracy. Post-event
      information alters what is later reported (Loftus and Palmer 1974), and
      whole autobiographical events that never happened can be induced by
      ordinary suggestive procedures in a substantial minority of people.
      Confidence and vividness are poor guides to accuracy.
    depends_on: []
    sources: [loftus-palmer-1974, loftus-pickrell-1995, scoboria-2017, loftus-1993]

  - id: recovered-memory-lesson
    definition: >-
      The safety-critical concept of this package. Techniques that press a
      person toward remembering — hypnosis, guided regression imagery,
      repeated suggestive questioning, symptom checklists read as evidence of
      forgotten abuse, insistence that absence of memory proves repression —
      can generate confident false memories, with documented damage to
      families, defendants and the clients themselves. Professional bodies
      responded with explicit guidance against memory-recovery practice. The
      lesson is the field's own, produced by its own investigation of its own
      harms, and it does not require believing that abuse is rare or that
      people who recall it are lying.
    depends_on: [reconstructive-memory, inner-child-metaphor]
    sources: [loftus-1993, otgaar-2019, brandon-1998, mcnally-2003, chaffin-2006, ofshe-watters-1994, patihis-2014]

  - id: imagery-rescripting
    definition: >-
      The tested technique that popular inner-child exercises most resemble:
      revisiting a distressing memory in imagination and deliberately
      altering its course, so that the adult or another figure intervenes.
      Meta-analysis supports medium to large effects on aversive memories and
      related symptoms. The defining boundary is the one popular versions
      lose: rescripting operates on memories the person already has, and aims
      at meaning and emotional charge, never at recovering or verifying
      forgotten events.
    depends_on: [schema-modes, reconstructive-memory]
    sources: [morina-2017, young-klosko-weishaar-2003]

  - id: self-compassion
    definition: >-
      Treating one's own suffering with the kindness one would offer a
      friend, defined as self-kindness, common humanity and mindfulness, with
      a validated measure and a large inverse association with depression,
      anxiety and stress. The best-studied construct corresponding to what
      inner-child exercises reach for, and available without any commitment
      to the metaphor. Most of the evidence is cross-sectional, so the causal
      direction is not settled.
    depends_on: [inner-child-metaphor]
    sources: [neff-2003, macbeth-gumley-2012]

  - id: bibliotherapy-and-its-limits
    definition: >-
      Self-help reading has a real evidence base with a specific shape:
      structured cognitive-behavioural workbooks, usually with some
      professional contact, in mild to moderate presentations, produce
      meaningful short-term benefit. That is not the same object as a
      narrative trade book read alone, and it is not the treatment indicated
      where a diagnosable disorder is present, for which national guidelines
      name specific therapies.
    depends_on: []
    sources: [cuijpers-1997, nice-ng116]

  - id: meaning-and-purpose
    definition: >-
      The construct the café parable dramatises, treated on its own terms:
      presence of meaning and search for meaning are separable and
      measurable, and self-reported purpose predicts lower mortality risk in
      longitudinal cohorts. Observational evidence, so causal reading remains
      open. Included so that the purpose strand of the popular canon is given
      a real ladder rather than either credulity or dismissal.
    depends_on: []
    sources: [steger-2006, hill-turiano-2014, strelecky-2003]

  - id: reading-the-popular-canon
    definition: >-
      The applied epistemics capstone: taking Stahl, Bradshaw, Strelecky and
      van der Kolk as documents, identifying which clinical model each
      simplifies, tracing each load-bearing claim to the tier where it is
      actually tested, and separating the claim from the reader. A book that
      helped someone is not thereby scientific, and a book that overclaims is
      not thereby worthless — both statements have to be held at once.
    depends_on: [inner-child-metaphor, population-versus-individual-inference, recovered-memory-lesson]
    sources: [stahl-2015, bradshaw-1990, strelecky-2003, van-der-kolk-2014, whitfield-1987, miller-1979]

mental_models:
  - the ladder — popular book, clinical model, empirical substrate; every claim sits on one rung and inherits that rung's confidence
  - internal working models — early experience persists as expectations, and expectations are revisable
  - the map is not the territory — the inner child is a useful handle, not an occupant
  - modes, not people — a person in a vulnerable-child state is still one person, and the goal is a stronger healthy adult
  - population gradient versus personal forecast — a real dose-response curve can still predict almost nothing about you
  - ordinary magic — resilience runs on common systems, so recovery is the usual case rather than the exception
  - memory as reconstruction — vividness and confidence are not evidence, and questions become part of the answer
  - rescript, do not retrieve — work with the memories a person has, never hunt for ones they do not

key_people:
  researchers_and_schools:
    - 'Eric Berne — transactional analysis; Parent, Adult and Child ego states as the origin of inner-child language'
    - 'John Bowlby — attachment theory and internal working models'
    - 'Mary Ainsworth — the Strange Situation and the attachment classifications'
    - 'Mary Main & Judith Solomon — disorganised attachment; Main and colleagues on the Adult Attachment Interview'
    - 'Marinus van IJzendoorn & Marian Bakermans-Kranenburg — attachment meta-analysis, the transmission gap, and randomised sensitivity interventions'
    - 'R. Chris Fraley & Glenn Roisman — continuity of attachment and the size of its effects'
    - 'Cindy Hazan & Phillip Shaver — the adult self-report attachment-style tradition'
    - 'Michael Rutter & Edmund Sonuga-Barke — the English and Romanian Adoptees study on severity, timing and recovery'
    - 'Jeffrey Young, Janet Klosko & Marjorie Weishaar — schema therapy, early maladaptive schemas and the mode model'
    - 'Arnoud Arntz, Josephine Giesen-Bloo, Joan Farrell & Ida Shaw — the schema-therapy trial programme'
    - 'Vincent Felitti & Robert Anda — the Adverse Childhood Experiences study, and Anda later its most careful critic'
    - 'Emmy Werner & Ruth Smith — the Kauai longitudinal study of resilience'
    - 'Ann Masten — resilience as ordinary magic'
    - 'George Bonanno — resilience trajectories after loss and trauma'
    - 'Richard C. Schwartz — Internal Family Systems'
    - 'Elizabeth Loftus — memory malleability, misinformation, and false-memory implantation'
    - 'Richard McNally & Henry Otgaar — the scientific literature on traumatic memory and repression claims'
    - 'Kristin Neff & Paul Gilbert — self-compassion and compassion-focused therapy'
  critics_and_interlocutors:
    - 'Robert Anda, Laura Porter & David Brown — against individual-level use of the ACE score, from inside the original study'
    - 'Jessie Baldwin, Andrea Danese & the Dunedin group — prospective test showing ACE screening performs poorly for individuals'
    - 'Chris Brewin & Bernice Andrews — argue the false-memory implantation literature is over-read; the direction is agreed, the magnitude disputed'
    - 'Constance Dalenberg and colleagues — defend a trauma model of dissociation against the fantasy model'
    - 'Steven Jay Lynn, Scott Lilienfeld, Harald Merckelbach & Lawrence Patihis — reply to Dalenberg; document the persisting scientist-practitioner gap'
    - 'Mark Chaffin and the APSAC task force — documented harms of coercive attachment and regression therapies'
    - 'Frank Yeomans — published commentary questioning comparison-treatment fidelity in Giesen-Bloo et al. (2006)'
    - 'Richard Ofshe & Ethan Watters — contemporaneous critics of recovered-memory practice, polemical and disputed in places'
    - 'Jerome Kagan — long-standing sceptic of strong early-experience determinism in developmental psychology'
    - 'Cross-cultural critics of the Strange Situation — argue the procedure encodes culturally specific caregiving norms as universal categories'

