# ÆON deep-dive library — inner-child-work — package manifest
# Shape: schemas/topic-package.schema.json
# Subject: the claim that early relational experience leaves lasting patterns
# adults can identify and work with — taught as a ladder from the popular
# books down to the clinical models and the evidence that actually carries.
# Person lenses: Stefanie Stahl and John Strelecky — framing, not authority.

id: inner-child-work
name: Inner Child Work

version: 1

description: >-
  Inner-child work is the popular name for a family of ideas about early
  relational experience: that childhood leaves patterns in how adults expect,
  interpret and respond to closeness, and that those patterns can be
  identified and worked with. Beneath the bestsellers lie real clinical
  models with real evidence, and the popular versions are simplifications of
  them. This package teaches the ladder explicitly — Berne's ego states as
  the origin of the language, Young's schema modes as the clinical model that
  the German bestseller's Schattenkind popularises, attachment research as
  the empirical substrate, the Adverse Childhood Experiences literature and
  its probabilistic limits, resilience research as the necessary
  counterweight, Internal Family Systems as an emerging model, and the
  popular canon as objects of study rather than as evidence. It also carries
  the field's hardest-won lesson: memory is reconstructive, and techniques
  that press a person toward remembering can create confident false
  memories. Many people arrive at this subject from real pain, and the
  package is written for them: precise about which layer carries the
  evidence, never dismissive of anyone who found a book helpful.
  This package is educational scaffolding about a research literature. It is
  not therapy, not medical advice, and not a substitute for assessment or
  treatment by a qualified professional. Persistent distress, intrusive
  memories, or difficulty functioning warrant professional support, and
  nothing here should be used to postpone it.

epistemic_core: >-
  The ladder is the lesson. Attachment classification and its correlates,
  the ACE dose-response association, and the outcome evidence for schema
  therapy in personality disorders are serious empirical work at tier 1-2.
  The mode model and the metaphor of an inner child are clinical constructs —
  useful maps whose value lies in what they let a therapist and a client do,
  not in their literal truth. Internal Family Systems is a coherent model
  with a thin and mostly small-sample trial base. The Schattenkind/Sonnenkind
  framework and the café parable are tier 4: enormously read, honestly
  motivating, and not independently validated as such. Confusing these layers
  in either direction is the failure this package exists to prevent — treating
  a bestseller as science, or dismissing the whole subject as pseudoscience
  because a bestseller oversold it.

domains:
  - clinical psychology and psychotherapy outcome research
  - developmental psychology and attachment research
  - cognitive psychology of memory and suggestibility
  - psychiatric epidemiology and public health
  - resilience science
  - history of psychotherapy and recovery movements
  - self-help publishing and science communication
  - evidence appraisal and epistemics

