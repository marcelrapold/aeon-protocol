  - 'Fraley (2002): Attachment Stability From Infancy to Adulthood — Meta-Analysis and Dynamic Modeling of Developmental Mechanisms'
  - "Young, Klosko & Weishaar (2003): Schema Therapy — A Practitioner's Guide"
