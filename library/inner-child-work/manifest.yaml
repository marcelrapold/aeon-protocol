prerequisites: []

related_packages:
  - personality-psychology  # trait structure, stability and change; the same "is this destiny?" question in a different literature
  - mindfulness-meditation  # overlapping practice layer: attention, self-compassion, and the same tier-4 popularisation problem
  - habit-formation  # what change actually requires once insight has been reached

# Person lenses are framing, not authority: they document why learners arrive
# and what tier the person's material occupies. The package teaches the subject.
popular_lenses:
  - name: Stefanie Stahl
    role: >-
      Popular entry point in the German-speaking world. Diplom-Psychologin and
      psychotherapist whose Das Kind in dir muss Heimat finden (2015) made
      Schattenkind and Sonnenkind household vocabulary and stayed on the
      German bestseller lists for years; English edition published as The
      Child in You.
    tier: 4
    note: >-
      Tier 4 is the tier of the arrival material, not a quality verdict. The
      book is clearly written, structurally faithful to the clinical ideas it
      draws on, and has helped a great many readers put language to their own
      patterns. What it is not is an independently validated model: the
      Schattenkind (negative beliefs plus the protective strategies built on
      them) and the Sonnenkind (resources and workable beliefs) map closely
      onto schema-therapy mode language — vulnerable child, maladaptive coping
      modes, happy child and healthy adult — and it is the clinical model,
      not the popular framework, that carries the trial evidence. Learners
      arriving through Stahl get routed to Young, Klosko and Weishaar (2003)
      and the schema-therapy trials, and to the attachment literature beneath
      them. See the popular-simplification controversy in knowledge-map.yaml.

  - name: John Strelecky
    role: >-
      Popular entry point through fiction. Author of the parable The Why Are
      You Here Café (2003), a runaway success in German translation as Das
      Café am Rande der Welt (2007), which frames life direction through three
      questions about purpose, fear of death and fulfilment.
    tier: 4
    note: >-
      Tier 4, and a different genre again: this is a fable about meaning and
      purpose, not a psychological model, and it makes no empirical claims to
      test. It belongs in this package because it shares shelf space and
      readership with the inner-child books and is frequently read as though
      it were psychology. Treated honestly it is a fine object of study: the
      meaning-and-purpose construct it dramatises has a real research
      literature (Steger and colleagues on measurement, Hill and Turiano on
      purpose and mortality, Frankl's logotherapy as the older lineage), and
      comparing the parable with that literature is a good exercise in telling
      a motivating story from an evidential claim.
