popular_lenses:
  - name: Valter Longo
    role: >-
      USC biogerontologist who developed the fasting-mimicking diet and wrote
      The Longevity Diet (2018) — the route through which most learners meet
      the longevity framing of fasting.
    tier: 4
    note: >-
      Two roles, two tiers. The peer-reviewed fasting-mimicking work
      (brandhorst-2015, wei-2017) is cited at tier 1 and stands on its own
      terms as short-duration marker evidence. The trade book and its
      surrounding programme are tier 4. Longo founded L-Nutra, which sells the
      commercial fasting-mimicking product, and discloses the relationship in
      his papers; he has stated that he directs his equity to a non-profit
      foundation. Name the interest, weigh the evidence on its design, and do
      neither the hagiography nor the hit piece.

  - name: Jason Fung
    role: >-
      Nephrologist and author of The Obesity Code (2016), the book behind much
      of the insulin-centric case for fasting in the popular discourse.
    tier: 4
    note: >-
      Tier 4 popular explanation with a strong theoretical commitment: that
      obesity is primarily a disorder of insulin rather than of energy
      balance. That claim has named opposition in the controlled literature
      (hall-2015, hall-2017) and a steelmanned academic version worth reading
      alongside it (ludwig-ebbeling-2018). The insulin-model dispute is taught
      as a named controversy in knowledge-map.yaml, not smuggled in as
      background assumption.

  - name: Michael Mosley
    role: >-
      Physician and broadcaster whose 2012 BBC Horizon documentary and The
      Fast Diet (2013, with Mimi Spencer) turned the 5:2 pattern into a mass
      phenomenon.
    tier: 4
    note: >-
      The clearest case of a research finding reaching the public through a
      popular channel: the underlying intermittent energy restriction trial
      (harvie-2011) is tier 1 and reports equivalence with continuous
      restriction, while the popularisation carried a stronger implication of
      superiority. Useful for teaching how a null-ish result becomes a diet.

  - name: Satchidananda Panda
    role: >-
      Salk Institute circadian biologist, author of The Circadian Code (2018)
      and the main source of the time-restricted eating framing.
    tier: 4
    note: >-
      The lens is the book; the laboratory work is separate. Panda's rodent
      time-restricted feeding studies (hatori-2012) are tier 1 and genuinely
      striking, and the human observational app study (gill-panda-2015) is
      tier 1 descriptive work. The open question the book runs ahead of is
      whether the mouse result transfers to humans once calories are matched —
      see the timing-independent-of-calories controversy.
