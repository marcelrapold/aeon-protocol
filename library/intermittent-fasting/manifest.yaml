# ÆON deep-dive library — intermittent-fasting — package manifest
# Shape: schemas/topic-package.schema.json

id: intermittent-fasting
name: Intermittent Fasting
version: 1

description: >-
  Intermittent fasting (German: Intermittierendes Fasten) as a research subject
  rather than a marketing category: time-restricted eating (16:8 and its
  variants), alternate-day fasting, 5:2 intermittent energy restriction,
  prolonged fasting and fasting-mimicking diets. The spine of the package is
  one distinction the popular discourse routinely collapses — the randomised
  evidence shows these protocols produce weight loss mainly by reducing total
  calorie intake, and generally do not outperform matched continuous calorie
  restriction, while still being a genuinely useful adherence tool for some
  people. Around that spine sit the fed-to-fasted transition, the circadian
  timing literature, and the package's central debunk: the leap from Yoshinori
  Ohsumi's Nobel-recognised autophagy work in yeast to claims about what
  sixteen hours without food does to a human being. This package is
  educational content about the state of the evidence. It is not medical
  advice, it does not diagnose or treat anything, and decisions about fasting
  belong with a qualified clinician who knows the individual — particularly
  where pregnancy, breastfeeding, diabetes medication, a history of eating
  disorders, low body weight or adolescence is involved.

domains:
  - nutrition science and dietetics
  - metabolic physiology and endocrinology
  - chronobiology and chrononutrition
  - cell biology of autophagy and nutrient sensing
  - ageing and longevity research
  - clinical trial methodology and evidence appraisal
  - behavioural science and adherence
  - science communication and epistemics

