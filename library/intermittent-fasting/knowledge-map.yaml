major_controversies:
  - id: autophagy-translation-gap
    question: >-
      Does a sixteen-hour human fast induce meaningful autophagy, and what did
      the Nobel Prize actually establish?
    background: >-
      Ohsumi's laboratory demonstrated autophagy in nutrient-starved yeast
      (takeshige-1992) and identified the genes controlling it
      (tsukada-ohsumi-1993). The 2016 Nobel Prize in Physiology or Medicine
      recognised those discoveries of mechanism (nobel-2016). Popular fasting
      material routinely presents this as scientific endorsement of a specific
      human fasting duration, often with a stated hour at which autophagy
      "switches on".
    position: >-
      Nutrient deprivation induces autophagy in cells and in rodents; the
      pathway is conserved; fasting therefore plausibly increases autophagic
      activity in humans, and proponents treat this as a principal benefit of
      fasting beyond calorie reduction (longo-mattson-2014,
      decabo-mattson-2019).
    counterposition: >-
      Three separate gaps break the popular inference. Species: the founding
      work is in yeast, and the rodent work that follows uses animals with far
      higher metabolic rates and much shorter natural feeding cycles, so
      fasting durations do not transfer hour for hour. Baseline: autophagy is
      constitutive and continuously active, not off by default, so "triggering
      autophagy" misdescribes the biology (mizushima-komatsu-2011).
      Measurement: autophagic flux cannot currently be quantified
      non-invasively in living humans, and static marker readings are
      routinely misread as flux (klionsky-2021) — which means no one can state
      the human dose-response curve, in either direction.
    what_this_is_not: >-
      Not a claim that human fasting fails to induce autophagy, and not a
      criticism of Ohsumi's work, which is exemplary. The objection is to a
      specific inferential leap: from mechanism discovered in yeast, to a
      quantified human benefit at a named hour, to a health claim.
    status: >-
      The mechanism is established. Its induction thresholds, tissue
      distribution and clinical consequences in fasting humans are open. Any
      number of hours quoted as the autophagy threshold for humans is an
      extrapolation presented as a measurement.

  - id: does-fasting-beat-continuous-restriction
    question: >-
      Do intermittent protocols produce more weight or fat loss than matched
      daily calorie restriction?
    position: >-
      The optimistic case (decabo-mattson-2019, longo-mattson-2014): metabolic
      switching between glucose and ketone fuel produces adaptations that
      continuous restriction does not, so equal calories should not produce
      equal results.
    counterposition: >-
      The head-to-head randomised evidence. Alternate-day fasting matched
      daily restriction and no better, with more dropout (trepanowski-2017).
      Unsupervised 16:8 produced under a kilogram over twelve weeks with no
      significant advantage (lowe-2020). With calories matched over twelve
      months, adding an eight-hour window changed nothing significant
      (liu-2022). Systematic reviews and meta-analyses reach the same place
      (seimon-2015, cioffi-2018), and a review by the most active trial group
      concurs (varady-2022).
    what_this_is_not: >-
      Not a finding that fasting does not work. It works — it is one way to
      eat less. The refuted claim is the comparative one, that it works better
      than an equivalent deficit taken continuously. For a person who finds a
      window easier to hold than daily counting, equivalence in trials plus
      superior personal adherence is a perfectly good reason to fast.
    status: >-
      As settled as this literature gets. Calorie-matched superiority is not
      supported; adherence-mediated advantage for particular individuals is
      real and is where the useful discussion lives.

  - id: timing-independent-of-calories
    question: >-
      Does when you eat carry cardiometabolic benefit independent of how much?
    position: >-
      Chronobiology predicts it should, and the controlled evidence is not
      empty. Time-restricted feeding protected mice on identical intake
      (hatori-2012). Under fully provided eucaloric feeding with weight held
      stable, an early six-hour window improved insulin sensitivity and blood
      pressure (sutton-2018). An early window plus energy restriction produced
      modestly greater weight loss than restriction with a longer window
      (jamshed-2022).
    counterpositions:
      - 'The largest matched-calorie trial found no significant added effect of an eight-hour window over twelve months (liu-2022).'
      - 'The supportive human evidence is very small, short and skewed: sutton-2018 randomised eight men in a crossover with all food provided, which is a mechanistic demonstration rather than a population result.'
      - 'Most real-world 16:8 practice uses a late window (midday to evening), which forfeits the circadian rationale the early-window data support.'
      - 'Free-living studies rely on self-reported intake, which is wrong by more than the effects under discussion (lichtman-1992).'
    status: >-
      Genuinely open, and narrowing: a small intake-independent effect of
      early eating on glycaemic markers is plausible and partly supported; a
      large effect on weight is not. The strong popular version — that the
      window matters more than the intake — has no support in matched-calorie
      trials.

  - id: insulin-versus-energy-balance
    question: >-
      Is obesity primarily a disorder of insulin, making fasting a causal
      treatment rather than a deficit tool?
    position: >-
      The carbohydrate-insulin model in its serious form
      (ludwig-ebbeling-2018): diet composition alters partitioning and hunger,
      so calories are not interchangeable and lowering insulin is causally
      privileged. Its popular form (fung-2016) makes fasting the natural
      therapy on that logic.
    counterposition: >-
      Controlled feeding experiments dissociate the variables and do not
      confirm the prediction: cutting carbohydrate lowered insulin
      substantially while producing slightly less body fat loss than isocaloric
      fat restriction (hall-2015); the model's specific quantitative
      predictions fail across the ward literature (hall-2017). Appetite
      research supplies an alternative mechanism for why some diets are easier
      to hold (guyenet-2017).
    status: >-
      The strong causal version is not supported by controlled experiments.
      Weaker versions — that composition affects satiety, spontaneous intake
      and adherence — are uncontroversial and sufficient to explain why some
      people do well on fasting. Teach the distinction; it is the same
      mechanism-versus-adherence distinction as the package spine.

  - id: lean-mass-in-time-restricted-eating
    question: Does time-restricted eating cost disproportionate lean mass?
    position: >-
      In the TREAT trial's in-person measurement subgroup, appendicular lean
      mass fell in the time-restricted arm, and the reported share of lost
      mass that was lean tissue was unusually high (lowe-2020). Widely
      reported as evidence that fasting burns muscle.
    counterpositions:
      - 'The finding comes from a subgroup, with total weight change under a kilogram; the ratio of lean to fat loss is unstable and imprecise at that magnitude.'
      - 'Neither arm had a protein prescription or a training programme, the two variables that actually govern lean-mass retention in a deficit.'
      - 'A randomised 16:8 trial in resistance-trained men with matched protein and continued training preserved lean mass and strength while reducing fat (moro-2016).'
    status: >-
      Best read as a caution about how a deficit is executed, not a property
      of eating windows. The non-alarmist statement: any deficit can cost lean
      tissue, protein intake and resistance training are the levers, and one
      subgroup result in a small trial is a prompt for further study rather
      than a verdict.

  - id: calorie-restriction-to-human-longevity
    question: Does the animal longevity evidence transfer to humans?
    position: >-
      Restriction extends lifespan robustly in yeast, worms, flies and
      rodents (mccay-1935 onward), and the Wisconsin primate study found
      delayed disease onset and reduced age-related mortality (colman-2009).
    counterpositions:
      - 'The parallel NIA primate study found health benefits but no significant survival benefit (mattison-2012); the joint reanalysis attributes much of the divergence to diet composition and how controls were fed (mattison-2017).'
      - 'The lifespan effect attenuates in larger, longer-lived, more genetically variable animals — precisely the direction humans lie in.'
      - 'Human evidence is necessarily biomarker evidence: CALERIE tested feasibility and risk markers over two years, not lifespan (ravussin-2015).'
      - 'None of this literature is about eating windows; it is about sustained energy restriction, a different intervention.'
    status: >-
      Unresolved and probably unresolvable by direct experiment in humans.
      Longevity claims attached to a 16:8 window are borrowing credibility
      from a body of work that studied something else in other species.

  - id: fasting-mimicking-commercial-interest
    question: >-
      How should evidence be weighed when its principal investigator sells the
      intervention?
    background: >-
      The fasting-mimicking diet has genuine randomised human data
      (wei-2017) alongside mouse work carrying the strongest claims
      (brandhorst-2015, cheng-2014). Longo founded the company that sells the
      commercial version and discloses the relationship; he has stated that he
      directs his equity to a non-profit foundation.
    positions:
      - 'Disclosure plus randomisation is the system working: the trial design, not the funder, determines what the data support.'
      - 'Industry-linked nutrition research shows systematically more favourable results across the field, so the interest is a reason for closer scrutiny of design and endpoint selection, not a reason to discard the work.'
    status: >-
      Both readings are compatible. Name the interest, then evaluate the study
      on duration, endpoint type and control quality — which places the human
      evidence at short-term marker improvement, not demonstrated clinical
      benefit.

  - id: fasting-and-cardiovascular-risk-headlines
    question: >-
      Does a short eating window raise cardiovascular mortality, as reported
      in 2024?
    background: >-
      A conference abstract presented at an American Heart Association
      scientific meeting in 2024 reported an association between an eating
      window under eight hours and cardiovascular death in observational
      survey data. It received very wide coverage.
    counterposition: >-
      The material was a preliminary conference abstract rather than a
      peer-reviewed paper at the time of coverage; the exposure rested on a
      small number of self-reported dietary recall days; and reverse causation
      is an obvious candidate, since illness compresses eating patterns.
      Critics noted that the reporting reproduced exactly the overclaiming it
      appeared to correct.
    status: >-
      No randomised evidence supports a cardiovascular harm signal from
      time-restricted eating in healthy adults, and no randomised evidence
      supports a cardiovascular benefit either. This episode belongs in the
      package as a lesson about evidence hierarchy, and specifically about how
      an abstract becomes a headline.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (nine items with
  origins, corrections and evidence); each is attached there to the concept it
  distorts.

practical_applications:
  - choosing a protocol on adherence fit rather than on claimed mechanism — the decision rule the evidence actually supports
  - reading any fasting study by asking first whether calories were matched, second who dropped out, and third whether intake was measured or reported
  - protecting lean mass in any deficit through adequate protein and resistance training, independent of eating schedule
  - preferring earlier eating windows where a window is used at all, since that is where the intake-independent evidence sits
  - aligning eating windows with shift schedules and sleep timing rather than against them (see the sleep-science package for the circadian machinery)
  - designing the window as a habit with a cue and a stable context rather than as an act of daily willpower (see the habit-formation package)
  - handling supplement and training timing questions inside a restricted window as their own topic (see the creatine package for the loading-and-timing evidence in that case)
  - medically supervised fasting where a clinical indication exists — the Ramadan diabetes guidelines show what real supervision involves
  - stating plainly, when asked for advice, that this is educational content and the decision belongs with a clinician who knows the person

failure_modes:
  - treating the eating window as permission to stop attending to intake — the single most common practical failure
  - citing a Nobel Prize as evidence for a claim the prize did not evaluate
  - reading rodent fasting durations as human prescriptions without adjusting for metabolic rate and natural feeding cycle
  - converting one subgroup body-composition finding into a warning that fasting destroys muscle
  - stacking a fasting protocol on top of an existing pattern of undereating, over-exercising or disordered eating
  - self-managing a fasting protocol on glucose-lowering medication without prescriber involvement
  - accepting single-arm pilots, conference abstracts and marker studies as if they were randomised clinical-endpoint trials
  - moralising eating schedules — treating a personal adherence tool as a discipline test others are failing

open_questions:
  - whether any intake-independent metabolic benefit of early eating windows survives long-term calorie-matched testing
  - how much autophagy fasting induces in specific human tissues, at what duration, and how to measure flux non-invasively in living people
  - whether fasting-mimicking cycles improve clinical outcomes rather than risk markers
  - what happens to adherence and weight beyond one to two years, where almost no fasting data exist
  - how the evidence differs by sex, across the menstrual cycle, and through perimenopause — an area substantially understudied relative to its practical importance
  - whether fasting protocols offer anything distinctive alongside or after incretin-based weight-loss pharmacotherapy
  - whether early and late eating windows differ once total intake is genuinely controlled rather than reported

current_state: >-
  A subject whose physiology is well characterised, whose randomised evidence
  is modest and largely convergent, and whose public profile is out of
  proportion to both. The equivalence finding — intermittent protocols match
  matched continuous restriction rather than beating it — is now supported by
  head-to-head trials of alternate-day fasting and of time-restricted eating,
  by twelve-month calorie-matched testing, and by systematic reviews,
  including reviews written by the field's most committed trial groups. The
  live scientific question has narrowed to circadian timing, where small,
  tightly controlled early-window studies show intake-independent effects on
  glycaemic markers that larger free-living trials have not reproduced as
  weight loss. The longevity and autophagy claims that drive most popular
  interest rest on yeast, worm, fly and rodent work plus short human marker
  studies, and the distance between that evidence and the claims made from it
  is the most important thing a learner can come away able to see. Meanwhile
  the discourse overclaims in both directions, and effective weight-loss
  pharmacotherapy has changed the comparison class for every dietary pattern.
  Educational content throughout — not medical advice.
