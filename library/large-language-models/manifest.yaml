# The package assumes no machine-learning background and builds the objective
# from Shannon forward. Nothing here is gated on another package; the entries
# below are useful companions, not gates.
prerequisites: []

# Cross-links the curriculum compiler can exploit. cryptography supplies the
# habit of stating an adversary and a security claim precisely before believing
# either — the same discipline evaluation of language models lacks.
# systems-thinking supplies stocks, flows and delays for the compute-data-
# capital loop and the leverage-point analysis of where interventions land.
# economic-psychology supplies the demonstrated human biases — anchoring,
# availability, narrative seduction, motivated reasoning — that make the hype
# gradient a fact about readers as much as about vendors.
related_packages:
  - cryptography
  - systems-thinking
  - economic-psychology

# Person lenses are framing, not authority: they record why learners arrive at
# the subject and what tier the person's material occupies
# (protocol/research.md). The package teaches the subject, not the person, and
# names both boosters and critics so the lens list does not itself become a
# hype gradient.
popular_lenses:
  - name: Andrej Karpathy
    role: >-
      Practitioner-educator lens: for a very large share of self-taught
      learners the entry point is his from-scratch implementation walkthroughs
      and long-form explainer videos on tokenisation, pretraining and
      post-training.
    tier: 4
    note: >-
      The videos and code are tier 4 by genre — teaching material, not
      results — but they are unusually faithful to the primary literature and
      the author is himself a tier 1 contributor. Their limitation is scope,
      not accuracy: they explain how the machinery works far better than they
      adjudicate what it means, and they carry no systematic evaluation or
      harms analysis. Pair with the evaluation and critique paths.
  - name: Gary Marcus
    role: >-
      Critic lens: the most publicly visible standing argument that scaling
      deep learning alone will not produce reliable reasoning, from Deep
      Learning — A Critical Appraisal (2018) through continuous commentary.
    tier: 3
    note: >-
      Expert interpretation, argued in essays and preprints rather than
      controlled studies, and openly polemical. His specific predictions have
      a mixed record — several capability ceilings he named were later
      crossed, while his core charge about brittleness, hallucination and
      distribution shift is echoed by mainstream measurement work. Teach the
      argument with its scorecard, and route learners to the primary
      benchmark and error-analysis literature rather than to the commentary.
  - name: Emily M. Bender
    role: >-
      Critique lens: co-author of the octopus thought experiment (with
      Alexander Koller, 2020) and of the stochastic-parrots paper (2021), and
      the most-cited source of the vocabulary many learners first meet.
    tier: 1
    note: >-
      Her core papers are peer-reviewed tier 1 primary work and are treated
      as such here. The lens caveat runs the other way from the usual one:
      the slogan "stochastic parrot" is routinely quoted far beyond what the
      paper argued — it is an argument about training-data scale,
      environmental and labour costs, the absence of grounding in form-only
      learning, and accountability, not a blanket claim that outputs are
      useless. Teach the paper, not the slogan.
