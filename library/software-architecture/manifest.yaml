  - 'Melvin E. Conway: How Do Committees Invent? (1968)'
  - 'David L. Parnas: On the Criteria To Be Used in Decomposing Systems into Modules (1972)'
  - 'Wayne P. Stevens, Glenford J. Myers & Larry L. Constantine: Structured Design (1974)'
  - 'Frederick P. Brooks Jr.: The Mythical Man-Month — Essays on Software Engineering (1975)'
  - 'Frederick P. Brooks Jr.: No Silver Bullet — Essence and Accidents of Software Engineering (1987)'
  - 'Ward Cunningham: The WyCash Portfolio Management System (1992)'
  - 'Jim Waldo, Geoff Wyant, Ann Wollrath & Sam Kendall: A Note on Distributed Computing (1994)'
  - 'Carliss Y. Baldwin & Kim B. Clark: Design Rules, Volume 1 — The Power of Modularity (2000)'
  - 'Eric Evans: Domain-Driven Design — Tackling Complexity in the Heart of Software (2003)'
  - 'Alan MacCormack, Carliss Y. Baldwin & John Rusnak: Exploring the Duality between Product and Organizational Architectures (2012)'
  - 'James Lewis & Martin Fowler: Microservices — a definition of this new architectural term (2014)'
  - 'Martin Kleppmann: Designing Data-Intensive Applications (2017)'
  - 'Nicole Forsgren, Jez Humble & Gene Kim: Accelerate — The Science of Lean Software and DevOps (2018)'

