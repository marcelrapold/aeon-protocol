# ÆON deep-dive library — software-architecture — package manifest
# Shape: schemas/topic-package.schema.json
# Subject: how software systems are decomposed, why the seams cost more than
# the parts, and which of this field's confident claims are actually evidenced.
# Related packages: distributed-systems (the price of every network seam) and
# systems-thinking (feedback, near-decomposability, leverage) — see
# related_packages below.

id: software-architecture
name: Software Architecture
version: 1

description: >-
  The discipline of decomposition: choosing the boundaries a software system is
  cut along, and living with the consequences. Built on Parnas' information
  hiding (1972) — modules are defined by the decisions they hide, not by the
  steps they perform — with coupling and cohesion (Stevens, Myers &
  Constantine, 1974) as its working vocabulary and Conway's law (1968) as its
  organisational constraint. Covers Brooks on communication cost and the
  absence of a silver bullet, domain-driven decomposition (Evans),
  data-intensive design (Kleppmann), the monolith-versus-microservices
  trade-off with named advocates on both sides and documented consolidations
  back, Cunningham's technical-debt metaphor and its drift, and the
  Accelerate/DORA programme as one of the field's few genuinely empirical
  strands — taught together with the survey-based limits of that evidence.
  A field whose canon is mostly argued rather than measured, and which is
  taught honestly only when that is said out loud.

domains:
  - software engineering
  - systems and interface design
  - organisational design and team structure
  - distributed systems
  - domain modelling and data design
  - empirical software engineering
  - engineering economics and risk

