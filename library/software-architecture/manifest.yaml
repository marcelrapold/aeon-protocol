# Packages that share load with this one. distributed-systems carries the
# costs any network seam imports (partial failure, consistency, latency
# tails) — the monolith-versus-microservices trade-off is unteachable
# without it. systems-thinking carries near-decomposability, feedback and
# leverage points, which is what an architect is manipulating when they move
# a boundary.
related_packages:
  - distributed-systems
  - systems-thinking

# Person lenses are framing, not authority: they document why learners arrive
# at the subject and what tier the person's material occupies
# (protocol/research.md). The package teaches architecture, not an author.
popular_lenses:
  - name: Martin Fowler
    role: >-
      The most common entry point for working developers: martinfowler.com's
      bliki, Refactoring (1999, second edition 2018) and Patterns of
      Enterprise Application Architecture (2002) are where much of the
      industry first meets architectural vocabulary.
    tier: 3
    note: >-
      Expert interpretation, and unusually honest about it — Fowler
      co-authored the article that defined microservices for the industry
      (2014) and then published MonolithFirst (2015) arguing against
      starting there, which is exactly the self-correction the package
      teaches. His writing is argument and pattern cataloguing, not
      measurement; it is a strong prior and a weak citation. Route learners
      to Parnas, Conway, Baldwin & Clark and the empirical literature for
      the load-bearing versions.
  - name: Robert C. Martin
    role: >-
      Clean Code (2008) and Clean Architecture (2017) are, for a large share
      of self-taught and bootcamp-trained developers, the first structured
      account of dependency direction and boundaries they encounter.
    tier: 3
    note: >-
      The dependency-rule core — source-code dependencies point inward,
      toward policy, and the database and framework are details — is a
      restatement of Parnas' information hiding and is widely accepted. The
      surrounding prescriptions (function length, comment discipline, the
      ring diagram treated as an architecture) are argued, not measured, and
      are contested by practitioners who share the core. Teaching through
      this lens means separating the principle from the doctrine, and
      naming the trade-offs the diagram hides (indirection cost, more
      moving parts, a mapping layer nobody asked for).
