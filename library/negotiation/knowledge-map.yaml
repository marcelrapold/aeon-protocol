major_controversies:
  - id: principled-negotiation-universality
    question: Is principled negotiation a universally sound prescription, or a partial method that underweights value claiming and power?
    harvard_position: >-
      Fisher & Ury (fisher-ury-1981): negotiating over interests with options
      and objective criteria yields wiser, more efficient agreements and
      protects relationships; BATNA discipline guards against exploitation.
    counterpositions:
      - 'James J. White (white-1984, with Fisher''s reply in the same journal): most deals carry an irreducible distributive core; "objective criteria" become one more arena for partisan advocacy; the book is strongest where stakes are integrative and weakest where they are not.'
      - 'Lax & Sebenius (lax-sebenius-1986): the negotiator''s dilemma is structural — advice to create value that ignores simultaneous claiming is incomplete by construction.'
      - 'Power objection: when one side''s alternatives are overwhelming, interests-talk does not equalise the table. Ury''s Getting Past No (ury-1991) is the school''s own follow-up conceding that difficult counterparts need a different playbook.'
    status: the vocabulary (BATNA, interests, options, criteria) is field-standard; the universality claim is not — teach the method with its boundary conditions

  - id: first-offer-advantage
    question: Should a prepared negotiator make the first offer?
    research_position: >-
      Anchoring experiments (galinsky-mussweiler-2001, on the heuristic base
      of tversky-kahneman-1974): first offers pull outcomes toward the mover,
      and the advantage holds when the mover knows the bargaining range.
    counterpositions:
      - 'Practitioner lore (voss-2016): under information asymmetry, let the counterpart move first — their offer reveals their model of the deal. An information-value argument with anecdotal support; the boundary condition is real, the general rule is not.'
      - 'The moderation results within the same research programme: recipients who focus on the counterpart''s alternatives or their own targets neutralise the anchor (galinsky-mussweiler-2001), so the first-mover advantage shrinks against prepared counterparts.'
    status: robust laboratory effect with boundary conditions; both "always move first" and "never move first" are wrong readings

  - id: tactical-empathy-evidence
    question: What is the evidential status of tactical empathy?
    practitioner_position: >-
      Voss (voss-2016): empathy-driven tactics — mirroring, labelling,
      calibrated questions — build enough trust and information flow to move
      counterparts, proven across hundreds of FBI kidnapping negotiations.
    counterpositions:
      - 'Evidential status: no controlled trials test the toolkit as a package; the claims rest on field anecdote and doctrine. The documented lineage — active listening and the Behavioral Change Stairway Model — is observational crisis-negotiation literature (vecchi-2005), not experimental deal research.'
      - 'Transfer objection: kidnapping negotiations are one-shot, life-stakes, no-price interactions; business deals are repeated, multi-issue and priced — the setting the doctrine was built for is the setting most unlike everyday negotiation.'
      - 'Named experimental tension: perspective-taking outperformed empathy on deal outcomes in controlled comparison (galinsky-2008) — the cognitive half of "getting inside their head" carries the measured effect.'
      - 'The title rule conflicts with decision analysis: when a residual gap is small, purely distributive and roughly symmetric, splitting is efficient and fair (raiffa-1982; symmetry is an axiom of the Nash solution, nash-1950).'
    status: honest label is practitioner experience (Tier 4) — partly convergent with listening and rapport research, untested as a system, and wrong where its slogans meet Tier 1 results

  - id: culture-dimension-validity
    question: Do national culture dimensions carry negotiation-relevant information?
    dimension_position: >-
      Hofstede (hofstede-1980) and the comparative programme built on it:
      stable national differences in values predict communication and
      conflict-handling defaults at the table.
    counterpositions:
      - 'Brendan McSweeney (mcsweeney-2002): the dimensions rest on single-company survey data, an unwarranted national-uniformity assumption and doubtful construct identification.'
      - 'Michele Gelfand (gelfand-2011): tightness-looseness of norms captures cross-national variance the value dimensions miss — the construct space is bigger than Hofstede''s axes.'
      - 'Jeanne Brett (brett-2001): cultural knowledge works as prototype, not stereotype; within-culture variance is large, and the person opposite always overrides the country average.'
    status: culture matters and is measurable; dimension scores are coarse priors — teach them with the critique attached

  - id: gender-gap-prescriptions
    question: Is "women should simply negotiate more" sound advice?
    descriptive_position: >-
      Babcock & Laschever (babcock-2003): a measured gender gap in the
      propensity to initiate negotiation compounds into large lifetime
      earnings differences.
    counterpositions:
      - 'Bowles, Babcock & Lai (bowles-2007): evaluators socially penalise women who ask in ways they do not penalise men — the reluctance is partly a rational response to a real cost, and individual-level advice relocates a structural problem onto its targets.'
      - 'Exley, Niederle & Vesterlund (Knowing When to Ask: The Cost of Leaning In, Journal of Political Economy 128, 2020): when asking sometimes backfires, women''s selective asking was not obviously suboptimal — blanket lean-in prescriptions can reduce payoffs.'
    status: the descriptive gap is established; the prescription is contested — teach the backlash evidence with the advice

  - id: bluffing-ethics
    question: Is deceptive bluffing a legitimate part of the game?
    poker_position: >-
      Carr (carr-1968): business bargaining is a game with its own rules, like
      poker; bluffing within those rules is not lying in the moral sense.
    counterpositions:
      - 'G. Richard Shell (shell-1999): the analogy fails — negotiation lacks poker''s agreed rules, voluntary entry and symmetric stakes; his idealist and pragmatist schools both reject Carr, the pragmatist adding that reputations are the field''s memory and deception is usually imprudent as well.'
      - 'Empirical structure of tactic acceptability (robinson-2000): negotiators themselves sharply separate tolerated puffery about reservation prices from condemned misrepresentation of facts and false promises — the everyone-lies flattening does not survive measurement.'
      - 'Legal boundary: material misrepresentation of fact is actionable fraud in most jurisdictions; whatever the game analogy licenses, the law does not follow it.'
    status: the puffery-versus-fraud line is broadly shared in research, teaching and law; the middle band of marginal tactics stays genuinely contested

