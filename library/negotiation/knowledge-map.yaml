# ÆON deep-dive library — negotiation — knowledge map
# Prior structure for the MAPPING phase (products/learn/knowledge-map.md).
# Test it against live research; it does not substitute for mapping.
# Source ids resolve via canonical-sources.yaml.
#
# Epistemic note: negotiation science mixes established laboratory findings
# (anchoring, fixed-pie bias, interpersonal emotion effects), prescriptive
# frameworks born in practice (principled negotiation, decision analysis), and
# practitioner lore with mass reach (tactical empathy). The controversies
# section keeps those strata apart; teaching the subject without them violates
# the protocol's epistemics (protocol/epistemics.md).

package: negotiation
version: 1

overview: >-
  The study of how interdependent parties with mixed motives reach — or miss —
  agreement. Three research traditions feed one field: game-theoretic and
  decision-analytic bargaining (Nash, Schelling, Raiffa), the behavioural
  laboratory programme on biases, anchoring, emotion and social perception
  (Bazerman & Neale, Galinsky & Mussweiler, Van Kleef), and prescriptive
  frameworks distilled from practice (Walton & McKersie's labour relations,
  the Harvard Negotiation Project, crisis negotiation doctrine). The stable
  core vocabulary — BATNA, reservation price, ZOPA, distributive versus
  integrative bargaining, the negotiator's dilemma — is shared across all
  three; the evidence behind specific prescriptions varies by tier.

historical_context:
  - period: 1950-1965
    events: 'Game-theoretic and industrial-relations foundations: Nash''s axiomatic bargaining solution (1950); Schelling''s Strategy of Conflict (1960) on commitment and focal points; Walton & McKersie''s behavioural theory (1965) coins the distributive-integrative distinction.'
  - period: 1965-1981
    events: 'Experimental social psychology of bargaining matures (Pruitt; Rubin & Brown, The Social Psychology of Bargaining and Negotiation, 1975); Harvard Negotiation Project founded (1979); Getting to Yes (1981) carries BATNA and principled negotiation into general culture.'
  - period: 1982-1994
    events: 'Decision-analytic and cognitive turn: Raiffa''s Art and Science of Negotiation (1982); White''s critique of Getting to Yes with Fisher''s reply (1984); Lax & Sebenius name the negotiator''s dilemma (1986); the Neale-Bazerman bias programme runs through Negotiating Rationally (1992).'
  - period: 1995-2010
    events: 'The field broadens: anchoring research matures (Galinsky & Mussweiler 2001); emotion as social information (Van Kleef 2004); cross-cultural frameworks and the Hofstede controversy (Brett 2001; McSweeney 2002); gender and the cost of asking (Babcock 2003; Bowles, Babcock & Lai 2007); subjective value measurement (Curhan 2006).'
  - period: 2010-present
    events: >-
      Practitioner wave led by Voss's Never Split the Difference (2016) makes
      crisis-negotiation lore the default popular entry point; tightness-
      looseness joins the culture toolkit (Gelfand 2011); replication-era
      scrutiny sharpens boundary conditions on laboratory effects; negotiation
      support systems and AI bargaining agents move from laboratory to
      production.

core_concepts:
  - id: interests-vs-positions
    definition: >-
      A position is what a party says it wants; interests are the needs,
      fears and priorities underneath it. Incompatible positions often hide
      compatible interests — the opening move of integrative analysis.
    depends_on: []
    sources: [fisher-ury-1981, walton-mckersie-1965]

  - id: batna
    definition: >-
      Best Alternative To a Negotiated Agreement — the course of action taken
      if talks fail. Bargaining power tracks the quality of alternatives, not
      aggressiveness; the highest-leverage work is improving the BATNA away
      from the table.
    depends_on: []
    sources: [fisher-ury-1981, raiffa-1982]

  - id: reservation-price-and-zopa
    definition: >-
      The reservation price is the worst still-acceptable deal, derived from
      (not identical to) the BATNA; the zone of possible agreement is the
      overlap between the parties' reservation prices. Without a ZOPA, walking
      away beats any agreement.
    depends_on: [batna]
    sources: [raiffa-1982, lax-sebenius-1986]

  - id: distributive-bargaining
    definition: >-
      Value claiming where interests oppose on a single dimension: offers,
      concession patterns, commitments and information control. Named in
      Walton & McKersie's labour-relations theory; strategic logic in
      Schelling.
    depends_on: [reservation-price-and-zopa]
    sources: [walton-mckersie-1965, schelling-1960, raiffa-1982]

  - id: integrative-bargaining
    definition: >-
      Value creation by exploiting differences — in priorities, valuations,
      forecasts, risk tolerance and time preference — through logrolling
      across issues, contingent contracts and adding issues. The pie is
      rarely fixed, and finding that out requires information exchange.
    depends_on: [interests-vs-positions, distributive-bargaining]
    sources: [walton-mckersie-1965, lax-sebenius-1986, thompson-1998, pruitt-1981]

  - id: negotiators-dilemma
    definition: >-
      Creating value requires sharing information; sharing information exposes
      the sharer to value claiming. The tension is structural — competitive
      and cooperative moves live in one game and cannot be defined away
      (Lax & Sebenius).
    depends_on: [distributive-bargaining, integrative-bargaining]
    sources: [lax-sebenius-1986]

  - id: principled-negotiation
    definition: >-
      Fisher & Ury's prescriptive method: separate the people from the
      problem; focus on interests, not positions; invent options for mutual
      gain; insist on objective criteria; know the BATNA. CONTESTED as a
      universal prescription — see controversies (White's critique, power
      asymmetries, the negotiator's dilemma).
    depends_on: [interests-vs-positions, batna]
    sources: [fisher-ury-1981, white-1984, ury-1991]

  - id: anchoring
    definition: >-
      Numeric first offers pull final outcomes toward themselves — the
      anchoring-and-adjustment heuristic applied to bargaining. First offers
      predict final prices; the effect weakens when the recipient focuses on
      the counterpart's alternatives or on own targets (Galinsky &
      Mussweiler's moderation experiments).
    depends_on: [reservation-price-and-zopa]
    sources: [tversky-kahneman-1974, galinsky-mussweiler-2001]

  - id: cognitive-biases
    definition: >-
      Systematic negotiation errors documented in the Bazerman-Neale
      programme: the mythical fixed pie, framing effects on concession
      behaviour, irrational escalation of commitment, overconfidence and the
      winner's curse. Preparation and perspective-taking debias partially,
      not fully.
    depends_on: [anchoring, integrative-bargaining]
    sources: [neale-bazerman-1985, bazerman-neale-1992]

  - id: emotion-as-information
    definition: >-
      Expressed emotion changes counterpart behaviour: anger extracts
      concessions from counterparts with poor alternatives and triggers
      retaliation or impasse otherwise; positive affect signals room to
      claim. Van Kleef's interpersonal programme (basis of the EASI model).
    depends_on: []
    sources: [van-kleef-2004]

  - id: perspective-taking-vs-empathy
    definition: >-
      Cognitive perspective-taking — inferring the counterpart's interests
      and constraints — raised individual and joint outcomes more reliably
      than emotional empathy in controlled comparison (Galinsky, Maddux,
      Gilin & White 2008). The distinction matters when appraising
      empathy-first practitioner advice.
    depends_on: [integrative-bargaining, emotion-as-information]
    sources: [galinsky-2008, galinsky-mussweiler-2001]

  - id: tactical-empathy
    definition: >-
      Voss's practitioner toolkit: mirroring, labelling emotions, calibrated
      open questions, the deliberate "no", accusation audits. TIER 4 LORE —
      distilled from FBI crisis negotiation, not controlled research; its
      documented lineage is the active-listening core and Behavioral Change
      Stairway of crisis-negotiation doctrine (vecchi-2005). Partly
      convergent with listening and rapport research, partly in tension with
      Tier 1 findings — see controversies.
    depends_on: [emotion-as-information, perspective-taking-vs-empathy]
    sources: [voss-2016, vecchi-2005, galinsky-2008]

  - id: subjective-value
    definition: >-
      Negotiation outcomes exceed price: feelings about the instrumental
      result, the self, the process and the relationship form measurable
      subjective value (Curhan's Subjective Value Inventory) that predicts
      willingness to deal again — the corrective to price-only scorekeeping.
    depends_on: []
    sources: [curhan-2006]

  - id: cultural-dimensions
    definition: >-
      Culture shifts defaults for directness of information exchange,
      confrontation norms, trust-building and who sits at the table.
      Hofstede's dimension programme is the contested foundation
      (mcsweeney-2002); tightness-looseness (Gelfand) and Brett's
      prototype-not-stereotype framework are the research-grade correctives.
    depends_on: [distributive-bargaining, integrative-bargaining]
    sources: [hofstede-1980, mcsweeney-2002, gelfand-2011, brett-2001]

  - id: gender-and-negotiation
    definition: >-
      Women initiate negotiations less often (Babcock & Laschever), and
      evaluators penalise women who do initiate more than men (Bowles,
      Babcock & Lai) — a structural asymmetry that turns individual-level
      "just ask" advice into a contested prescription.
    depends_on: [subjective-value]
    sources: [babcock-2003, bowles-2007]

  - id: negotiation-ethics
    definition: >-
      Where persuasion ends and deception begins: Carr's poker-analogy
      defence of bluffing versus its critics, the empirically distinct
      classes of marginal tactics (SINS scale), the legal fraud boundary on
      material misrepresentation, and Shell's poker, idealist and pragmatist
      schools.
    depends_on: [distributive-bargaining]
    sources: [carr-1968, robinson-2000, shell-1999]

mental_models:
  - the table as two simultaneous games — creating and claiming value
  - BATNA as the engine of power, improved away from the table
  - 'the ZOPA line: reservation points, targets and anchors drawn on one axis'
  - differences (priorities, forecasts, risk, time) as the raw material of trades
  - the first offer as a trade between anchoring power and information revelation
  - expressed emotion as a signal the counterpart reads strategically
  - culture as a prior probability about defaults, never a verdict on the person opposite

key_people:
  researchers_and_schools:
    - 'Richard Walton & Robert McKersie — labour-relations origin: distributive, integrative, attitudinal structuring'
    - 'Thomas Schelling — commitment, credibility, focal points; Nobel 2005'
    - 'John Nash — axiomatic bargaining solution'
    - 'Dean Pruitt — experimental social psychology of bargaining; dual-concern groundwork'
    - 'Roger Fisher, William Ury & Bruce Patton — Harvard Negotiation Project, principled negotiation, BATNA'
    - 'Howard Raiffa — decision-analytic school: reservation prices, ZOPA, efficient frontier'
    - 'David Lax & James Sebenius — negotiator''s dilemma, deal design'
    - 'Max Bazerman & Margaret Neale — cognitive bias programme in negotiation'
    - 'Adam Galinsky & Thomas Mussweiler — anchoring and perspective-taking experiments'
    - 'Leigh Thompson — integrative bargaining research; standard textbook'
    - 'Gerben van Kleef — interpersonal emotion effects (EASI model)'
    - 'Jared Curhan — subjective value measurement'
    - 'Jeanne Brett — cross-cultural negotiation'
    - 'Michele Gelfand — tightness-looseness of cultures'
    - 'Linda Babcock & Hannah Riley Bowles — gender, the propensity to ask and its social cost'
    - 'Roy Lewicki — ethics of bargaining tactics; standard textbook'
  practitioners_and_critics:
    - 'Chris Voss — FBI crisis negotiation; tactical empathy; the Tier 4 lens of this package'
    - 'James J. White — legal scholar; classic critique of Getting to Yes'
    - 'Albert Z. Carr — the poker-analogy position in bargaining ethics'
    - 'G. Richard Shell — three schools of bargaining ethics'
    - 'Geert Hofstede — culture dimensions; both foundation and target of the culture controversy'
    - 'Brendan McSweeney — methodological critic of the Hofstede programme'

