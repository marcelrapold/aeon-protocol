practical_applications:
  - salary and job-offer negotiation (with the gender-backlash evidence in view)
  - procurement, sales and vendor management
  - deal design in partnerships and acquisitions (logrolling, contingent contracts)
  - labour relations — the field's original laboratory
  - diplomacy and crisis negotiation
  - dispute resolution and mediation preparation (BATNA analysis of the litigation alternative)

failure_modes:
  - collecting tactics without preparation — BATNA, reservation price and targets beat scripts
  - assuming the fixed pie and compromising where trades were available
  - treating Tier 4 practitioner books as settled science — or dismissing them instead of testing their claims
  - running one culture's playbook everywhere
  - scoring success by price alone and burning the subjective value that predicts the next deal
  - confusing firmness on interests with hostility toward people, in either direction

open_questions:
  - how much of the laboratory canon — anchoring magnitudes, emotion effects — survives field settings with experienced negotiators and real stakes?
  - can empathy-based practitioner toolkits be operationalised into controlled trials?
  - how do algorithmic and AI-assisted negotiators change anchoring, information exchange and ethics norms?
  - do culture effects live at the national, organisational or individual level of analysis?
  - what closes the gender gap in outcomes without loading the cost of asking onto individuals?

current_state: >-
  Mature interdisciplinary field with a stable core vocabulary taught in every
  major business and law school; Thompson and Lewicki et al. are the textbooks
  of record, and the Program on Negotiation at Harvard anchors the
  practice-facing side. Active research fronts: emotion, culture, gender,
  subjective value and negotiation technology. The popular market is dominated
  by practitioner books whose reach exceeds their evidence; the replication
  era has left the central anchoring results standing while sharpening their
  boundary conditions. AI bargaining agents are moving from laboratory
  curiosities toward deployed systems, dragging the ethics questions with
  them.
