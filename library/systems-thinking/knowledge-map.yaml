# ÆON deep-dive library — systems-thinking — knowledge map
# Prior structure for the MAPPING phase (products/learn/knowledge-map.md).
# Test it against live research; it does not substitute for mapping.
# Source ids resolve via canonical-sources.yaml.
#
# Epistemic note: systems thinking spans a disciplined technical core
# (control theory, stock-flow simulation, hierarchy theory) and a loose
# popular vocabulary that its own best practitioners criticise. The
# controversies section is load-bearing: teaching the subject without the
# World3 debate and the vague-metaphor critique violates the protocol's
# epistemics (protocol/epistemics.md).

package: systems-thinking
version: 1

overview: >-
  A family of approaches for reasoning about interconnected wholes whose
  behaviour emerges from structure: accumulations (stocks), the flows that
  change them, and closed loops of causation with delays and nonlinearities.
  Rooted in wartime control engineering and cybernetics (Wiener, Ashby),
  generalised by Bertalanffy's general system theory, and turned into a
  simulation discipline by Forrester's system dynamics at MIT. Donella
  Meadows gave it its most influential popular statements — the World3
  scenarios and the leverage-points hierarchy. The field's history is
  inseparable from its controversies: the economists' attack on the world
  models and the recurring charge that "systems thinking" is metaphor
  masquerading as method.

historical_context:
  - period: 1943-1953
    events: >-
      Rosenblueth, Wiener & Bigelow reframe purpose as feedback control
      (1943); Macy conferences (1946-1953) assemble Wiener, McCulloch, von
      Neumann, Mead and Bateson; Wiener's Cybernetics (1948) names the field
      (heims-1991).
  - period: 1952-1962
    events: >-
      Ashby's Design for a Brain (1952) and Introduction to Cybernetics
      (1956) formalise regulation and requisite variety; Society for General
      Systems Research founded (1954, Bertalanffy, Boulding, Rapoport,
      Gerard); Simon's Architecture of Complexity (1962) grounds hierarchy
      and near-decomposability.
  - period: 1956-1971
    events: >-
      Forrester founds system dynamics at MIT Sloan: Industrial Dynamics
      (1961), Urban Dynamics (1969) and its housing-policy controversy,
      World Dynamics (1971), the counterintuitive-behaviour thesis (1971).
  - period: 1972-1981
    events: >-
      The Limits to Growth (1972) sells millions and draws the economists'
      counterattack — Nordhaus' Measurement Without Data (1973), the Sussex
      SPRU Models of Doom (1973), Solow's polemic (1973); the broader
      systems-analysis overreach critique lands (hoos-1972, berlinski-1976,
      lilienfeld-1978); Checkland's soft systems methodology (1981) opens
      the internal front against hard modelling.
  - period: 1982-2000
    events: >-
      System dynamics professionalises (System Dynamics Society, 1983);
      Senge's Fifth Discipline (1990) carries archetypes into management;
      Nordhaus renews the critique (Lethal Model 2, 1992); Barlas codifies
      validation practice (1996); Meadows drafts Leverage Points (1999);
      Sterman's Business Dynamics (2000) becomes the standard text.
  - period: 2001-present
    events: >-
      Meadows dies 2001; Thinking in Systems appears posthumously (2008);
      Turner's tracking studies (2008; update by Herrington 2021) reopen the
      World3 reassessment; stock-flow cognition research (Sterman school)
      moves the field toward evidence about learners; critical systems
      thinking consolidates (jackson-2019); the vocabulary spreads into
      sustainability science, public health and popular management — with
      the dilution problem in tow.

core_concepts:
  - id: system-and-boundary
    definition: >-
      A system is a set of elements interconnected so as to produce its own
      pattern of behaviour; what counts as inside is a boundary choice made
      for a purpose, not a fact of nature. Every model draws a boundary, and
      boundary critique is where honest modelling starts.
    depends_on: []
    sources: [meadows-2008, bertalanffy-1968, checkland-1981]

  - id: stocks-and-flows
    definition: >-
      Stocks are accumulations (water in a tub, CO2 in the atmosphere, debt,
      trust); flows are their rates of change. A stock integrates its flows
      over time: it rises while inflow exceeds outflow regardless of whether
      flows are falling — the arithmetic behind most systems surprises, and
      empirically the single hardest primitive for learners
      (booth-sweeney-sterman-2000).
    depends_on: [system-and-boundary]
    sources: [forrester-1961, meadows-2008, booth-sweeney-sterman-2000]

  - id: feedback-loops
    definition: >-
      A feedback loop exists when a stock's level influences its own flows.
      Reinforcing (positive) loops amplify — compound interest, arms races;
      balancing (negative) loops seek a goal — thermostats, inventory
      control. Positive and negative are valence-free technical terms from
      cybernetics, not judgements.
    depends_on: [stocks-and-flows]
    sources: [wiener-1948, forrester-1961, meadows-2008]

  - id: delays-and-oscillation
    definition: >-
      Delays between action and effect turn balancing loops into
      oscillators: correction keeps arriving for a state that no longer
      exists. Forrester's supply-chain analysis (the bullwhip effect, later
      the beer game) is the canonical demonstration.
    depends_on: [feedback-loops]
    sources: [forrester-1961, sterman-2000]

  - id: nonlinearity
    definition: >-
      Effects need not scale with causes: saturation, thresholds and shifting
      loop dominance mean a system can behave one way for years and then
      switch modes. Nonlinearity is why loop-diagram intuition and linear
      extrapolation both fail, and why the field insists on simulation.
    depends_on: [feedback-loops]
    sources: [forrester-1961, sterman-2000, meadows-2008]

  - id: structure-generates-behavior
    definition: >-
      The central claim: characteristic behaviour modes — exponential growth,
      goal-seeking, S-shaped growth, oscillation, overshoot and collapse —
      are produced by stock-flow-feedback structure, not by external events
      or villains. Explanation moves from events to patterns to structure.
      CONTESTED at its ambitious end — see the validation controversy.
    depends_on: [stocks-and-flows, feedback-loops, delays-and-oscillation, nonlinearity]
    sources: [forrester-1961, meadows-2008, sterman-2000]

  - id: cybernetic-regulation
    definition: >-
      Control as error-correction: a regulator senses deviation from a goal
      and feeds back compensating action. Unifies servomechanisms, organisms
      (homeostasis) and organisations; the historical root of the whole
      field and still its most rigorous corner.
    depends_on: [feedback-loops]
    sources: [rosenblueth-wiener-bigelow-1943, wiener-1948, ashby-1956]

  - id: requisite-variety
    definition: >-
      Ashby's law: a regulator can only hold outcomes steady if it can match
      the variety of the disturbances it faces — "only variety can destroy
      variety". Conant & Ashby's good-regulator theorem adds that effective
      regulation requires an internal model of the system. Apply to social
      organisations with care: the formal results concern well-defined
      variety sets, and loose managerial invocations are part of what the
      vagueness critics attack.
    depends_on: [cybernetic-regulation]
    sources: [ashby-1956, conant-ashby-1970]

  - id: hierarchy-and-near-decomposability
    definition: >-
      Complex systems are hierarchies of subsystems with dense internal and
      sparse external interactions (Simon). This is why analysis and
      decomposition still work inside a systems view — the disciplined
      rebuttal to "everything is connected so nothing can be studied apart".
    depends_on: [system-and-boundary]
    sources: [simon-1962]

  - id: policy-resistance
    definition: >-
      Intervening in a multi-loop system triggers compensating feedback:
      the system pushes back, and intuitive policies often worsen or merely
      displace the problem (Forrester's counterintuitive-behaviour thesis;
      Urban Dynamics is the contested primary exhibit). A powerful caution —
      and, overextended, a licence for technocratic fatalism its critics
      reject.
    depends_on: [structure-generates-behavior, cybernetic-regulation]
    sources: [forrester-1971-counterintuitive, forrester-1969, meadows-2008]

  - id: system-archetypes
    definition: >-
      Recurring loop structures with recurring pathologies: limits to
      growth, shifting the burden, escalation, success to the successful,
      tragedy of the commons. Useful as pattern vocabulary (Senge's route to
      the mass audience); risky when the label substitutes for checking the
      actual loops — the internal critique of archetype practice.
    depends_on: [structure-generates-behavior, delays-and-oscillation]
    sources: [senge-1990, sterman-2000, meadows-2008]

  - id: leverage-points
    definition: >-
      Meadows' hierarchy of intervention: parameters are the weakest levers;
      power rises through buffer sizes, feedback gain, information flows,
      rules, self-organisation, goals, and paradigms. Two honest caveats
      carried by the source itself: the ranking is tentative, and people
      routinely push even high-leverage points in the wrong direction.
    depends_on: [policy-resistance, system-archetypes]
    sources: [meadows-1999, forrester-1971-counterintuitive]

  - id: limits-of-models
    definition: >-
      Every model is a bounded, purpose-relative simplification: "all models
      are wrong". Model claims are claims about behaviour modes under
      assumptions, and confidence must be earned by explicit tests
      (barlas-1996) precisely because point prediction is disclaimed. This
      concept carries the field's deepest controversy — see
      model-validation below.
    depends_on: [structure-generates-behavior]
    sources: [sterman-2002, barlas-1996, nordhaus-1973]

mental_models:
  - the bathtub — every stock is a tub with taps and drains; check the arithmetic before the story
  - the thermostat and compound interest — the balancing and reinforcing loop primitives
  - behaviour over time, not events — plot the pattern, then ask what structure produces it
  - delays make showers scald — correction lagging state produces oscillation
  - the regulator as model (Conant-Ashby) — whoever controls must, somewhere, contain a model
  - the leverage hierarchy — parameters < feedback < information < rules < goals < paradigms
  - all models are wrong — a model is a lens with a boundary, never the territory

key_people:
  founders_and_school:
    - 'Norbert Wiener — cybernetics: feedback, control and communication'
    - 'W. Ross Ashby — regulation, requisite variety, the good-regulator theorem (with Conant)'
    - 'Warren McCulloch — Macy conferences chair; neural nets wing of cybernetics'
    - 'Ludwig von Bertalanffy — general system theory, open systems'
    - 'Kenneth Boulding — GST co-founder, systems view in economics'
    - 'Herbert A. Simon — hierarchy, near-decomposability, bounded rationality'
    - 'Jay W. Forrester — founder of system dynamics; industrial, urban and world models'
    - 'Donella H. Meadows — World3 lead author, Leverage Points, Thinking in Systems'
    - 'Dennis L. Meadows & Jørgen Randers — Limits to Growth co-authors and 30-Year Update'
    - 'John D. Sterman — modern system dynamics; misperception-of-feedback experiments'
    - 'Peter M. Senge — organisational-learning branch, system archetypes (popular tier)'
    - 'Peter Checkland — soft systems methodology'
    - 'Stafford Beer — management cybernetics, viable system model'
    - 'George P. Richardson — historiography of feedback thought; critique of loop-diagram practice'
    - 'Michael C. Jackson & Werner Ulrich — critical systems thinking, boundary critique'
  interlocutors_and_critics:
    - 'William D. Nordhaus — economics critique of the world models (1973, 1992)'
    - 'Robert M. Solow — growth-economics polemic against Limits to Growth'
    - 'Sussex SPRU group (Cole, Freeman, Jahoda, Pavitt) — Models of Doom'
    - 'Ida R. Hoos — case evidence against systems analysis in public policy'
    - 'Robert Lilienfeld — systems theory as technocratic ideology'
    - 'David Berlinski — mathematical-foundations critique of systems modelling'
    - 'Graham Turner & Gaya Herrington — data-tracking reassessments on the Meadows side'
    - 'Ugo Bardi — historian of the Limits to Growth controversy'

