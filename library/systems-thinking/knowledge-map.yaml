  - limits-of-models (with the World3 and validation debates)

major_controversies:
  - id: world3-limits-debate
    question: Did the World2/World3 global models produce valid knowledge about long-run limits, and how did their scenarios fare?
    systems_position: >-
      Exponential growth in finite systems with delayed feedback produces
      overshoot and decline as a robust behaviour mode; the standard run put
      the turning points in the mid-21st century, and the modellers
      disclaimed point prediction (meadows-1972; forrester-1971-world).
    counterpositions:
      - 'William Nordhaus (nordhaus-1973): no parameter estimated from data, no prices, no substitution, no technological response — conclusions follow from assumptions ("measurement without data"). Forrester, Low & Mass replied in Policy Sciences (1974).'
      - 'Sussex SPRU, Models of Doom (cole-1973): the collapse result is highly sensitive to resource and technology assumptions; modest parameter changes defer catastrophe indefinitely.'
      - 'Robert Solow (solow-1973): price-mediated substitution is precisely the feedback loop the world models omit; without it, doomsday output is worthless as forecast.'
      - 'William Nordhaus, Lethal Model 2 (nordhaus-1992): twenty years later the mechanisms still fail against data and growth theory, even granting that environmental limits matter.'
    reassessment_note: >-
      Turner (turner-2008) and Herrington (2021, Journal of Industrial
      Ecology) find observed data tracking the standard run more closely
      than optimistic scenarios; Bardi (bardi-2011) documents how "LTG was
      falsified by 2000" became folklore via the static reserve-index table.
      Honest reading: tracking before the modelled divergence point neither
      confirms the collapse mechanism nor rehabilitates the model's economic
      structure — vindication and refutation claims both overreach.
    status: unresolved; the methodological critique stands in economics while the scenario-tracking literature keeps the Meadows side alive — teach the exchange, not a verdict

  - id: model-validation
    question: Can system dynamics models be validated at all, given that they disclaim point prediction and estimate few parameters econometrically?
    systems_position: >-
      Models are for understanding behaviour modes and policy structure;
      confidence is earned through structure-oriented tests — extreme
      conditions, dimensional consistency, behaviour reproduction — rather
      than statistical fit alone (barlas-1996, continuing Forrester & Senge's
      1980 confidence-tests tradition; sterman-2002).
    counterpositions:
      - 'Nordhaus (nordhaus-1973, nordhaus-1992): a model that predicts nothing testable and estimates nothing from data is unfalsifiable social commentary, not science.'
      - 'David Berlinski (berlinski-1976): behind the simulation rhetoric there are no theorems, no error bounds, no validated laws — the mathematics does not support the claims made on its behalf.'
      - 'Ida Hoos (hoos-1972): in actual policy use, systems models imported engineering authority into domains where their assumptions were unexamined and their track record poor.'
    status: unresolved in principle; in practice the field adopted explicit validation protocols, and the critique remains the standard reason economics ignores system dynamics

  - id: metaphor-vs-method
    question: Is "systems thinking" a rigorous method or a vague holistic metaphor that flatters its users?
    critique: >-
      Lilienfeld (lilienfeld-1978): systems theory is an ideology of
      technocratic elites — applicable to everything, refutable by nothing.
      Hoos (hoos-1972) supplies the policy case studies. The management
      version of the charge targets Senge's archetype vocabulary as
      unfalsifiable consulting language (senge-1990 as exhibit).
    internal_response: >-
      The field's rigorous wing concedes most of it: Forrester insisted
      unaided intuition cannot infer dynamics
      (forrester-1971-counterintuitive); Sterman's "All Models Are Wrong"
      (sterman-2002) calls loop-talk without simulation faith-based;
      Richardson's "Problems with Causal-Loop Diagrams" (System Dynamics
      Review, 1986) documents how the field's own favourite diagram misleads
      about accumulation. The disciplined position: diagrams propose,
      simulations dispose.
    status: live on both fronts — the external critique keeps finding fresh buzzword material, and the internal simulation discipline keeps being ignored by popular practice

  - id: hard-soft-critical
    question: Are systems objectively out there to be modelled, or observer-relative constructs — and whose interests do boundary choices serve?
    positions:
      - 'Hard wing (Forrester, Sterman): systems have real structure; models represent it better or worse, and simulation tests the representation (forrester-1961, sterman-2000).'
      - 'Soft wing (Checkland, checkland-1981): human situations lack agreed goals; system models are devices for structuring debate among worldviews, not pictures of reality. Second-order cybernetics (von Foerster, Maturana) radicalises the point — the observer belongs in the system.'
      - 'Critical wing (Ulrich, Critical Heuristics of Social Planning, 1983; jackson-2019): every boundary judgement includes some stakeholders and excludes others; unexamined boundaries smuggle in politics under technical cover.'
    status: settled into methodological pluralism (jackson-2019) — but the underlying realism question is unresolved and shapes what "validation" can even mean

  - id: urban-dynamics-and-policy
    question: Did Urban Dynamics demonstrate counterintuitive policy truth or launder assumptions into provocation?
    systems_position: >-
      Forrester (forrester-1969): the model shows low-income housing
      construction can trap cities in decline by crowding out job-creating
      structures — an honest, if unwelcome, structural result.
    counterpositions:
      - 'Harvey Averch & Robert Levine (RAND, Two Models of the Urban Crisis, 1971): the conclusions follow from contestable assumptions about mobility and employment, not from urban data — the model was calibrated to no actual city.'
      - 'Contemporary planners and housing advocates: omitting racial discrimination, finance structures and regional interdependence excludes the mechanisms that mattered; the counterintuitive result is boundary choice in disguise.'
    status: historically important and unresolved; the standard teaching case for how boundary and assumption critique (hard-soft-critical, limits-of-models) applies to a concrete model

common_misconceptions:
  # summary slot for the MAPPING phase; full entries with evidence and
  # debunking sources live in common-misconceptions.yaml
  - stocks are confused with flows — the field's empirically best-documented learner failure
  - positive feedback read as good, negative as bad
  - '"The Limits to Growth predicted collapse by 2000 and was falsified" — a documented misreading, whose mirror ("it has been proven right") also overreaches'
  - leverage sought in parameters, the weakest intervention class
  - systems thinking equated with drawing causal-loop diagrams, simulation optional
  - '"everything is connected" used to dismiss decomposition and analysis'
  - system dynamics models read as point-prediction machines

practical_applications:
  - supply-chain management — bullwhip-effect diagnosis and inventory policy (the field's origin story)
  - public policy analysis — anticipating policy resistance and side effects before implementation
  - sustainability and resource management — overshoot dynamics, renewable-stock harvesting rules
  - climate communication — stock-flow framing of emissions versus concentrations
  - public health — epidemic and chronic-disease dynamics as stock-flow-feedback systems
  - organisational strategy — archetype diagnosis and learning loops (with the simulation caveat)
  - engineering control — the cybernetic core: regulators, stability, requisite variety

failure_modes:
  - diagramming everything and simulating nothing — arrows without units, loops without tests
  - using "everything is connected" to excuse never drawing a boundary or finishing an analysis
  - selling scenario models as forecasts, then losing the field's credibility when dates pass
  - pushing parameter-level fixes while narrating them in leverage-point language
  - pasting archetype labels onto situations without checking the actual loop structure
  - quoting requisite variety or the good-regulator theorem as management slogans detached from their formal content
  - tribal reading of the World3 debate — accepting or dismissing the models by camp rather than by test

open_questions:
  - what validation standard is appropriate for models of systems that admit no controlled experiment?
  - can the leverage-points ranking be operationalised and tested rather than cited?
  - how far do the formal cybernetic results (requisite variety, good regulator) transfer to human organisations?
  - can stock-flow reasoning be taught at scale, given the robustness of the failure in educated adults?
  - how should aggregate system dynamics relate to agent-based and complexity-science modelling — rivals, complements, or limiting cases?

current_state: >-
  Institutionally alive on several tracks: system dynamics has its society,
  journal (System Dynamics Review) and academic homes (MIT, Bergen, Albany);
  soft and critical systems thinking persist in management science; the
  cybernetic inheritance lives on inside control theory and, diffusely, in
  complexity science. The vocabulary has spread much faster than the
  discipline — sustainability science, public health and management all
  speak fluent "systems", mostly without simulation, which keeps the
  vague-metaphor critique current. The Limits to Growth argument continues
  as a data-tracking literature (Turner 2008, Herrington 2021) opposite a
  mainstream economics that considers the methodological case closed. The
  field's best self-understanding remains Sterman's: all models are wrong,
  and the discipline is in the testing.
