# ÆON deep-dive library — nutrition-fundamentals — package manifest
# Shape: schemas/topic-package.schema.json

id: nutrition-fundamentals
name: Nutrition Fundamentals
version: 1

description: >-
  Nutrition as a body of evidence rather than a set of conclusions: energy
  balance and its honest formulation, the macronutrients and what is actually
  established about each, food quality and processing, micronutrient
  deficiency versus supplementation, and the dietary patterns the diet wars
  were fought over. The spine of the package is methodological, and it is
  deliberately structural rather than a closing caveat. Nutrition is dominated
  by observational epidemiology built on self-reported intake, with pervasive
  confounding, small effect sizes and randomised trials that are short,
  unblindable and expensive. A learner who leaves knowing only the current
  conclusions will be wrong again in five years; a learner who can read a
  food-frequency questionnaire, a metabolic-ward crossover and a prospective
  cohort for what each can and cannot support will stay oriented while the
  headlines flip. Every content concept in this package is therefore taught
  alongside the design that produced it — doubly labelled water against food
  diaries, DIETFITS against the low-fat-versus-low-carb argument, the inpatient
  ultra-processed-food crossover against the processing debate, the
  beta-carotene and vitamin-D trials against the supplement story. This package
  is educational content about the state of the evidence. It is not medical or
  dietary advice, it does not diagnose or treat anything, and clinical
  conditions — diabetes, kidney or liver disease, pregnancy and breastfeeding,
  eating disorders, malabsorption, and any diet undertaken alongside
  medication — warrant guidance from a qualified professional who knows the
  individual.

domains:
  - nutrition science and dietetics
  - energy metabolism and human physiology
  - nutritional epidemiology and study design
  - food science, food technology and processing
  - appetite regulation and behavioural science
  - public health nutrition, guidelines and policy
  - evidence appraisal and epistemics

