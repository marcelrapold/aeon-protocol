popular_lenses:
  - name: Gary Taubes
    role: >-
      Science journalist whose Good Calories, Bad Calories (2007) and Why We
      Get Fat (2011) revived the carbohydrate-insulin argument for a mass
      audience and shaped how a generation of readers frames obesity.
    tier: 4
    note: >-
      Tier 4 popular explanation advancing a contested causal model. The
      historical reporting on how low-fat policy was adopted on thin evidence
      is substantive and partly vindicated by later document work
      (kearns-2016); the mechanistic claim that carbohydrate and insulin
      rather than energy intake drive fat accumulation is directly contested
      by controlled feeding experiments (hall-2015, hall-2016-keto) and is
      taught here as a named controversy, with its strongest academic form
      (ludwig-2021) rather than its popular one.

  - name: Nina Teicholz
    role: >-
      Journalist and author of The Big Fat Surprise (2014), the most widely
      read revisionist account of the saturated-fat guidelines.
    tier: 4
    note: >-
      Useful for the question it forces — how strong was the evidence when the
      recommendation was made — and unreliable as a verdict on the current
      evidence. The book drew formal rebuttals from nutrition researchers as
      well as sympathetic reviews in general-interest media. Read against
      hooper-2020 and sacks-2017-aha on one side and astrup-2020 on the other,
      so the learner meets the live scientific dispute rather than a book
      argument.

  - name: Michael Pollan
    role: >-
      Author of In Defense of Food (2008) and the source of the most quoted
      sentence in popular nutrition, on eating food, not too much, mostly
      plants.
    tier: 4
    note: >-
      A critique of nutritionism — the habit of reducing food to isolated
      nutrients — rather than a research claim, and worth teaching as such.
      The heuristic it produced survives contact with the evidence better than
      most popular advice, which is itself an interesting fact about how much
      of this field's certainty is available without a trial.

  - name: Kevin D. Hall
    role: >-
      Metabolic-ward investigator whose experiments sit under several of this
      package's central results, and an unusually visible scientist in public
      argument about diet.
    tier: 1
    note: >-
      The lens here is not a book but a method. Hall's inpatient studies
      (hall-2015, hall-2016-keto, hall-2019-upf) are tier 1 primary evidence
      and are cited as such. He is also a named party in a live dispute with
      carbohydrate-insulin-model proponents (hall-2022-ebm against
      ludwig-2021), and learners meet him through public exchanges rather
      than through the papers. Cite the experiments, name the dispute, and do
      not treat either side's public confidence as evidence.
