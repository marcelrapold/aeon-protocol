major_controversies:
  - id: carbohydrate-insulin-versus-energy-balance
    question: >-
      Is obesity primarily driven by the hormonal response to diet
      composition, or by energy intake within a regulated system?
    background: >-
      Both camps have published full statements of their position in the same
      journal within a year of each other, which makes this the best available
      teaching example of a live nutrition controversy conducted properly.
    position: >-
      The carbohydrate-insulin model (ludwig-ebbeling-2018, ludwig-2021): a
      high glycaemic load raises postprandial insulin, which partitions fuel
      into storage, producing hunger and reduced expenditure. Composition
      causes overeating; overeating is a symptom rather than the cause. The
      model does not deny energy conservation and explicitly says so; it
      disputes the direction of causation.
    counterposition: >-
      The energy balance model (hall-2022-ebm), supported by direct tests of
      the competing model's own predictions. Under controlled inpatient
      feeding, reducing carbohydrate lowered insulin substantially and
      produced slightly less body fat loss than isocaloric fat restriction
      (hall-2015). An isocaloric ketogenic diet raised energy expenditure by
      roughly a tenth of the magnitude predicted, and slowed fat loss
      (hall-2016-keto). The predictions were stated and they failed
      (hall-2017-cim). The mainstream position is itself not the naive
      accounting version: it holds that the brain regulates intake in response
      to food environment, energy density and palatability.
    what_this_is_not: >-
      Not a claim that diet composition is irrelevant. Composition strongly
      affects satiety, spontaneous intake and adherence, which both camps
      accept. Not a claim that the carbohydrate-insulin model is
      pseudoscience: it is a testable model, its proponents state its
      predictions, and testability is what allowed it to be tested.
    status: >-
      The strong form is largely unsupported by controlled feeding
      experiments. Weak forms are uncontroversial and shared. The remaining
      genuine disagreement is about how much of population-level obesity the
      composition pathway explains, which no ward study can settle because it
      is a question about the food environment over decades.

  - id: saturated-fat-and-cardiovascular-disease
    question: >-
      Should saturated fat intake be limited, and is a nutrient-level target
      the right instrument?
    position: >-
      The institutional position (sacks-2017-aha, who-satfat-2023): replacing
      saturated fat with polyunsaturated fat lowers low-density lipoprotein
      cholesterol and reduces cardiovascular events; pooled randomised trials
      support the replacement (mozaffarian-2010) and formal systematic review
      finds a reduction in combined cardiovascular events of roughly a sixth
      (hooper-2020).
    counterpositions:
      - 'Prospective cohorts do not show a clear association between saturated fat as consumed and coronary disease (siri-tarino-2010, chowdhury-2014) — because in cohorts the replacement nutrient is unspecified, which is a real limitation of cohorts and also a real limitation of the nutrient-level claim.'
      - 'The effect in trials depends on what replaces the fat; replacement with refined carbohydrate does not show the same benefit, and the 1977 policy shift did not specify the replacement.'
      - 'Foods with similar saturated fat content behave differently in outcome studies — the food matrix argument for food-based rather than nutrient-based recommendations (astrup-2020).'
      - 'Recovered data from a large unpublished trial found cholesterol lowering without mortality benefit, and possible harm in older participants (ramsden-2016), which weakens confidence in the surrogate endpoint chain.'
      - 'No pooled analysis has demonstrated a clear reduction in all-cause mortality (hooper-2020), so the strongest honest claim is about events, not death.'
    what_this_is_not: >-
      Not a vindication of the popular claim that saturated fat was
      "exonerated". The randomised replacement evidence for cardiovascular
      events is real and survives formal certainty grading. Nor is it a
      vindication of the guideline as originally issued: the 1977 policy
      preceded the trial evidence that now supports part of it, which is a
      criticism of the process rather than of the current conclusion.
    status: >-
      Genuinely contested at the level of instrument and magnitude, not at the
      level of whether the replacement effect exists. A defensible summary:
      replacing saturated fat with unsaturated fat modestly reduces
      cardiovascular events; replacing it with refined carbohydrate probably
      does not; total mortality effects are unproven; and food-based advice may
      serve people better than a nutrient percentage.

  - id: ultra-processed-food-category-versus-mechanism
    question: >-
      Is industrial processing itself the causal variable, or a proxy for
      properties that could be measured directly?
    position: >-
      The NOVA position (monteiro-2009, monteiro-2019): processing is the
      right axis because it captures formulation, additives and industrial
      purpose that nutrient profiles miss; cohorts consistently associate
      ultra-processed intake with disease (srour-2019); and the inpatient
      crossover shows a causal effect on spontaneous intake with nutrients
      matched (hall-2019-upf).
    counterpositions:
      - 'The classification is imprecise enough that trained coders disagree on the same foods, and it groups items of very different nutritional profile in one category (gibney-2017).'
      - 'The excess intake may be explained by energy density and eating rate rather than by processing as such — a narrower, measurable and testable alternative (forde-2020, rolls-1999).'
      - 'Composition-based definitions such as hyper-palatability are quantifiable from a food database without any judgement about industrial technique (fazzino-2019).'
      - 'The causal trial that anchors the field is twenty people over four weeks on a single pair of menus, unblinded, without identification of the operative property — strong for what it shows, thin for what it is asked to support.'
    what_this_is_not: >-
      Not a claim that processing is irrelevant. The inpatient result is a
      genuine causal finding about spontaneous energy intake and it survives
      the definitional critique. Nor is it a claim that ultra-processed
      classification predicts nothing: the cohort associations are consistent
      even if their mechanism is disputed.
    status: >-
      Open, and the most consequential open question in applied nutrition
      right now, because policy is being written on a category whose causal
      content is unidentified. The productive framing is not category versus
      mechanism but which measurable properties — energy density, eating rate,
      protein and fibre content, hyper-palatable combinations — carry the
      effect.

  - id: certainty-frameworks-in-nutrition
    question: >-
      Should evidence-grading systems developed for drug trials be applied
      strictly to nutritional evidence?
    background: >-
      In 2019 the NutriRECS group applied GRADE to the red and processed meat
      literature, rated the certainty as low to very low, and issued weak
      recommendations that adults continue current consumption
      (johnston-2019-nutrirecs). The response was unusually intense, including
      requests to halt publication and scrutiny of one author's undisclosed
      prior industry-linked work.
    positions:
      - 'For strict application: a framework that reports certainty honestly is doing its job, and an uncomfortable result is not a methodological objection. Most nutritional evidence really is low-certainty by these criteria, and saying so publicly is more defensible than implying otherwise.'
      - 'Against strict application: GRADE was designed for interventions that can be randomised and blinded. Lifelong dietary exposure cannot be. A framework that automatically downgrades all observational evidence will rate the entire field as low-certainty regardless of consistency, dose-response, mechanism and triangulation, producing paralysis rather than calibration (satija-2015, lawlor-2016).'
    what_this_is_not: >-
      Not a dispute about whether red meat is harmful, and it is routinely
      misreported as one. It is a dispute about how to express confidence when
      the best obtainable evidence is structurally imperfect — which is the
      same dispute in miniature that runs through the whole package.
    status: >-
      Unresolved and important. The most useful position for a learner is to
      hold both: certainty grading is right that nutritional evidence is
      weaker than the advice built on it implies, and its critics are right
      that "low certainty" is not the same as "no reason to act".

  - id: validity-of-self-reported-intake
    question: >-
      Is self-reported dietary intake fit for the causal purposes it is put to?
    position: >-
      The strong sceptical position (archer-2013, ioannidis-2018): reported
      intakes in national surveillance are physiologically implausible for a
      large fraction of respondents, error is correlated with the exposures
      and outcomes of interest, and conclusions built on them cannot be
      trusted at the precision claimed.
    counterposition: >-
      The field's reply (willett-2013, satija-2015): questionnaires are
      designed to rank rather than to quantify, the error is characterised and
      partly correctable through calibration studies and energy adjustment,
      biomarker-validated substudies allow the bias to be estimated rather
      than guessed, and consistency across cohorts with different instruments
      and populations carries evidential weight that no single instrument
      does.
    status: >-
      Both are partly right, and the practical rule is more useful than the
      verdict. Treat rankings across large intake contrasts as informative and
      absolute intake figures from questionnaires as uninterpretable. Where a
      finding depends on precise quantities of a single nutrient, treat it as
      a hypothesis. Where it depends on a broad pattern contrast replicated
      across instruments and populations, treat it as evidence.

  - id: personalised-nutrition
    question: >-
      Can individual responses to diet be predicted well enough to prescribe
      differently for different people?
    position: >-
      Individual variation is large and real: glucose responses to identical
      meals differ widely between people and are reproducible within them, and
      are partly predictable from clinical, dietary and microbiome features
      (zeevi-2015). Within-arm variation in diet trials dwarfs between-arm
      differences (gardner-2018-dietfits).
    counterposition: >-
      Demonstrating that variation exists is not the same as having a
      validated prediction rule. DIETFITS prespecified two candidate
      predictors — a multi-locus genotype pattern and baseline insulin
      secretion — and neither predicted who did better on which diet. No
      commercial personalisation product has yet shown, in randomised testing,
      that acting on its predictions improves clinical outcomes relative to
      general advice.
    status: >-
      A real phenomenon with an unproven application. The honest present-day
      statement: variation is the strongest argument for choosing a pattern
      you can adhere to, and the weakest available basis for paying for a
      prediction.

  - id: low-fat-policy-history
    question: >-
      Was the low-fat policy shift of the late 1970s a scientific error, and
      what caused the obesity rise that followed?
    background: >-
      The policy history is genuinely unflattering: national quantitative
      targets were issued by a Senate committee in 1977 ahead of the trial
      evidence and over scientific objection (mccgovern-1977), the sugar
      industry had documented undisclosed influence on the preceding review
      literature (kearns-2016), and the guideline process itself was later
      found by a national academies review to need substantial reform
      (nasem-2017-dga-process).
    positions:
      - 'The revisionist case (taubes-2007, teicholz-2014): advice outran evidence, the replacement of fat with refined carbohydrate and sugar was foreseeable and harmful, and the obesity rise followed the guidance.'
      - 'The defence: population fat intake as a percentage of energy fell modestly while total energy intake rose, portion sizes and food availability changed enormously, and nothing in the temporal coincidence identifies a cause. The largest randomised test of a low-fat pattern found no cardiovascular harm and no benefit (howard-2006).'
      - 'The methodological reading, which is the one this package teaches: a temporal correlation between a policy and a population trend, in the presence of simultaneous changes in food supply, portion size, activity, and everything else, is exactly the kind of evidence the package spends its time teaching learners not to accept — and that constraint binds equally on the side one agrees with.'
    what_this_is_not: >-
      Not a defence of the 1977 process, which does not deserve one. Not an
      endorsement of the revisionist mechanism either. The two questions are
      separable: whether the advice was adequately evidenced when issued, and
      whether it caused what followed. The first has a fairly clear answer of
      no; the second is not answerable with the available evidence.
    status: >-
      Historically settled on process, unresolved on causation, and routinely
      collapsed into a single claim by both sides. One of the best exercises
      in the package, precisely because the temptation to over-read is strong
      in whichever direction the learner already leans.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (nine items with
  origins, corrections and evidence); each is attached there to the concept it
  distorts.

practical_applications:
  - reading any nutrition claim through the six questions in reading-nutrition-headlines before deciding whether it changes anything
  - distinguishing, in one's own reasoning, the accounting identity of energy balance from the behavioural question of what determines intake
  - choosing a dietary pattern on adherence fit rather than on claimed mechanism, since that is what the comparison trials actually support
  - using energy density, protein, fibre and volume as the practical levers on appetite, which is where "food quality" cashes out mechanically
  - reading a food label and an ingredient list for what they can support, and recognising where a health claim on packaging is a marketing artefact
  - treating documented deficiency and general supplementation as different acts with different evidence, and testing before treating where a clinician advises it
  - cross-referencing protein targets with training goals rather than with the deficiency-avoidance reference intake (see the strength-training package)
  - noticing when a dietary question is really a sleep, schedule or habit question, and routing it accordingly (see the sleep-science and habit-formation packages)
  - stating plainly, when asked for advice, that this is educational content about evidence and that individual dietary decisions, especially with a clinical condition or medication, belong with a qualified professional

failure_modes:
  - reading a cohort study as if it were a trial, which is the single most common error in the field and in its coverage
  - quoting absolute intakes from questionnaire data, which the instrument cannot produce
  - accepting "the measurement error would only bias toward the null" without checking whether the error is correlated with exposure and outcome
  - evaluating a nutrient claim without asking what replaced the nutrient
  - treating a surrogate endpoint — cholesterol, insulin sensitivity, a glucose curve — as if it were the health outcome
  - converting a mean difference in a diet trial into a prescription, when the within-arm spread is many times larger
  - treating the naive form of "calories in, calories out" as the mainstream scientific position and then refuting it, or defending it as if it were sufficient advice
  - reading the ultra-processed inpatient crossover as settling which property of processed food does the damage
  - generalising a supplement result from a deficient population to a replete one, or the reverse
  - inferring causation from the coincidence of a guideline change and a population trend, in either political direction
  - moralising eating — converting an evidence question into a question about discipline, purity or virtue
  - offering dietary instructions to a person with a clinical condition on the basis of general educational material

open_questions:
  - which measurable property of ultra-processed food drives excess spontaneous intake, and whether the category survives once that property is identified
  - whether any validated method exists for predicting which individual does better on which dietary pattern
  - what the long-term clinical effects of dietary patterns are beyond two years, where almost no randomised evidence exists in any direction
  - how much of the observed diet-disease association in cohorts is residual confounding by socioeconomic position and general health behaviour, and whether triangulation can bound it
  - whether nutritional epidemiology can be reformed by consortium-scale preregistration, better biomarkers and routine sensitivity analysis, or whether the exposure is simply not measurable at the required precision
  - what dietary advice should look like alongside incretin-based weight-loss pharmacotherapy, which changes both the comparison class and the practical question
  - how the evidence differs by sex, across the lifespan and in populations under-represented in the cohorts that produced most of it
  - whether food-based recommendations outperform nutrient-based targets in practice, as the food-matrix argument predicts
  - what the health effects of specific additives, emulsifiers and non-nutritive sweeteners are at ordinary intakes, where mechanistic and animal signals substantially exceed the human evidence

current_state: >-
  A field with a certain core, a contested middle and an overconfident public
  layer. The core is secure: energy conservation holds, deficiencies cause
  specific diseases and correcting them works, fibre and whole grains have a
  consistent and dose-responsive relationship with mortality and disease,
  trans fats are harmful, and replacing saturated fat with unsaturated fat
  modestly reduces cardiovascular events. The contested middle is where most
  public attention goes: the causal weight of diet composition against total
  intake, the operative property of ultra-processed food, the right instrument
  for fat recommendations, and whether individual variation can be predicted
  well enough to act on. The overconfident layer is everything that converts a
  hazard ratio of 1.2 from a questionnaire-based cohort into an instruction.
  The field's own methodologists are its sharpest critics, its main critique
  has been answered rather than ignored, and the reforms under discussion —
  preregistration, biomarker validation, certainty grading, consortium-scale
  replication — are the ordinary machinery of a science correcting itself
  rather than a scandal. Two structural facts will shape the next decade:
  effective weight-loss pharmacotherapy has changed the comparison class for
  every dietary intervention, and continuous monitoring technology is putting
  individual-level data in consumers' hands far ahead of evidence about what
  to do with it. What a learner should come away with is not a diet but a
  reading protocol, and the confidence to say "that is a cohort study" before
  saying anything else. Educational content throughout — not medical or
  dietary advice.
