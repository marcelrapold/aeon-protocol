    - 'Joseph Goldberger — demonstrated pellagra as a dietary deficiency against institutional resistance'
    - 'Ancel Keys — the Minnesota Starvation Experiment, the diet-heart hypothesis and the Seven Countries Study'
    - 'John Yudkin — the sugar hypothesis; the losing side of the 1970s policy argument, partly rehabilitated later'
    - 'Ethan A. H. Sims — the Vermont deliberate-overfeeding experiments'
    - 'Dale A. Schoeller — doubly labelled water as the reference method for free-living energy expenditure'
    - 'Rudolph L. Leibel & Michael Rosenbaum — metabolic-ward measurement of adaptive thermogenesis (Columbia)'
    - 'Kevin D. Hall — inpatient metabolic-ward experiments and dynamic energy-balance modelling (National Institutes of Health)'
    - 'Walter C. Willett & Frank B. Hu — nutritional epidemiology, the cohort programme and dietary pattern analysis (Harvard)'
