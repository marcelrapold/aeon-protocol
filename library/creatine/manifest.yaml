# ÆON deep-dive library — creatine — package manifest
# Shape: schemas/topic-package.schema.json

id: creatine
name: Creatine Supplementation
version: 1

description: >-
  Creatine as biochemistry and as evidence: the phosphocreatine energy system,
  muscle saturation kinetics, the performance literature, the safety record,
  and the newer and much thinner work on cognition, mood and healthy ageing.
  The package exists because creatine sits at an unusual epistemic address —
  one of the best-evidenced sports supplements in existence, carrying one of
  the most persistent myth sets in fitness culture (kidneys, hair, steroids,
  mandatory loading, mandatory cycling), while its fashionable new claims rest
  on far weaker ground than its old ones. Teaching it means holding four
  different confidence levels about one molecule at the same time.
  This package is educational scaffolding about a research literature. It is
  not medical, dietary or clinical advice, and it does not tell any reader
  what to take. Decisions about supplementation — in particular with existing
  kidney disease, with prescription medication, during pregnancy or lactation,
  or for minors — belong with a qualified clinician who knows the individual.

epistemic_core: >-
  The gradient is the lesson. Resistance-training performance and short-burst
  power effects are established findings replicated across decades and
  independent research groups. Renal, hepatic and cardiovascular safety in
  healthy adults at standard doses is strong evidence with a documented
  measurement confound and an honest gap for populations nobody has studied.
  Additional lean-mass and strength gains in older adults training against
  resistance are strong but smaller and more heterogeneous. Cognition, mood
  and healthy-ageing benefits beyond muscle are a reasonable interpretation
  of a small, context-dependent literature — nowhere near the confidence of
  the performance evidence, and any teaching that presents them with equal
  weight is overclaiming. See evidence_gradient in knowledge-map.yaml.

domains:
  - exercise physiology and bioenergetics
  - biochemistry and cellular energy metabolism
  - sports nutrition
  - renal physiology and clinical safety assessment
  - cognitive neuroscience
  - gerontology and sarcopenia research
  - supplement regulation and product quality assurance
  - evidence appraisal and epistemics

