  - product-forms-and-quality
  - regulatory-and-consensus-landscape
  - reading-the-evidence-gradient (capstone pass)

major_controversies:
  - id: cognition-claim-strength
    question: >-
      How strong is the evidence that creatine improves cognition in healthy
      people, and why is it being communicated as though it were as strong as
      the performance evidence?
    background: >-
      The mechanism is not speculative: the brain uses the same creatine
      kinase system, and creatine deficiency syndromes caused by defects in
      synthesis or transport produce severe neurological impairment. That
      makes a cognitive role biologically plausible, which is exactly the
      condition under which weak human evidence gets over-read.
    position: >-
      Supplementation improved working memory and reasoning in young
      vegetarian adults (rae-2003) and attenuated cognitive and mood
      decrements under sleep deprivation (mcmorris-2006); reviews of brain
      creatine metabolism find a coherent rationale and exploratory clinical
      signals (roschel-2021).
    counterposition: >-
      The systematic review of randomised trials in healthy individuals
      (avgerinos-2018) covers six studies and roughly 280 participants, and
      finds improvement confined to short-term memory and reasoning with no
      consistent effect on long-term memory, spatial memory, attention,
      executive function, verbal fluency, reaction time or mental fatigue.
      Doses and durations vary widely, the trials are small and single-site,
      small-study and publication bias are not excluded, and the transport
      limit at the blood-brain barrier means brain stores move far less than
      muscle stores. The populations showing effects are the depleted and the
      stressed, not the rested omnivore the popular claim is aimed at.
    status: >-
      Reasonable interpretation, not established finding. The defensible
      sentence is that creatine may support cognitive performance under
      specific conditions of stress or low dietary intake, and that general
      cognitive enhancement in healthy well-fed adults is not demonstrated.
      Any teaching that gives this the same confidence as the sprint and
      resistance-training evidence is overclaiming, and this package treats
      that as its central failure mode.

  - id: hair-loss-and-the-dht-finding
    question: Does creatine cause hair loss?
    background: >-
      Androgenetic alopecia is driven in part by dihydrotestosterone acting on
      genetically susceptible follicles, so a supplement that raised DHT would
      be a legitimate question rather than an absurd one. That is what makes
      this myth durable: it is built on a real hormone with a real mechanism.
    position: >-
      One trial in twenty college-aged rugby players (van-der-merwe-2009)
      reported serum dihydrotestosterone roughly half again above baseline
      after a week of loading, still elevated after two weeks of maintenance,
      with the DHT to testosterone ratio raised and total testosterone
      unchanged.
    counterposition: >-
      The study measured a hormone, not hair. No hair-density, shedding or
      alopecia outcome was assessed. The reported values were within clinical
      reference ranges, the sample was small and the duration three weeks,
      and the hormone finding itself has not been reproduced. Reviews of the
      wider literature find no controlled evidence that creatine causes hair
      loss, and the great majority of hormone measurements in creatine trials
      concern testosterone, which is consistently unchanged.
    status: >-
      No evidence that creatine causes hair loss. The calibrated statement is
      that one small unreplicated study found a hormone shift whose relevance
      to follicles was never tested, and that a person with strong family
      history of androgenetic alopecia who is worried about it is reasoning
      from a mechanism, not from a finding. Stating it that way is more
      persuasive than dismissal, and it is what the evidence supports.

  - id: renal-safety-and-the-marker-artefact
    question: Does creatine damage the kidneys?
    background: >-
      The alarm has two sources: isolated case reports, and the reliable
      observation that supplementing people show raised serum creatinine — the
      very marker clinical practice uses to estimate kidney function.
    position: >-
      Raised creatinine and reduced estimated GFR in supplementing
      individuals; case reports of renal problems in people using creatine.
    counterposition: >-
      Creatinine is the breakdown product of creatine, so enlarging the pool
      raises the marker by arithmetic rather than by pathology. When renal
      function is measured directly by clearance rather than inferred from
      creatinine, athletes supplementing for months to years show normal
      filtration, tubular reabsorption and membrane permeability
      (poortmans-francaux-1999), and the review literature attributes the
      signal to the artefact (poortmans-francaux-2000). Case reports without
      denominators cannot establish incidence.
    status: >-
      No evidence of renal harm in healthy adults at standard doses, and a
      well-identified mechanism for why the scare persists. The genuine open
      region is elsewhere: significant pre-existing renal disease, where
      supplementation has not been adequately studied and where medical
      supervision is the reasonable position; and multi-decade use, for which
      no study design exists. Distinguishing "shown not to harm in the studied
      range" from "safe for everyone" is the whole discipline here.

  - id: position-stand-independence
    question: >-
      Can the field's most comprehensive syntheses be taken at face value when
      their authors declare industry relationships?
    background: >-
      kreider-2017 and antonio-2021 are the documents any serious treatment
      starts from. They are also position papers of a sports-nutrition society
      whose author group discloses commercial ties in the papers themselves.
    position: >-
      They are the most thorough, most current and most transparent syntheses
      available, they disclose their interests, and their conclusions are
      argued from a large primary literature that any reader can check.
    counterposition: >-
      Comprehensiveness is not independence. A document produced by a field's
      own advocates has systematic reasons to resolve ambiguity favourably,
      and the appropriate response to disclosure is verification rather than
      reassurance.
    status: >-
      The check has been run and it passes for the performance claim:
      independent meta-analyses (branch-2003, nissen-sharp-2003), an
      independent consensus statement (maughan-2018), a government sports
      institute classification (ais-framework) and a regulatory authorisation
      (eu-regulation-432-2012) converge on the same conclusion. Convergence
      across parties with different interests, not the authority of any single
      document, is what makes the claim safe to teach. Where only the position
      papers speak — several of the newer clinical and cognitive claims — the
      convergence argument is unavailable and confidence drops accordingly.

  - id: alternative-forms
    question: Is any marketed alternative to monohydrate actually better?
    position: >-
      Hydrochloride, buffered, ethyl ester and liquid forms are sold on claims
      of better solubility, better absorption, lower effective dose or fewer
      gastrointestinal effects.
    counterposition: >-
      Solubility and stability genuinely differ, and none of that has been
      shown to produce a better outcome. A direct head-to-head against
      monohydrate at low and recommended doses found no advantage in muscle
      creatine content, body composition or training adaptation
      (jagim-2012), and the review of novel forms found none demonstrating
      superior efficacy or safety (jager-2011). Monohydrate is also the
      cheapest and the form the entire evidence base was built on.
    status: >-
      No demonstrated superiority. The burden of proof sits with the
      alternatives and has not been discharged; a price premium for a form
      with less evidence is the inversion of how evidence is supposed to work.

  - id: unstudied-populations-and-durations
    question: >-
      How far does the safety record actually extend beyond the people who
      were studied?
    position: >-
      Position stands describe creatine as well tolerated across a wide range
      including adolescent athletes under appropriate supervision, and point
      to years of monitored use without documented harm.
    counterposition: >-
      The paediatric evidence base is thin, human data in pregnancy and
      lactation are limited, significant renal disease is largely excluded
      from trials by design, and no study design covers decades of continuous
      use in anyone. Extrapolating a clean record in studied healthy adults to
      unstudied groups is exactly the inference the field asks its critics not
      to make in the other direction.
    status: >-
      Genuinely open at the edges, and honestly so. This is where the package
      declines to advise and points to clinical judgement instead — not as a
      disclaimer reflex, but because the evidence really does stop there.

  - id: mood-and-depression-augmentation
    question: Does creatine help depression?
    position: >-
      A randomised trial of creatine added to SSRI treatment in women with
      major depressive disorder reported improved outcomes against placebo
      augmentation (lyoo-2012), and brain-bioenergetic accounts of depression
      offer a mechanism.
    counterposition: >-
      A single trial in a single population is a starting point, not an
      indication. Replication at scale is absent, effect durability is
      unknown, and creatine has no approved role in psychiatric treatment.
    status: >-
      Contested hypothesis. Interesting enough to teach as an open question,
      not established enough to state as a benefit, and firmly outside the
      scope of anything this package advises anyone to do.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (eleven items with
  origins, corrections and evidence); each is attached there to the concept it
  distorts.

practical_applications:
  - >-
    Resistance and team-sport training: monohydrate at a steady daily dose,
    with loading treated as an optional way to reach saturation faster rather
    than a requirement, and consistency valued over timing within the day.
  - >-
    Repeated-sprint contexts, where phosphocreatine resynthesis rate-limits
    the next effort — the situation the mechanism actually predicts a benefit
    for, as opposed to a single maximal effort or a steady-state endurance
    event.
  - >-
    Vegetarian and vegan diets, where baseline muscle and probably brain
    stores are lower, response to supplementation is larger, and the cognition
    signal such as it is has mostly been found.
  - >-
    Older adults training against resistance, where the additive effect on
    lean mass and strength is documented and the outcome of interest is
    functional independence rather than sport performance.
  - >-
    Interpreting a laboratory report: knowing that a raised serum creatinine
    or a lowered estimated GFR in a supplementing person may reflect the
    supplement rather than the kidney, and that cystatin C or a measured
    clearance is what resolves it. This is knowledge for a conversation with a
    clinician, not a substitute for one.
  - >-
    Product selection: certified monohydrate over novel forms and proprietary
    blends, with third-party certification treated as the control for
    contamination risk rather than as marketing — the risk that matters for
    tested athletes under strict liability is what else is in the tub.
  - >-
    Talking someone out of a myth: the misconception file is built to be used
    conversationally, by conceding the real kernel first (the creatinine does
    rise; the DHT reading did happen) and then separating marker from outcome.

failure_modes:
  - >-
    Transferring confidence sideways — accepting the strong performance
    evidence and then extending the same certainty to cognition, mood or
    longevity claims. The signature error of this subject, and the reason the
    evidence gradient is taught first.
  - >-
    Reading "no evidence of harm in healthy adults at standard doses over the
    studied durations" as "proven safe for everyone indefinitely".
  - >-
    Self-interpreting a serum creatinine result in either direction, instead
    of knowing which test resolves the ambiguity and asking for it.
  - >-
    Debunking by dismissal — telling someone the DHT study is nonsense rather
    than explaining that it measured a hormone and not a hair, which is both
    true and more convincing.
  - >-
    Expecting creatine to substitute for training rather than to enable
    marginally more of it, and then judging it against an effect size it was
    never going to produce.
  - >-
    Paying a premium for novel forms while ignoring third-party certification,
    which reverses the actual risk ranking.
  - >-
    Citing a society position stand as a neutral authority without noting its
    declared interests, and equally, dismissing it for those interests without
    checking whether independent bodies agree.

open_questions:
  - whether cognitive effects survive larger, longer, adequately powered trials in healthy well-fed adults
  - how far oral dosing can raise brain creatine at all, and whether higher doses change that rather than only raising cost
  - whether mood and depression augmentation replicates outside small single-site trials
  - the bone-density question in older adults, where results have not converged
  - long-term safety across decades, which no completed study design covers
  - what actually explains non-response beyond high baseline stores — transporter expression, fibre type, diet, or measurement
  - whether creatine has a defensible role in specific clinical populations, where trials are underway and conclusions are not available
  - how much of the current popularity surge will survive contact with the trials it is running ahead of

current_state: >-
  A mature, unusually well-evidenced core surrounded by an expanding and much
  thinner periphery. The performance and body-composition claims have been
  replicated for three decades and endorsed by independent bodies; the safety
  record in healthy adults at standard doses is extensive, with a clearly
  identified measurement artefact explaining most of the folklore against it,
  and with honest gaps for unstudied populations and durations. The older-adult
  literature is real and smaller. The cognition, mood and healthy-ageing
  literature is early, context-dependent and moving faster in public
  conversation than in evidence. The field's live problem is not fraud or
  replication failure but calibration: an old strong finding and a new weak one
  being reported in the same confident voice.
