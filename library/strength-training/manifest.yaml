# ÆON deep-dive library — strength-training — package manifest
# Shape: schemas/topic-package.schema.json

id: strength-training
name: Resistance Training and Muscular Adaptation
version: 1

description: >-
  How skeletal muscle actually adapts to resistance training, and which of the
  gym's countless rules survive contact with the evidence. Mechanical tension
  and motor-unit recruitment, the size principle, neural adaptation versus
  hypertrophy, specificity, and the programming variables that decide outcomes:
  load, volume, frequency, proximity to failure, rest intervals, exercise
  selection and range of motion. Then the interfaces — protein, sleep, recovery
  capacity — and the lifespan case: sarcopenia, women and resistance training,
  and the association between muscular strength and health outcomes.
  The package exists because this field has an unusually good modern evidence
  base sitting underneath an unusually large body of folklore. Almost every
  question a beginner asks has been tested in randomised trials and pooled in
  meta-analyses, and almost every answer they will hear in a gym predates that
  work by decades.
  This package is educational scaffolding about a research literature. It is
  not medical advice, physiotherapy, or individual coaching prescription, and
  it does not tell any reader what to do in a gym. Anyone with a pre-existing
  condition — cardiovascular disease, uncontrolled hypertension, a current or
  recent injury, a musculoskeletal or metabolic diagnosis, pregnancy, or a
  history of surgery — should obtain individual guidance from a qualified
  clinician or an appropriately credentialled coach who knows them.

epistemic_core: >-
  The gradient is the lesson. That resistance training increases strength and
  muscle size, that mechanical tension is the primary hypertrophic stimulus,
  and that progressive overload is required, are established findings.
  Volume-response relationships and the near-equivalence of a wide load range
  for hypertrophy are strong evidence with genuine dispute at the margins.
  Periodisation superiority, optimal frequency, optimal rest intervals and the
  precise cost of training to failure are reasonable interpretations of
  literatures whose effects are small and whose trials are short. Specific rep
  ranges as magic numbers, muscle confusion, the thirty-minute anabolic window
  and the bulky-woman claim are folklore or overstated marketing. A learner who
  leaves this package able to place a gym claim on that gradient before arguing
  about it has learned the subject. See evidence_gradient in knowledge-map.yaml.

