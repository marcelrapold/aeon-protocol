major_controversies:
  - id: volume-dose-response-and-its-limits
    question: >-
      Does hypertrophy keep increasing with weekly hard sets, and if so, up to
      what point?
    background: >-
      Weekly hard sets per muscle group became the standard programming unit
      after the dose-response meta-analysis, and the graded pattern it reported
      is now the operating assumption of most evidence-informed coaching. The
      question is what happens at the edges of the range that was studied, and
      whether the trials underneath the pooled estimate can support the weight
      placed on them.
    position: >-
      Pooled across studies comparing weekly set counts, effect sizes rose in a
      graded way from fewer than five, to five to nine, to ten or more weekly
      sets, with a meta-regression indicating a positive relationship between
      weekly sets and hypertrophy (schoenfeld-volume-2017). The practical
      reading is that volume is the primary hypertrophy dial and that most
      trainees do too little rather than too much.
    counterposition: >-
      Three distinct objections. Methodologically, the included studies are
      mostly short, mostly in untrained or moderately trained participants,
      thinly populated at the highest volumes, and a positive slope inside the
      studied range does not establish that the slope continues. Empirically, at
      least one independent trial in trained men found the moderate volume
      condition performing as well as the highest, consistent with an
      inverted-U (heaselgrave-2019), and the minimalist school argues that
      effort, not set count, is the dominant variable and that the strength
      floor is startlingly low (fisher-steele-2013,
      androulakis-korakakis-2020). Structurally, the volume literature is also
      the part of this field most affected by data-integrity disputes: a number
      of resistance-training trials, several bearing directly on volume, have
      been retracted or flagged with expressions of concern since 2020, so
      pooled estimates in this specific area need their input list checked
      rather than assumed.
    status: >-
      Strong evidence for a positive volume-hypertrophy relationship across the
      commonly trained range; genuinely unresolved at the top of that range and
      genuinely disputed as to whether volume or effort is the dominant term.
      The defensible teaching is that weekly hard sets is the best available
      dial, that more is better within limits set by recovery, and that anyone
      quoting a specific optimal number is reporting a preference as a finding.

  - id: does-hypertrophy-cause-strength
    question: >-
      Is the muscle growth produced by training a cause of the strength gained
      from it?
    background: >-
      Nearly every training programme in existence assumes that building muscle
      builds strength. The assumption is so basic that its evidential status
      went unexamined until two research groups argued it out in print in the
      same journal issue.
    position: >-
      Myofibrillar hypertrophy is a contributory cause of strength gains
      (taber-2019). The weak measured correlations between size change and
      strength change are explained by measurement error in both variables, by
      the short duration of typical training studies, and by neural adaptation
      dominating the period in which those studies run — none of which is
      evidence that size is causally irrelevant.
    counterposition: >-
      Exercise-induced changes in muscle size do not demonstrably contribute to
      exercise-induced changes in strength (loenneke-2019). Within the
      timeframes and populations actually studied, the association between
      hypertrophy and strength gain is weak, confounded, and compatible with
      strength improving for reasons that have nothing to do with the size
      change occurring alongside it.
    status: >-
      Contested hypothesis, and a model of how disagreement should look. Both
      papers are argued positions rather than pooled evidence, both were
      published in the same peer-reviewed venue, and neither has been settled by
      subsequent work. What is not in dispute: strength and size are
      dissociable, early strength gain is largely neural, and architectural
      changes break any simple size-to-force mapping (folland-williams-2007).
      Teach the pair together and resist the urge to award the point.

  - id: periodisation-effect-size
    question: >-
      Does planned variation of training variables beat simply progressing a
      sensible programme?
    position: >-
      Meta-analyses find periodised programmes superior to non-periodised ones
      for maximal strength (rhea-alderman-2004, williams-2017), and the
      practice is embedded in institutional progression guidance for advanced
      trainees (acsm-2009-progression).
    counterposition: >-
      The reported advantage is small, and the comparison is confounded:
      periodised programmes in these trials usually also progress load more
      systematically than their comparators, so part of what is attributed to
      the model belongs to the progression inside it. No periodisation model
      has been shown clearly superior to another despite decades of advocacy,
      which is the pattern expected when the models differ less than their
      proponents believe. The theoretical foundation is also weaker than it
      looks: the general adaptation syndrome (selye-1950) was a model of
      physiological stress in animals and does not license specific mesocycle
      architectures.
    status: >-
      Reasonable interpretation. Periodisation is a useful organising device
      with a modest average advantage for maximal strength, most of which may be
      systematic progression wearing a more impressive name. The honest finding
      — and the one most often omitted when a model is being sold — is that
      periodisation models differ from each other far less than their advocates
      claim.

  - id: failure-and-proximity
    question: How hard does a set have to be?
    background: >-
      The high-intensity tradition holds that momentary failure is what
      guarantees full recruitment and therefore the stimulus. Volume-centred
      practice holds that failure buys recruitment at a fatigue price that
      reduces the total work available.
    position: >-
      Effort is the dominant variable and sets should be taken to or very near
      momentary failure, which removes the guesswork about whether high-
      threshold units were reached (fisher-steele-2013).
    counterposition: >-
      Pooled trials find no clear advantage for failure over non-failure
      training for hypertrophy, with strength results if anything favouring
      stopping short (grgic-failure-2022), and the more granular treatment of
      proximity finds hypertrophy broadly similar across a range of repetitions
      in reserve without enough data to locate a threshold (refalo-2023).
      Failure adds fatigue that reduces subsequent session quality and weekly
      volume, so its cost is paid outside the set in which it is taken.
    status: >-
      Reasonable interpretation on both halves. Sets have to be reasonably hard
      and do not have to end in failure; where exactly the stimulus starts to
      fall off is not known, and specific repetitions-in-reserve prescriptions
      are practical conventions rather than established thresholds. Note also
      that estimating proximity to failure is itself a trained skill that
      inexperienced lifters perform poorly, which is a real limit on any
      prescription written in those units.

  - id: range-of-motion-and-lengthened-training
    question: >-
      Is full range of motion always best, and is there something special about
      training at long muscle lengths?
    position: >-
      Full range of motion is generally equal or superior to partial range for
      hypertrophy and for strength expressed across the full range
      (schoenfeld-grgic-rom-2020, pallares-2021), which supports the
      conventional coaching instruction.
    counterposition: >-
      The picture is more specific than a rule about fullness. Partial-range
      training is superior for strength in the range trained, which is
      specificity rather than an exception. And a growing line of work suggests
      that the lengthened portion of the range carries a disproportionate share
      of the hypertrophic stimulus, which would make some long-length partials
      competitive with full-range work for growth specifically.
    status: >-
      Strong evidence for full range as the sensible default; the lengthened-
      position question is genuinely open and moving. This is the part of the
      package most likely to be out of date first, and an agent using it should
      search for work published after the package version rather than treating
      the default as final.

  - id: machines-versus-free-weights
    question: Is one modality superior for strength or muscle?
    background: >-
      The dispute is unusually identity-laden: free weights carry cultural
      prestige and machines carry a reputation for being for beginners, and
      both reputations predate the comparative evidence.
    position: >-
      Free weights are superior because they demand stabilisation, recruit more
      musculature, and transfer better to sport and daily life — the standard
      argument, supported by electromyographic differences and by
      free-weight-specific strength outcomes.
    counterposition: >-
      Pooled comparison finds comparable hypertrophy between modalities, with
      strength outcomes favouring whichever modality matched the test
      (haugen-2023). That is specificity, not superiority: free-weight training
      wins free-weight tests and machine training wins machine tests, and the
      choice of test decides the winner before the trial begins. Machines also
      permit training closer to failure with less technical breakdown and less
      stabiliser fatigue, which is a real advantage in a hypertrophy context.
    status: >-
      No demonstrated general superiority. The defensible statement is that
      modality is a tool-selection question determined by the goal, the tested
      task, the available equipment and the individual, and that transfer to a
      specific task is the one place where the free-weight argument has real
      force. Anyone claiming a categorical winner is defending a preference.

  - id: strength-and-mortality-causation
    question: >-
      Does being stronger make people live longer, or do healthier people
      happen to be stronger?
    position: >-
      Muscular strength and muscle-strengthening activity are associated with
      lower all-cause, cardiovascular and cancer mortality across very large
      prospective cohorts in many countries, partly independently of aerobic
      activity (ruiz-2008, leong-2015, stamatakis-2018, momma-2022), and grip
      strength outperformed systolic blood pressure as a mortality predictor in
      one major multinational cohort.
    counterposition: >-
      Every one of those designs is observational. Grip strength is a marker of
      general physiological integrity — nutrition, neurological function,
      disease burden, frailty — as much as of trained muscle, and illness
      reduces strength long before it kills, which makes reverse causation a
      leading explanation rather than a footnote. Residual confounding by
      overall health behaviour is unavoidable. No randomised trial with
      mortality endpoints exists or is likely to.
    status: >-
      Association, robust and repeatedly replicated; causation, unestablished.
      The correct sentence is that stronger people die less often in these
      cohorts, that resistance training reliably improves strength, function and
      several intermediate health outcomes in randomised trials, and that the
      step from the first fact to a mortality benefit is an inference and not a
      finding. Institutional guidelines recommending muscle-strengthening
      activity twice weekly (bull-2020, garber-2011) rest on the whole body of
      evidence, not on a demonstrated mortality effect.

  - id: hypertrophy-quality-and-measurement
    question: >-
      Is all measured muscle growth the same thing, and are we measuring it
      well?
    background: >-
      Bodybuilding lore has long distinguished functional from non-functional
      growth, and the research equivalent asks whether the non-contractile
      fraction of muscle can expand disproportionately.
    position: >-
      Sarcoplasmic hypertrophy is a real and distinguishable adaptation, which
      would explain why size and strength changes correlate so imperfectly.
    counterposition: >-
      The review evidence finds the phenomenon plausible under some conditions
      and far from established (roberts-sarcoplasmic-2020), and much of the
      apparent dissociation between size and strength is more parsimoniously
      explained by measurement error, by architectural change and by neural
      adaptation. Underneath sits a broader measurement problem: ultrasound
      muscle thickness, cross-sectional area, lean mass by absorptiometry and
      biopsy fibre area do not measure the same quantity, do not agree well,
      and are frequently reported as though they did.
    status: >-
      Open question rather than settled dispute, and a reminder that the
      dependent variable in this literature is less solid than the arguments
      built on it. Any claim that a programme produced better quality growth
      should be met by asking what was measured and with what precision.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (nine items with origins,
  corrections and evidence); each is attached there to the concept it distorts,
  and each carries the same non-advice framing as this file.

practical_applications:
  - >-
    Reading a training programme structurally: identify the weekly hard sets
    per muscle group, the proximity to failure, the progression rule and the
    recovery provision, and notice that everything else in the document is
    usually decoration. Most programmes differ far less than their marketing.
  - >-
    Choosing loads by purpose rather than by belief: heavy work when the goal is
    maximal strength or the tested task is a maximal lift, a wider range when
    the goal is hypertrophy or when joints, equipment or fatigue argue against
    heavy loading, and either when the goal is general health.
  - >-
    Diagnosing a stall: distinguishing an absence of progressive overload from
    an excess of volume relative to recovery, since the two produce the same
    plateau and call for opposite responses.
  - >-
    Interpreting soreness correctly — as a signal of unfamiliarity rather than
    a measure of stimulus — and therefore not using it to select exercises or
    to judge a session.
  - >-
    Setting the nutrition interface at the level that carries the evidence:
    total daily protein in the region the meta-regression identifies, adequate
    energy, and no anxiety about minutes after a session.
  - >-
    Making the sleep interface a programming variable rather than a moral one:
    when sleep is restricted for a period, expecting reduced training quality
    and adjusting volume, rather than adding volume to compensate. The
    sleep-science package carries the underlying evidence and its controversies.
  - >-
    Understanding load management in the language the evidence supports — how
    much, how fast it increased, how well it was recovered from — rather than
    the language of fragile positions and forbidden movements. This is
    background for a conversation with a clinician or coach, not a substitute
    for one.
  - >-
    Making the lifespan case accurately to an older relative: trainability
    persists into the tenth decade, progressive loading beats reflexively light
    work, low strength now defines sarcopenia ahead of low muscle quantity, and
    the mortality figures are associations. Overclaiming here is unnecessary,
    because the honest version is already compelling.
  - >-
    Evaluating any gym claim with four questions: what outcome was measured, in
    whom, over how long, and was volume equated.

failure_modes:
  - >-
    Optimising the variables that carry small effects — rest seconds, exercise
    order, periodisation model, split design — while the variables that carry
    large ones, consistency and progressive overload, go unmanaged. The
    signature error of the evidence-informed trainee.
  - >-
    Reading a pooled effect size as a personal prescription, when it is a
    statement about a group average built mostly from short studies in
    populations that may not resemble the reader.
  - >-
    Treating the top of a studied range as an optimum, and extrapolating a
    positive slope past the data that produced it. The specific way the volume
    literature is most often misused.
  - >-
    Comparing programmes that were not volume-equated and attributing the
    difference to whichever variable the comparison was nominally about.
  - >-
    Chasing surrogate outcomes — an acute hormone response, an acute
    protein-synthesis measurement, a pump, a sore muscle — because they are
    immediately observable while the outcome of interest takes months.
  - >-
    Confusing novice adaptation with general adaptation: assuming that what
    worked in the first year, or what works in trials on untrained
    participants, describes trained trainees.
  - >-
    Sliding from association to causation on the health outcomes, and thereby
    overselling a case that does not need overselling.
  - >-
    Adopting the fragility narrative — treating specific positions or movements
    as inherently dangerous — and losing the better-supported load-management
    framing along with the training itself.
  - >-
    Debunking by dismissal. Most gym folklore contains a real kernel: rep
    ranges do have specificity effects, variation does have a regional
    rationale, protein timing was a real hypothesis. Removing the false
    conclusion while conceding the kernel is both more accurate and more
    persuasive than contempt.

open_questions:
  - where the upper limit of useful training volume lies, and whether the dose-response is monotonic or an inverted-U
  - how close to failure a set has to be before stimulus is lost, expressed in units a trainee can actually judge
  - whether training-induced hypertrophy causes training-induced strength gain, and how the field would settle it
  - how much of the hypertrophic stimulus is concentrated at long muscle lengths, and what that implies for exercise and range selection
  - whether the effective-repetitions model — the idea that only the final, high-recruitment repetitions of a set matter — is a real mechanism or a convenient heuristic
  - whether sarcoplasmic hypertrophy occurs to a meaningful degree, and whether current measurement tools could detect it if it did
  - what explains individual variation in response and tolerance, and how much reported non-response is measurement error or insufficient dose
  - how well short-trial findings extrapolate to years of training, given that almost the entire programming literature runs six to twelve weeks
  - whether women are studied well enough for sex-specific programming claims, given persistent under-representation and almost no attention to menstrual-cycle or menopausal status in training trials
  - whether the mortality associations reflect any causal contribution of muscular strength at all
  - how much of the published resistance-training literature survives the statistical scrutiny now being applied to it

current_state: >-
  A field with an unusually strong modern evidence base, an unusually loud
  folklore, and an active internal argument about its own methods. The
  mechanisms are settled well enough to teach without hedging: mechanical
  tension, recruitment order, neural adaptation preceding hypertrophy,
  specificity, progressive overload. The programming variables have all been
  meta-analysed, and the honest summary is that they matter less individually
  than the arguments about them imply — volume is the main dial, load is
  flexible for growth and specific for maximal strength, and frequency, rest
  and periodisation are small effects that have been sold as doctrine. The
  health case across the lifespan is strong where it is randomised (function,
  strength, injury prevention in older adults and athletes) and observational
  where it concerns mortality, and the two are constantly conflated in public
  communication. The field's live problems are methodological: short studies,
  small samples, an author network dense enough that independence needs
  checking, dependent variables that do not measure the same thing, and a
  wave of retractions since 2020 that is simultaneously an embarrassment and a
  demonstration that error correction is working. The gap that defines the
  subject is not between good and bad evidence but between what has been
  tested and what is still being repeated.
