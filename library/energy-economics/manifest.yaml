# ÆON deep-dive library — energy-economics — package manifest
# Shape: schemas/topic-package.schema.json
# Subject: how energy systems are financed, priced and transformed — and why
# the arguments about them are so heated. Physics first, cost accounting
# second, policy positions named rather than adjudicated.

id: energy-economics
name: Energy Economics
version: '1'

description: >-
  Energy economics sits on top of physics that does not negotiate and
  underneath politics that does nothing else. This package teaches the three
  layers separately and says plainly which is which. The physical layer —
  conservation of energy, the second law, Carnot and Betz and
  Shockley-Queisser limits, energy density, power density, capacity factor —
  is settled and constrains every technology choice regardless of anyone's
  preferences. The measurement layer — levelised cost of electricity, system
  and integration cost, value-adjusted metrics, energy return on investment,
  subsidy accounting — is where most public disagreement actually lives, and
  it is genuinely disputed, because the numbers depend on boundary choices,
  discount rates and system context that the headline figures hide. The policy
  layer — deployment pathways, technology portfolios, timelines, instrument
  choice — is contested on values as well as on evidence, and this package
  presents it as a set of named positions with their strongest arguments and
  their sharpest published critics, not as a settled moral question. The
  worked controversies are the nuclear construction cost dispute (Lovering,
  Yip and Nordhaus against Koomey, Hultman and Grubler), the hundred percent
  renewables exchange (Jacobson against Clack and colleagues), the transition
  speed argument (Smil and Grubler against Sovacool), the rebound effect
  magnitude debate, and the energy accounting of data centres and Bitcoin
  mining.

domains:
  - energy economics
  - thermodynamics and applied physics
  - electricity market design
  - industrial organisation and regulation
  - environmental and resource economics
  - technology forecasting and innovation studies
  - economic history
  - public policy
  - measurement and applied statistics

