major_controversies:
  - id: interpretation-what-does-the-theory-claim
    question: Is game theory a predictive science of behaviour, a normative logic of strategy, or a collection of illuminating fables?
    positions:
      - 'Rubinstein (rubinstein-1991, rubinstein-2012): models are fables — they discipline strategic intuition but do not and should not promise point predictions; selling them as policy machinery is overreach, said by one of the field''s central theorists about his own work.'
      - 'The applied-design answer (milgrom-2004; Alvin Roth, The Economist as Engineer, Econometrica 2002): spectrum auctions, kidney exchange and school choice are engineering successes where theory demonstrably carried weight — evidence against pure fable-reading.'
      - 'Camerer (camerer-2003): keep the framework, replace literal maximization with empirically calibrated models — prediction is salvageable if the theory becomes behavioural.'
      - 'Green & Shapiro (Pathologies of Rational Choice Theory, 1994): in political science the empirical payoff of rational-choice modelling has been thin — method-driven rather than problem-driven research.'
    status: unresolved; every serious course now has to say which reading it teaches

  - id: behavioural-deviations
    question: Do laboratory deviations refute equilibrium analysis or merely refine its domain?
    positions:
      - 'The anomaly record (guth-1982; nagel-1995; goeree-holt-2001): rejections of positive offers, few steps of iterated reasoning, and payoff-sensitive failures are robust and replicated.'
      - 'Repair wing: quantal response equilibrium (McKelvey & Palfrey, Games and Economic Behavior 1995), level-k / cognitive hierarchy (Stahl & Wilson 1995; Camerer, Ho & Chong 2004), and social preferences (Fehr & Schmidt, QJE 1999) fit the data while keeping equilibrium logic.'
      - 'Defence of the standard theory: payoffs are utilities, not money — many "deviations" are misspecified auxiliary assumptions, not failures of game theory proper; Binmore & Shaked (Journal of Economic Behavior and Organization, 2010) argue the Fehr-Schmidt fairness model was itself over-fitted and selectively calibrated.'
      - 'Gul & Pesendorfer (The Case for Mindless Economics, 2008): economics is answerable to choice data, not to psychological or neural realism — a principled rejection of the behavioural reform program.'
    status: live; the experimental facts are accepted, their meaning is not

  - id: equilibrium-selection-and-refinements
    question: With multiple equilibria everywhere, which one — and did the refinement program answer the question?
    positions:
      - 'Formal refinement program: trembling-hand perfection (Selten, International Journal of Game Theory 1975), strategic stability (Kohlberg & Mertens, Econometrica 1986), general selection theory (Harsanyi & Selten, 1988).'
      - 'Widely acknowledged verdict, stated inside the field: the program produced a zoo of concepts without a consensus selection criterion — standard texts (fudenberg-tirole-1991) present refinements as tools, not as the answer.'
      - 'Schelling''s empirical alternative (schelling-1960; Mehta, Starmer & Sugden, American Economic Review 1994): selection happens through salience and precedent — properties the formal theory deliberately abstracted away.'
      - 'Evolutionary and learning answer (maynard-smith-1982): dynamics select equilibria; but Hart & Mas-Colell (American Economic Review 2003) prove no natural uncoupled dynamics converge to Nash equilibrium in general — the selection problem reappears as a convergence problem.'
    status: unresolved; the multiplicity problem is the field's oldest open wound

  - id: cooperation-and-the-axelrod-legacy
    question: Did Axelrod's tournaments establish that reciprocity solves the problem of cooperation?
    positions:
      - 'Axelrod & Hamilton (axelrod-hamilton-1981, axelrod-1984): reciprocity is a robust, evolutionarily grounded engine of cooperation among egoists.'
      - 'Ken Binmore (Game Theory and the Social Contract, MIT Press 1994; review of Axelrod''s The Complexity of Cooperation, Journal of Artificial Societies and Social Simulation 1998): the tournament was a particular environment, not a theorem; folk-theorem multiplicity means "evolution of cooperation" claims need equilibrium selection arguments Axelrod never supplied.'
      - 'Noise results: under errors tit-for-tat unravels; generosity (Molander, Journal of Conflict Resolution 1985) and win-stay-lose-shift (nowak-sigmund-1993) outperform it — the popular moral of the story is environment-specific.'
      - 'Press & Dyson (PNAS 2012): zero-determinant strategies show repeated games also contain unilateral extortion — the same formal setting that yields cooperation yields exploitation, and which prevails is again a population-dynamics question (Stewart & Plotkin''s follow-ups).'
    status: reciprocity remains a central mechanism, its sufficiency and the tournament's generality are contested

  - id: backward-induction-paradox
    question: Is backward induction — the logical core of sequential analysis — actually justified, and do people follow it?
    positions:
      - 'The paradox (rosenthal-1981; Selten''s chain-store paradox, Theory and Decision 1978): iterating credibility logic to the start of a long game yields predictions that look irrational to everyone, including theorists.'
      - 'Experimental evidence (McKelvey & Palfrey, An Experimental Study of the Centipede Game, Econometrica 1992): subjects do not play the subgame-perfect outcome; play ends in the middle.'
      - 'Aumann (Games and Economic Behavior 1995): common knowledge of rationality logically entails backward induction — the theorem is sound, so the assumptions must be what fails.'
      - 'Binmore (Modeling Rational Players, Economics and Philosophy 1987): the assumptions are incoherent off the equilibrium path — a deviation is evidence against the rationality the induction presupposes.'
      - 'Reputation repair (Kreps, Milgrom, Roberts & Wilson, Journal of Economic Theory 1982): a small probability of irrational types restores cooperation and deterrence as equilibrium phenomena in finitely repeated games.'
    status: logically clarified, behaviourally decided against the naive prediction; teach the theorem with its failure record

  - id: computability-and-large-games
    question: If finding a Nash equilibrium is computationally intractable, in what sense do equilibria describe the world?
    positions:
      - 'Daskalakis, Goldberg & Papadimitriou (The Complexity of Computing a Nash Equilibrium, SIAM Journal on Computing 2009): computing Nash equilibria is PPAD-complete even for two players — no efficient general algorithm is expected.'
      - 'The interpretive thrust, argued across algorithmic game theory: if no computer can find the equilibrium, unaided markets and players plausibly cannot either — equilibrium loses its default status as a prediction for large games.'
      - 'Countercurrents: important classes remain tractable (zero-sum via linear programming; correlated equilibrium is efficiently computable and learnable through regret dynamics — a point associated with Aumann''s concept and modern learning theory), and equilibrium computation at scale demonstrably works in practice (poker AIs Libratus 2017, Pluribus 2019).'
    status: active research frontier; has shifted attention toward correlated equilibrium, learning dynamics and approximation

common_misconceptions: see common-misconceptions.yaml

practical_applications:
  - auction and market design — spectrum auctions, kidney exchange, school choice, ad auctions (the engineering record of mechanism design)
  - industrial organization and antitrust — oligopoly, entry deterrence, collusion as a repeated-game phenomenon
  - negotiation and deterrence — commitment tactics, focal points, credible threats (Schelling's toolbox, used from diplomacy to labour bargaining)
  - evolutionary biology — animal conflict, sex ratios, signalling, cooperation without cognition
  - computer science and AI — protocol and incentive design, algorithmic game theory, security games, superhuman poker
  - everyday coordination — conventions, standards battles, meeting points, driving sides

failure_modes:
  - learning the prisoner's dilemma as "game theory proves people are selfish" — it is a statement about a payoff structure, not about human nature
  - treating Nash equilibrium as a prediction machine while skipping selection, learning and computation
  - retelling Axelrod as "tit-for-tat is the best strategy" — the tournament qualifications are the content
  - importing zero-sum intuition into mixed-motive situations, the exact error Schelling wrote against
  - skipping expected utility and dominance to get to buzzwords — nothing downstream is intelligible without them
  - taking the film version of Nash's insight at face value
  - reading only popularisations (dixit-nalebuff-1991, poundstone-1992) and never meeting the experimental record or the interpretation debate

open_questions:
  - equilibrium selection — no accepted general theory after six decades
  - how equilibrium is reached — which learning or evolutionary dynamics converge, given the Hart & Mas-Colell impossibility
  - which repair model of behaviour (quantal response, level-k, social preferences) deserves default status, and by what criterion
  - what solution concept should replace Nash where it is intractable — correlated equilibrium, approximation, or something new
  - how far one-shot anonymous cooperation (documented in the lab and field) can be reconciled with repeated-game explanations

current_state: >-
  Mainstream and load-bearing: game theory is the standard language of
  microeconomic theory, industrial organization, auction and market design,
  and much of evolutionary biology and computer science, with a long Nobel
  record (1994, 1996, 2002, 2005, 2007, 2012, 2020). The high-theory
  refinement program has receded; energy has moved to behavioural and
  experimental work, learning dynamics, algorithmic game theory and applied
  design. The interpretation question — prediction, logic, or fable — remains
  genuinely open, and the field's best practitioners disagree about it in
  print.
