# ÆON deep-dive library — law-of-attraction — package manifest
# Shape: schemas/topic-package.schema.json
#
# Epistemic position of this package, stated once and enforced everywhere in
# it: the central claim — that thoughts, feelings or "vibrations" attract
# corresponding outcomes into a person's life — has no credible evidential
# support, no proposed mechanism compatible with tested physics, and the one
# large research programme on the closest measurable question (indulging in
# positive fantasies about a desired future) reports the opposite of what the
# claim predicts. That is said plainly and early, and then the package spends
# its time on what is actually known: the documented intellectual history, the
# cognitive machinery that makes the claim feel true, the real adjacent
# psychology at its real effect size, and the documented harms. Sneering
# teaches nothing; hedging into endorsement would violate the protocol's
# epistemics (protocol/epistemics.md). Neither is done here.

id: law-of-attraction
name: The Law of Attraction
version: 1

description: >-
  The "law of attraction" — the popular claim that thoughts, feelings or
  "vibrations" attract corresponding outcomes — treated as a serious object of
  study rather than as a belief to adopt or a target to mock. The central
  metaphysical claim is unsupported: no controlled evidence shows that mental
  states influence external events except through the actions they motivate,
  and Gabriele Oettingen's research programme on positive fantasies finds that
  indulging in vivid images of a desired future predicts lower effort and lower
  achievement, which is the reverse of the claim. Around that finding the
  package teaches the traceable nineteenth-century New Thought lineage that
  produced the phrase (Quimby, Mulford, Atkinson's 1906 book title, Wattles,
  Hill, Peale, and Byrne's The Secret as the modern mass vector), the real
  adjacent science stated at its honest size and with its limits (goal setting,
  self-efficacy, implementation intentions, expectancy and placebo effects,
  self-fulfilling prophecies including the weak replication picture behind
  Pygmalion), the cognitive machinery that manufactures the experience of
  confirmation (frequency illusion, confirmation bias, survivorship bias in
  testimonials, the Barnum effect, regression to the mean), the misuse of
  quantum mechanics and its route into popular culture, and the documented
  harms — above all the victim-blaming implication that illness, poverty or
  bereavement reflect the sufferer's thoughts. A learner who finishes should be
  better equipped to reason about any claim of this shape. This package is
  educational content about the state of the evidence. It is not medical
  advice and it is not financial advice; it does not diagnose or treat
  anything, and decisions about treatment, money or risk belong with a
  qualified professional who knows the individual.

domains:
  - history of ideas and American religious history
  - psychology of motivation and self-regulation
  - social and cognitive psychology
  - clinical and health psychology
  - behavioural economics and consumer decision making
  - philosophy of science and demarcation
  - quantum foundations, as a misappropriation case
  - sociology of self-help and popular culture
  - science communication and epistemics

