prerequisites: []

# Packages that share method or adjacent evidence, not doctrine. Each link is
# narrow, and the note says how narrow:
#   economic-psychology — the shared ground is the machinery of biased
#     inference: confirmation bias, availability, survivorship in success
#     samples, and regression to the mean. That package also carries the
#     replication crisis as a worked example, which is the discipline this
#     subject needs most.
#   habit-formation — the shared ground is self-regulation that works:
#     implementation intentions, cue-response planning, and the honest effect
#     sizes behind them. It is the constructive destination for a learner who
#     arrived here wanting a method.
#   personality-psychology — the shared ground is the measurement of
#     dispositions such as optimism and generalised expectancies, and the
#     limits of trait-to-outcome inference. No content on attraction is drawn
#     from it.
related_packages:
  - economic-psychology
  - habit-formation
  - personality-psychology

# Person lenses are framing, not authority. They document why learners arrive
# at the subject and which tier the person's material occupies; the package
# teaches the subject, not the person. The first two lenses below are tier 4
# and are catalogued as the object of study. The third is included because a
# learner who arrives through the first two deserves to know that there is a
# researcher whose programme addresses the same question with evidence.
popular_lenses:
  - name: Rhonda Byrne
    role: >-
      Australian television producer whose film and book The Secret (2006), and
      its two appearances on The Oprah Winfrey Show in February 2007, made the
      phrase "law of attraction" a global mass phenomenon. Publisher figures
      put the book above thirty million copies in more than fifty languages.
      For most learners this is the entry point to the subject.
    tier: 4
    note: >-
      The lens is framing, not authority. The Secret is tier 4 popular
      explanation and is catalogued here as the object of study, never as
      evidence for anything except its own reception history. Two specific
      things are worth teaching about it. Its own account of its origin refutes
      the ancient-wisdom framing it markets: Byrne has described finding
      Wallace Wattles' The Science of Getting Rich (1910), a New Thought tract
      barely a century old, and the material traces from there straight back
      through Hill, Atkinson and Quimby. And its strongest formulations carry
      the victim-blaming implication directly — that suffering is drawn to the
      sufferer by their own thought — which is where the documented harms of
      this doctrine live. Teach the reach, teach the lineage, teach the harm;
      do not treat the text as a source.

  - name: Napoleon Hill
    role: >-
      Author of Think and Grow Rich (1937), the founding text of the American
      success-literature genre and the bridge between New Thought and modern
      motivational publishing. Cited as an authority by nearly every later
      popular work in this space, including The Secret.
    tier: 4
    note: >-
      Tier 4, and a rare case where the provenance itself is part of the
      lesson. Hill's framing claim — that Andrew Carnegie commissioned him in
      1908 to interview hundreds of successful men and distil their method —
      has no documentary support; Carnegie's biographer David Nasaw has stated
      he found no evidence the two ever met, and Hill began making the claim
      only after Carnegie's death in 1919. Investigative work on Hill's career
      (Novak, Gizmodo/Paleofuture, 2016) documents a long record of failed and
      fraudulent ventures. The book is genuinely important as a cultural
      artefact and as the object of a provenance exercise. It is not a study,
      and its "research base" is not one either.

  - name: Gabriele Oettingen
    role: >-
      Professor of psychology at New York University and the University of
      Hamburg whose research programme on positive fantasies and mental
      contrasting is the empirical centre of this package. Her popular
      synthesis Rethinking Positive Thinking (2014) reached a general audience,
      and the WOOP framing of mental contrasting with implementation
      intentions is widely taught.
    tier: 1
    note: >-
      Two roles, two tiers, and the distinction matters here more than usual.
      The peer-reviewed programme is tier 1 primary research and is cited as
      such (oettingen-mayer-2002, oettingen-pak-schnetter-2001,
      kappes-oettingen-2011); the trade book is tier 4 by genre, and the WOOP
      material sits at tier 4 as well. Read for what the work actually shows:
      that positive expectations and positive fantasies are different objects
      with opposite effects, and that contrasting a wish with the real obstacle
      outperforms indulging in the wish. Two honest caveats belong with it —
      much of the mental-contrasting evidence originates in the author's own
      laboratory, and the effect sizes are those of an ordinary motivational
      intervention, not of a law of nature.
