major_controversies:
  - id: what-the-claim-actually-asserts
    question: >-
      Is the law of attraction a metaphysical claim about causation, or a
      motivational framing device?
    background: >-
      Popular presentations move between two readings. The strong reading is
      causal and metaphysical: mental states produce matching external events
      directly. The weak reading is behavioural: an attitude changes what a
      person notices, attempts and persists at.
    positions:
      - 'The strong reading is what is marketed and what learners arrive believing — byrne-2006 states it without behavioural mediation, and atkinson-1906 states it as literal vibration.'
      - 'The weak reading is what defenders retreat to under challenge, and it is unremarkable: it is self-efficacy, goal commitment and attention, already better described by bandura-1977 and locke-latham-1990 and already measured.'
    status: >-
      Not a scientific controversy but a definitional one, and the reason the
      subject resists ordinary refutation. The disciplined move is to make the
      reading explicit before evaluating anything. The strong reading has no
      evidential support; the weak reading has support and does not need the
      doctrine, because the psychology that carries it already has names,
      mechanisms and effect sizes.

  - id: does-positive-thinking-help
    question: Does thinking positively about a desired future help or hinder achieving it?
    position: >-
      The popular position, and the one embedded in the doctrine: vividly
      imagining the achieved outcome recruits motivation and makes attainment
      more likely.
    counterposition: >-
      Oettingen's programme reports the opposite for fantasies specifically.
      Positive expectations, grounded in past performance, predict effort and
      success; positive fantasies predict lower effort, lower energisation and
      worse outcomes (oettingen-mayer-2002, kappes-oettingen-2011). Pham and
      Taylor add the practical resolution: simulating the process helps,
      simulating the outcome does not (pham-taylor-1999). Norem adds that some
      people do better with rehearsed pessimism (norem-cantor-1986).
    open_edge: >-
      Two honest caveats on the correction itself. Much of the mental
      contrasting and MCII evidence originates in the developing laboratory,
      and large independent pre-registered replications are thinner than the
      popular presentation implies. And the effects are those of a competent
      behavioural intervention, not of a discovered law.
    status: >-
      The direction of the fantasy finding is well established and repeatedly
      demonstrated; the magnitude and generality of the mental-contrasting
      remedy are less settled than its popular framing suggests. Teach the
      finding as the correction and the caveat as part of it.

  - id: pygmalion-and-expectancy
    question: Do other people's expectations shape what a person becomes?
    position: >-
      Rosenthal and Jacobson's classroom experiment reported larger IQ gains
      in randomly designated "bloomers", and is cited as proof that expectation
      creates ability (rosenthal-jacobson-1968).
    counterpositions:
      - 'Thorndike (thorndike-1968): the ability measure was used outside its intended range and some reported baseline scores are implausible, so the gain scores cannot bear the interpretation.'
      - 'Elashoff and Snow (elashoff-snow-1971): reanalysis confines the effect to a few pupils in the earliest grades.'
      - 'Raudenbush (raudenbush-1984): across 18 experiments the effect approaches zero once teachers have already spent time with the pupils — it requires an information vacuum.'
      - 'Jussim and Harber (jussim-harber-2005): real but typically small effects that more often dissipate than accumulate; teacher expectations predict outcomes largely because they are accurate.'
    status: >-
      Expectancy effects exist and are worth knowing; the famous study is not
      the reason to believe it, and the popular version of it is not supported.
      Citing Pygmalion without this apparatus is the single most common way a
      well-meaning treatment of this subject imports a new overclaim while
      correcting an old one.

  - id: self-efficacy-causality
    question: Does confidence produce performance, or track it?
    position: >-
      Bandura's theory and the applied meta-analysis: self-efficacy has causal
      effects on effort, persistence and performance, with an average
      correlation near .38 (bandura-1977, stajkovic-luthans-1998), and negative
      findings arise from analytic artefacts (bandura-locke-2003).
    counterpositions:
      - 'Vancouver and colleagues (vancouver-2001): within a person over time, higher efficacy sometimes predicted lower subsequent performance, consistent with overconfidence reducing effort allocation.'
      - 'Sitzmann and Yeo (sitzmann-yeo-2013): within persons, efficacy behaves largely as a product of past performance rather than a driver of future performance.'
    status: >-
      Genuinely unresolved on the within-person causal question, and directly
      relevant here: the popular doctrine assumes confidence is upstream of
      competence, and the best evidence points the other way at least as often.

  - id: psychosocial-factors-and-cancer-survival
    question: Does attitude or psychological treatment extend cancer survival?
    position: >-
      Spiegel and colleagues reported a survival advantage from
      supportive-expressive group therapy in metastatic breast cancer
      (spiegel-1989), and the idea entered public belief and stayed there.
    counterpositions:
      - 'Goodwin and colleagues (goodwin-2001): a larger multicentre randomised trial found improved mood and pain but no survival benefit; the original authors'' own later replication attempt likewise found no overall survival effect.'
      - 'Petticrew, Bell and Hunter (petticrew-2002): systematic review finds little consistent evidence that coping style influences survival or recurrence, with positive findings concentrated in smaller studies.'
      - 'Coyne, Stefanek and Palmer (coyne-stefanek-palmer-2007): no randomised trial designed with survival as a primary endpoint and unconfounded with medical care has produced a positive effect; and coyne-pajak-2007 found no association between baseline emotional well-being and survival in 1,093 patients.'
      - 'Satin, Linden and Phillips (satin-2009): depressive symptoms are associated with modestly higher mortality — which blocks the overcorrection that psychological state is wholly irrelevant, while remaining an association with adherence, access and disease burden as live explanations.'
    status: >-
      The strong claim is not supported and should not be repeated to
      patients — that is the clearest evidence-based statement in this package,
      and it matters because the claim is used to blame people who are dying.
      Psychosocial care improves quality of life, which is reason enough to
      provide it. The residual depression-mortality association is real,
      unexplained, and not a licence to reinstate the claim.

  - id: how-large-is-the-placebo-effect
    question: How much can expectation actually change a body?
    position: >-
      Hróbjartsson and Gøtzsche (hrobjartsson-gotzsche-2001): measured against
      genuine no-treatment arms, placebo has no significant effect on objective
      or binary outcomes and only small effects on continuous subjective
      outcomes, mainly pain; much of the apparent effect is natural history and
      regression to the mean.
    counterposition: >-
      Researchers in the placebo-mechanism tradition point to demonstrated
      neurobiology — endogenous opioid and dopaminergic mediation of placebo
      analgesia, conditioned immune and motor responses in Parkinson's disease
      — and to open-label placebo trials, arguing that the effect is real and
      mechanistically specific in defined domains even if it is small in the
      aggregate.
    status: >-
      Both are right about different questions, and the resolution is the
      lesson: expectancy has genuine, mechanistically characterised effects on
      symptom experience and on some physiology, and does not have effects on
      the objective course of most disease. The asthma trial (wechsler-2011)
      shows both halves in one experiment.

  - id: goals-gone-wild
    question: Is goal setting safe to recommend?
    position: >-
      Locke and Latham: the theory is among the best-supported in
      organisational psychology, and its failures come from misapplication
      rather than from the theory (locke-latham-2002, locke-latham-2009).
    counterposition: >-
      Ordóñez, Schweitzer, Galinsky and Bazerman (ordonez-2009): overprescribed
      goals narrow attention, distort risk, encourage unethical shortcuts,
      inhibit learning and erode intrinsic motivation, and the field has been
      slow to say so.
    status: >-
      Included because this package recommends goal-directed methods as the
      replacement for the doctrine, and a replacement must carry its own
      warnings. The exchange also models what a real disagreement looks like —
      two named parties, published replies, shared evidence — next to a
      literature that has none because it has no evidence.

  - id: harmful-or-merely-useless
    question: >-
      Is the law of attraction a harmless motivational frame, or does it do
      damage?
    position: >-
      The defence: it functions as an optimism ritual, it costs little, it
      helps people act, and criticising it is punching down at people getting
      through hard times.
    counterpositions:
      - 'Ehrenreich (ehrenreich-2001, ehrenreich-2009): the doctrine makes suffering a personal failure, silences accurate negative information in institutions and in illness, and demands emotional performance from people who are ill.'
      - 'Dixon, Hornsey and Hartley (dixon-hornsey-hartley-2023): stronger manifestation belief is associated with expecting improbable success quickly, attraction to risky investment and reported bankruptcy — cross-sectional, so the direction is unestablished, but the harm is located in decisions rather than in taste.'
      - 'Bowler (bowler-2013) and McGee (mcgee-2005): the structural reading — a doctrine that assigns outcomes to inner states relocates responsibility for economic and medical misfortune onto the person experiencing it.'
    status: >-
      The comfort the practice provides is real and should be acknowledged
      without sarcasm. The harms are documented and are not distributed evenly:
      they fall on the ill, the bereaved and the financially precarious. Both
      can be said at once, and this package says both.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (twelve items with
  corrections and evidence, across all four statuses); each is attached there
  to the concept it distorts.

practical_applications:
  - mental contrasting as the replacement for visualisation — picture the outcome, then name the obstacle in present reality, in that order
  - implementation intentions for anything that fails at initiation — a specific cue bound to a specific response, at the field's largest honest effect size
  - process simulation instead of outcome simulation — rehearse the doing, not the having (pham-taylor-1999)
  - calibrated optimism — optimism about capability, realism about obstacles and base rates, and the knowledge that defensive pessimism is a legitimate strategy for some people
  - goal setting with the documented guardrails from ordonez-2009 — specificity and difficulty, plus attention to what the goal is starving
  - a five-question test for any claim of this shape — what is asserted, what is the mechanism, what would disconfirm it, where is the denominator, who is missing from the sample
  - how to talk with someone who believes it — engage the strong claim rather than the person, acknowledge what the practice does for them, and never argue with someone at their lowest point about why the practice will not work
  - the standing boundary — this is educational content, not medical or financial advice; questions about treatment, money or risk belong with a qualified professional who knows the individual

failure_modes:
  - treating the correction as a licence for contempt; a sneering treatment teaches nothing and loses the reader who most needed it
  - overcorrecting into "attitude is irrelevant" — expectancy, self-efficacy and coping have real, bounded effects, and denying them is the mirror error
  - citing Pygmalion in the Classroom as settled evidence for expectancy effects
  - citing the placebo effect as evidence that mind moves matter, without the no-treatment-arm literature
  - repackaging mental contrasting as a manifestation ritual and losing the obstacle step, which is the entire active ingredient
  - assuming a testimonial is evidence because it is detailed, sincere or numerous
  - delaying medical treatment or a financial decision while working on one's mindset
  - moralising at people who reached for this during illness, unemployment or grief
  - importing a market-size figure or a viral statistic without noting who produced it and why

open_questions:
  - how far mental contrasting and MCII effects hold up in large independent pre-registered trials outside the originating laboratory
  - whether manifestation belief causes risky financial behaviour or is selected by it — dixon-hornsey-hartley-2023 is cross-sectional and cannot say
  - what explains the residual association between depressive symptoms and cancer mortality once adherence, access and disease burden are accounted for
  - whether the labour-market explanation for self-help's appeal (mcgee-2005) survives direct test across countries and periods
  - whether teaching the cognitive mechanisms behind the illusion changes behaviour, or only stated belief
  - the honest ceiling of expectancy effects on objective physiology, and which domains have mechanistically specific placebo responses
  - why the doctrine spreads through some populations and religious traditions far more readily than others

current_state: >-
  The central claim remains unsupported, and the closest thing to a direct
  experimental test of intention acting on the world without action — the
  random-number-generator meta-analysis — found an effect indistinguishable
  from publication bias. The claim is nonetheless more widely held than at any
  point in its history: The Secret is above thirty million copies by publisher
  figures, the United States self-improvement market is estimated at roughly
  13.4 billion dollars for 2022 by a commercial analyst, and the doctrine has
  been repackaged for short-form video under the name manifesting, with
  scripting and numeric rituals circulating as formats. Around it, the adjacent
  science is in good order and largely settled in outline: Oettingen's
  fantasy-versus-expectation finding has stood for over two decades,
  implementation intentions and goal setting are among the better-replicated
  effects in applied psychology with their limits published, the classroom
  expectancy literature has reached a mature and modest verdict, and the
  cancer-survival claim has been examined more thoroughly than most popular
  health beliefs and does not survive. The live research question is not
  whether attraction works but what actually helps people act, at what size,
  and for whom — and the first quantitative studies of the believers themselves
  have only just begun.
