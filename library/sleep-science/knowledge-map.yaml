major_controversies:
  - id: why-we-sleep-accuracy
    question: >-
      How reliable is the field's most influential popularisation, and what
      does the dispute around it teach about source tiers?
    background: >-
      Why We Sleep (walker-2017) brought sleep science to a mass audience and
      still drives much of the lay interest in the subject. Its author is a
      genuine researcher whose peer-reviewed consolidation work
      (walker-stickgold-2004) is not in dispute here.
    critique: >-
      Alexey Guzey (guzey-2019) published a source-checked critique
      concentrating on the book's first chapter: the flagship claim that "the
      shorter your sleep, the shorter your life" contradicts the U-shaped
      mortality association, whose minimum sits near seven hours
      (kripke-2002, cappuccio-2010); the book asserts a WHO declaration of a
      "sleep loss epidemic" for which no source exists; and a figure
      reproduced in the book omits a data bar present in the original study,
      removing a point that complicated the monotonic story. Statistician
      Andrew Gelman's blog covered and extended the critique through
      2019-2020.
    response_and_corrections: >-
      Walker posted "Why We Sleep: Responses to Questions From Readers"
      (walker-2019-response), conceding and correcting some points while
      defending others, without engaging the named critique directly. Critics
      judged the response partial; later printings corrected some passages.
      No formal erratum process exists for trade books — which is itself part
      of the lesson.
    what_this_is_not: >-
      Not a debunking of sleep science. The harms of sleep deprivation are
      tier 1 experimental findings (van-dongen-2003, spiegel-1999), CBT-I's
      first-line status is guideline consensus, and the molecular clock is
      Nobel-grade. The dispute is about a tier 4 book overstating a tier 1-2
      field — and about how popularisers, publishers and readers handle
      corrections.
    status: >-
      The book remains widely read and pedagogically effective; its specific
      contested claims are documented and checkable. Teach the claims from
      the primary tiers and the dispute as an epistemics case study — no
      hagiography, no hit piece.

  - id: function-of-sleep
    question: What is sleep for?
    positions:
      - 'Active systems consolidation: NREM sleep supports hippocampal-neocortical memory dialogue (Diekelmann & Born, The Memory Function of Sleep, Nature Reviews Neuroscience 2010; walker-stickgold-2004).'
      - 'Synaptic homeostasis (SHY): sleep renormalises synaptic weights inflated by waking plasticity (tononi-cirelli-2014); Marcos Frank and others dispute the evidence for net downscaling.'
      - 'Metabolic clearance: the glymphatic account (xie-2013) — currently under direct experimental challenge (miao-2024).'
      - 'Energy conservation and adaptive inactivity: sleep as ecologically timed dormancy (Jerome Siegel, Sleep Viewed as a State of Adaptive Inactivity, Nature Reviews Neuroscience 2009).'
    status: >-
      Unresolved at the core; the accounts are not mutually exclusive, and no
      single-function story commands consensus. A package or course that
      presents one of them as "the answer" is overclaiming.

  - id: glymphatic-replication
    question: Does sleep increase clearance of metabolic waste from the brain?
    position: >-
      Xie and Nedergaard (xie-2013): in sleeping mice, interstitial space
      expands by about sixty percent and amyloid-beta clears faster —
      widely popularised as "sleep washes the brain", including in
      walker-2017.
    counterposition: >-
      Miao, Franks and Wisden (miao-2024): dye clearance is reduced, not
      increased, during sleep and anesthesia in mice; the groups dispute each
      other's tracer and anesthesia methodology.
    status: >-
      Live replication dispute in animal models; human evidence is indirect.
      The popular claim runs far ahead of the settled science.

  - id: sleep-loss-epidemic
    question: Are modern societies chronically sleep-deprived relative to the past?
    position: >-
      Public-health framing (watson-2015 consensus on seven-plus hours;
      popularised as an "epidemic" by walker-2017): large minorities report
      short sleep, and deprivation harms are experimentally established.
    counterpositions:
      - 'Bin, Marshall & Glozier (bin-2012): systematic review of secular trends finds little evidence of a broad decline in adult sleep duration.'
      - 'Yetish et al. with Jerome Siegel (yetish-2015): three pre-industrial societies sleep 5.7-7.1 hours without electricity — the imagined long-sleeping ancestor is not supported.'
      - 'Jim Horne: sleep-debt alarmism overstates average need and pathologises normal variation.'
    status: >-
      Severe, well-documented deprivation exists in identifiable groups
      (shift workers, adolescents on early schedules, clinical populations);
      a civilisation-wide epidemic is contested, and the WHO never declared
      one.

  - id: duration-mortality-causality
    question: Does habitual short (or long) sleep cause earlier death?
    position: >-
      The U-shaped association is robust across cohorts (cappuccio-2010),
      with minimum mortality near seven hours (kripke-2002).
    counterpositions:
      - 'Reverse causation and confounding: illness, depression and inflammation both disturb sleep and kill — cohort adjustment cannot fully separate this (limitation acknowledged in cappuccio-2010 itself).'
      - 'The long-sleep arm: eight-plus hours associates with higher mortality than seven in the same data — rarely popularised because it fits no tidy message (kripke-2002).'
    status: >-
      Association established; causal, dose-shaped claims in either direction
      are overclaims. Experimental restriction evidence (van-dongen-2003,
      spiegel-1999) covers days to weeks, not decades.

  - id: insomnia-treatment
    question: Therapy or pills — and is the hypnotics risk signal real?
    position: >-
      Guideline consensus (qaseem-2016, riemann-2017, edinger-2021): CBT-I is
      first-line for chronic insomnia; hypnotics are a short-term adjunct
      under shared decision-making, with durable CBT-I effects shown
      meta-analytically (trauer-2015).
    counterpositions:
      - 'Kripke (kripke-2012): cohort association of hypnotic prescriptions with mortality and cancer; critics attribute the signal to confounding by indication, and no randomised evidence confirms it.'
      - 'Access critique: too few trained CBT-I clinicians exist for first-line delivery at population scale; digital CBT-I (Espie and others) is the proposed answer, with its own evidence base still maturing.'
    status: >-
      First-line CBT-I is settled guideline consensus across three bodies;
      the magnitude of hypnotic harm and the scalability of CBT-I remain
      genuinely open.

common_misconceptions: >-
  Documented separately in common-misconceptions.yaml (nine items with
  evidence and debunking sources); each is attached there to the concept it
  distorts.

practical_applications:
  - shift-work and jet-lag management from circadian principles — timing light and darkness against the phase-response curve
  - caffeine strategy from adenosine mechanics — masking, half-life, and why it cannot repay sleep pressure
  - CBT-I, including digital delivery, as the evidence-based route out of chronic insomnia — not hygiene checklists
  - adolescent school start times — applying the documented developmental phase delay (Carskadon's work; American Academy of Pediatrics recommendation, 2014)
  - fatigue risk management in safety-critical work — vigilance testing and the subjective-adaptation trap from van-dongen-2003
  - calibrated use of consumer sleep trackers — staging accuracy limits, and orthosomnia as a clinical caution

failure_modes:
  - treating tier 4 books as the field — the exact failure this package exists to prevent (RES-7)
  - perfectionist sleep tracking and sleep effort, which perpetuate the insomnia they measure (the 3P model predicts this)
  - reading the U-shaped mortality curve as a personal causal prescription
  - prescribing sleep hygiene lists for chronic insomnia the guidelines say they do not treat
  - moralising sleep duration at individuals whose need genuinely varies
  - extrapolating single mouse studies (in either direction of the glymphatic dispute) into human health advice

open_questions:
  - why REM sleep exists, and what dreaming is for
  - whether and how glymphatic clearance operates in humans
  - the causal pathways, if any, behind the duration-mortality associations
  - how widely genuine sleep need varies — natural short-sleeper genetics (DEC2 and related variants) against population norms
  - whether digital CBT-I can close the treatment gap at population scale
  - what consumer wearables actually measure, and how their staging should be validated and regulated

current_state: >-
  A mature field with a Nobel-recognised molecular core (2017: Hall, Rosbash,
  Young) and guideline-grade clinical consensus (CBT-I first-line since
  2016-2021), alongside an unsettled central question (function of sleep), a
  live replication dispute (glymphatic clearance), contested epidemiology
  (U-curve causality, secular trends), and a popular discourse that outruns
  its evidence — the corrections debate around its best-selling book is now
  part of the subject itself.
