major_controversies:
  - id: apatheia-and-emotion
    question: Does Stoic therapy of the passions cure something or amputate something?
    stoic_position: >-
      Passions are assents to false value-judgments, so they answer to
      reasoned retraining; what remains is not coldness but blameless first
      movements and the sage's eupatheiai — joy, caution, well-wishing
      (graver-2007, seneca-on-anger, diogenes-laertius-7).
    counterpositions:
      - 'The Peripatetic tradition (carried in cicero-tusculans III-IV): emotions should be moderated, not extirpated — grief and anger in due measure are appropriate responses to real losses and wrongs.'
      - 'Galen, On the Doctrines of Hippocrates and Plato: Chrysippus'' unified rational soul is false psychology — passions rise from non-rational parts, so retraining judgment cannot be the whole cure; Posidonius inside the school had already conceded ground.'
      - 'Martha Nussbaum (nussbaum-1994; developed in Upheavals of Thought, 2001): the extirpation ideal severs attachments to vulnerable external goods — children, friends, country — that are partly constitutive of a full human life.'
      - 'Bernard Williams ("Do Not Disturb", London Review of Books, 1994, reviewing Nussbaum): skepticism about the whole medical model of philosophy as therapy for the emotions.'
    status: >-
      Graver's reading has displaced the "no feelings" caricature in
      scholarship, but whether apatheia is an attractive ideal remains a live
      philosophical dispute — teach the critique with the doctrine.

  - id: ethics-without-physics
    question: Can Stoic ethics stand without providential cosmology?
    positions:
      - 'Yes — Lawrence Becker (becker-1998): a Stoicism updated to post-Darwinian science keeps "follow the facts" and virtue as ideal agency while dropping providence; most modern practice (pigliucci-2017) proceeds on this basis.'
      - 'Julia Annas (The Morality of Happiness, 1993): the ethical theory has its own eudaimonist integrity, relatively independent of cosmic nature — scholarly support for the detachable reading.'
      - 'No — John M. Cooper (cooper-2012, and his critique of Annas in "Eudaimonism, the Appeal to Nature, and Moral Duty in Stoicism", 1996): the ancient discipline flows from the full doctrine, providence included; exercises detached from the physics are a different enterprise wearing the old name.'
    status: >-
      The central fault line of the modern revival; unresolved in
      scholarship. A learner should know which Stoicism — ancient or
      naturalised — a given author is teaching.

  - id: exercises-vs-arguments
    question: Was ancient philosophy primarily lived exercise or reasoned doctrine?
    positions:
      - 'Pierre Hadot (hadot-1995, hadot-1998): philosophy as spiritual exercises — the texts are practice instruments, and the Meditations only make sense as exercises; Michel Foucault adapted this frame ("care of the self"), and Hadot in turn criticised Foucault''s aestheticised version.'
      - 'John M. Cooper (cooper-2012): the way of life was grounded in rigorous argument; exercise-first readings underplay the doctrinal spine and license a Stoicism of techniques without philosophy.'
    status: >-
      A genuine methodological dispute in the scholarship that maps directly
      onto how the subject is taught: practice-first or doctrine-first. This
      package sequences doctrine and practice together on purpose.

  - id: determinism-and-responsibility
    question: Is Chrysippus' compatibilism coherent?
    stoic_position: >-
      Fate operates through us — assent is the principal cause within the
      causal web (the cylinder analogy, reported in Cicero''s De Fato and
      Aulus Gellius); the Lazy Argument fails because outcomes are co-fated
      with the actions producing them (bobzien-1998).
    counterpositions:
      - 'Alexander of Aphrodisias (alexander-on-fate): responsibility requires genuinely open alternatives, which Stoic determinism cannot provide.'
      - 'Carneades and the Academy (reported in Cicero, De Fato): the causal-necessity framing itself is confused; assent cannot be both ours and fated.'
      - 'Modern reconstruction dispute: Bobzien''s "unimpeded agency" reading against interpreters who find alternative-possibilities intuitions in the texts — the fragments underdetermine the answer.'
    status: >-
      Textually fragmentary, philosophically alive — Stoic compatibilism is
      a standing reference point in the contemporary free-will literature.

  - id: dichotomy-vs-trichotomy
    question: Is "dichotomy of control" the right reading of ta eph' hemin?
    positions:
      - 'Revision — William Irvine (irvine-2009): many things are partially up to us (a tennis match, a reputation), so a trichotomy with internalised goals serves practice better.'
      - 'Traditional reading — Massimo Pigliucci (pigliucci-2017) and others: partial-control cases decompose cleanly into what is up to us (training, effort, judgment) and what is not (outcome), so the dichotomy stands and the trichotomy blurs it.'
      - 'Philological point — A. A. Long (long-2002): Epictetus'' phrase means "what is up to us" or "what depends on us"; the word "control" is the translator''s, and total-control readings of the mind are a modern artefact.'
    status: >-
      Practitioner-level debate with a real philological core; low stakes for
      the practice, high stakes for reading Epictetus accurately.

  - id: seneca-question
    question: Can Seneca the courtier-millionaire be squared with Seneca the moralist?
    positions:
      - 'The ancient charge: P. Suillius'' accusations of hypocrisy and usury, preserved in Tacitus (Annals 13.42) — the critique is as old as the career.'
      - 'Modern biography weighs it rather than dismissing it: Emily Wilson, The Greatest Empire: A Life of Seneca (2014) and James Romm, Dying Every Day: Seneca at the Court of Nero (2014).'
      - 'The philosophical defence: the Letters are written by a self-declared prokopton, not a sage (seneca-letters); On the Happy Life confronts the wealth charge directly; preferred indifferents make wealth permissible, though the court of Nero strains any reading.'
    status: >-
      Unresolved and pedagogically valuable: the gap between doctrine and
      biography is part of the material, not an embarrassment to hide.

  - id: revival-fidelity
    question: Is the popular revival teaching Stoicism or selling a distortion?
    positions:
      - 'Fidelity concern — Nancy Sherman (sherman-2021): resilience readings that reduce the school to "sucking it up" invert its actual theory of emotion and its social ethics; the manosphere co-option compounds the error, against the primary evidence of musonius-lectures on women in philosophy.'
      - 'Commercial concern — academic practitioners including Pigliucci distinguish virtue-first Stoicism from life-hack Stoicism in which exercises serve productivity and outcome-chasing, the exact attitude the reserve clause disciplines.'
      - 'The defence: popularisers reach people the academy never will; Stoic Week data (Modern Stoicism''s annual reports, led by Tim LeBon) suggest measurable wellbeing gains among participants, whatever the entry point.'
    status: >-
      A live cultural debate about the reception, not about ancient doctrine;
      the package treats popular material as tier 4 on-ramps, per the
      manifest's lens notes.

practical_applications:
  - cognitive reframing in CBT and REBT descends from the discipline of assent — the documented clinical lineage (ellis-1962, beck-1976, robertson-2010)
  - resilience training under real adversity — James Stockdale's "Courage Under Fire: Testing Epictetus's Doctrines in a Laboratory of Human Behavior" (1993) is the canonical case study; Sherman (sherman-2021) supplies the corrective frame
  - a daily practice architecture that transfers to any discipline: morning premeditation, attention through the day, evening review
  - grief, anger and anxiety work via the judgment model — Seneca's consolations and On Anger as applied manuals
  - leadership and duty under constraint — Marcus' Meditations as the working notebook of a head of state
  - decision hygiene: the reserve clause and the archer model separate process quality from outcome luck

failure_modes:
  - reading "control" maximally — self-blame for outcomes that were never up to us, or fatalism about what is
  - suppression instead of reappraisal — white-knuckling feelings is the lowercase-s misreading, and the opposite of the actual doctrine of assent
  - premeditatio sliding into rumination — the exercise is brief and framed; anxious practitioners can turn it into worry with a Latin name
  - quote-mining Meditations without the system — virtue and indifferents drop out, leaving only toughness slogans
  - instrumentalising virtue as a productivity hack — outcome-chasing is exactly what the reserve clause disciplines away
  - hagiography of the Stoic figures — Seneca's compromises and Marcus' persecutions-era reign belong in the material
  - skipping the physics and logic entirely — the ethics loses its argumentative ground and becomes assertion

open_questions:
  - how much of the physics and theology can be dropped before the practice stops being Stoicism (the Becker-Cooper line)
  - do Stoic exercises produce measurable wellbeing effects beyond generic CBT ingredients — Stoic Week data are encouraging but self-selected and uncontrolled
  - what exactly Chrysippus' compatibilism claimed — the fragments underdetermine the reconstructions (bobzien-1998)
  - unified or partitioned psychology of emotion — the Chrysippus-Posidonius-Galen question, restated in modern cognitive terms
  - how Arrian's transcripts relate to the lost treatises of the early Stoa — how much of "Epictetus" is Epictetus

current_state: >-
  Scholarship is healthy: critical editions, the Cambridge Companion
  tradition, and active debates on emotion, fate and the exercises reading.
  The practice movement is organised (Modern Stoicism, Stoic Week and Stoicon
  since 2012, with annual wellbeing measurement) and the popular wave is
  large enough to have its own counter-literature. The CBT connection is
  acknowledged in the clinical literature's own histories. The main teaching
  risk today is not obscurity but distortion: the loudest sources are tier 4,
  and the corrective scholarship is tier 2 — which is exactly what this
  package's tiering is for.
