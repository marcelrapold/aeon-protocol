# ÆON deep-dive library — stoicism — knowledge map
# Prior structure for the MAPPING phase (products/learn/knowledge-map.md).
# Test it against live research; it does not substitute for mapping.
# Source ids resolve via canonical-sources.yaml.
#
# Epistemic note: Stoicism is doubly contested — as ancient philosophy
# (fragmentary evidence, live scholarly disputes about emotion, fate and
# method) and as a modern revival (secularisation, popularisation,
# co-option). The controversies section carries named counterpositions on
# both fronts; teaching the practice without them violates the protocol's
# epistemics (protocol/epistemics.md).

package: stoicism
version: 1

overview: >-
  Hellenistic school founded by Zeno of Citium in Athens (c. 300 BCE),
  systematised by Chrysippus, adapted for Rome by Panaetius and Posidonius,
  and surviving mainly through the Roman practitioners Seneca, Musonius
  Rufus, Epictetus and Marcus Aurelius. Distinctives: virtue as the only
  good, everything else an indifferent to be selected wisely; emotion as
  judgment, so that the passions respond to reasoned training; a strict
  distinction between what is up to us and what is not; and a program of
  daily exercises that made the philosophy a practiced way of life. Its
  cognitive theory of emotion re-entered the modern world twice — through
  Hadot's scholarship on spiritual exercises and through the founders of
  cognitive-behavioural therapy, who cited Epictetus directly.

historical_context:
  - period: 'c. 300-129 BCE'
    events: >-
      Zeno teaches at the Stoa Poikile in Athens (c. 300 BCE); Cleanthes'
      Hymn to Zeus; Chrysippus (scholarch from c. 232 BCE) builds the logic
      and defends the system — "if there had been no Chrysippus, there would
      have been no Stoa" (Diogenes Laertius 7.183); running debates with
      Epicureans and with Carneades' skeptical Academy.
  - period: 'c. 155-51 BCE'
    events: >-
      Middle Stoa: Panaetius adapts Stoic ethics for Roman public life (his
      role ethics reaches us through Cicero's De Officiis); Posidonius
      dissents from Chrysippus' unified psychology of the passions —
      ammunition Galen later uses.
  - period: '45 BCE-180 CE'
    events: >-
      Cicero's philosophical works (45-44 BCE) preserve Stoic ethics and its
      critics in Latin; Roman Stoa as lived practice: Seneca at Nero's court,
      Musonius Rufus teaching through exile, Epictetus' school at Nicopolis,
      Marcus Aurelius ruling; the "Stoic Opposition" (Thrasea Paetus,
      Helvidius Priscus) resists the principate and pays for it.
  - period: '3rd-17th century'
    events: >-
      The school dies out as an institution (3rd century CE); doctrine
      survives in doxography, hostile witnesses and Christian authors; Justus
      Lipsius' De Constantia (1584) builds Neostoicism for the wars of
      religion; "stoic" enters the vernacular as a temperament word and
      drifts from the philosophy.
  - period: '1903-1998'
    events: >-
      Von Arnim's Stoicorum Veterum Fragmenta (1903-1905) assembles the early
      Stoa's fragments; Lukasiewicz (1934) rehabilitates Stoic logic as
      propositional logic anticipating the modern calculus; Ellis (1962) and
      Beck (1976) found cognitive therapies citing the Stoics; Hadot's
      spiritual-exercises scholarship (1970s-1990s); Becker's A New Stoicism
      (1998) restates the ethics without providential physics.
  - period: '2009-present'
    events: >-
      Popular revival: Irvine (2009), the Modern Stoicism organisation with
      Stoic Week and annual wellbeing measurements (from 2012), Holiday's
      bestsellers (from 2014), Stoicon conferences; growing debates about
      secularisation, commercialisation and manosphere co-option of the
      material.

core_concepts:
  - id: stoic-system
    definition: >-
      Philosophy as three interdependent parts — logic, physics, ethics —
      compared to an egg or a garden (Diogenes Laertius 7.39-40): the ethics
      the moderns practice grew inside an account of knowledge and of nature,
      and the parts were taught together.
    depends_on: []
    sources: [diogenes-laertius-7, long-sedley-1987, sellars-2006]

  - id: impressions-and-assent
    definition: >-
      Experience arrives as impressions (phantasiai); what is up to us is the
      assent we give or withhold. Passions and errors are assents to false
      evaluative impressions — "people are disturbed not by things but by
      their judgments about things" (Enchiridion 5). The Stoic criterion of
      truth, the kataleptic impression, was the Academy's main skeptical
      target (Carneades' indistinguishability argument).
    depends_on: [stoic-system]
    sources: [epictetus-discourses, epictetus-enchiridion, long-sedley-1987]

  - id: dichotomy-of-control
    definition: >-
      Ta eph' hemin: up to us are judgment, impulse, desire and aversion —
      the workings of prohairesis; not up to us are body, property,
      reputation, office (Enchiridion 1). "Dichotomy of control" is a modern
      label and "control" a contested translation — A. A. Long renders it
      "what is up to us"; Irvine's trichotomy is a deliberate revision. See
      the controversy entry.
    depends_on: [impressions-and-assent]
    sources: [epictetus-enchiridion, epictetus-discourses, long-2002, irvine-2009]

  - id: virtue-as-the-only-good
    definition: >-
      Only virtue (practical wisdom expressed as justice, courage,
      temperance) is good, only vice bad; virtue is sufficient for
      eudaimonia. The Socratic inheritance that separates Stoicism from
      Peripatetic ethics, where external goods matter to flourishing.
    depends_on: [stoic-system]
    sources: [diogenes-laertius-7, cicero-de-finibus, long-sedley-1987]

  - id: indifferents-and-selection
    definition: >-
      Everything besides virtue and vice is indifferent to happiness, yet
      ranked: health, wealth and reputation are preferred, their opposites
      dispreferred; the wise select among them "in accordance with nature"
      while staking happiness only on virtue — the archer aims well and holds
      the hitting under reserve (De Finibus III.22). This doctrine blocks
      both the ascetic and the passive reading.
    depends_on: [virtue-as-the-only-good]
    sources: [cicero-de-finibus, diogenes-laertius-7, long-sedley-1987]

  - id: pathe-and-apatheia
    definition: >-
      A passion (pathos) is an excessive impulse resting on a fresh false
      value-judgment; four genera — distress, fear, appetite, pleasure
      (Diogenes Laertius 7.110). Apatheia is freedom from these, not absence
      of feeling: involuntary first movements (propatheiai) remain blameless
      (Seneca, De Ira 2.2-4), and the sage retains eupatheiai — joy, caution,
      well-wishing (7.116). CONTESTED both in antiquity and now — see the
      controversy entry.
    depends_on: [impressions-and-assent, virtue-as-the-only-good]
    sources: [graver-2007, seneca-on-anger, cicero-tusculans, diogenes-laertius-7]

  - id: spiritual-exercises
    definition: >-
      The askesis that makes the doctrine a practice: attention (prosoche),
      morning premeditation (Meditations 2.1), evening self-review (De Ira
      3.36, from Sextius), the view from above, memento mori, periodic
      voluntary discomfort (Letter 18), and acting with the reserve clause
      (hupexairesis — "fate permitting"). Hadot's frame for all of this is
      itself debated — see the exercises-vs-arguments controversy.
    depends_on: [dichotomy-of-control, pathe-and-apatheia]
    sources: [hadot-1995, hadot-1998, seneca-letters, marcus-meditations]

  - id: premeditatio-malorum
    definition: >-
      Rehearsing possible evils before they arrive — exile, loss, death — so
      that nothing strikes as unforeseen and present goods regain their
      taste: Seneca on the burning of Lyon (Letter 91) and on rehearsing
      death (Letter 24); Cicero's praemeditatio futurorum malorum with
      Anaxagoras' "I knew my son was mortal" (Tusculans III.29-31). "Negative
      visualization" is Irvine's 2009 coinage for this; brief rehearsal, not
      rumination.
    depends_on: [spiritual-exercises]
    sources: [seneca-letters, cicero-tusculans, marcus-meditations, irvine-2009]

  - id: stoic-physics
    definition: >-
      A corporealist, continuum physics: an active rational principle (God,
      logos, pneuma) wholly immanent in passive matter; the cosmos a single
      living, providentially ordered being that recurs through periodic
      conflagration (ekpyrosis). The original backdrop of "living according
      to nature" — which is why dropping it is controversial.
    depends_on: [stoic-system]
    sources: [long-sedley-1987, diogenes-laertius-7, inwood-2003]

  - id: fate-and-compatibilism
    definition: >-
      Everything happens through antecedent causes, yet assent remains ours:
      Chrysippus' cylinder distinguishes external triggers from the thing's
      own nature as principal cause; the Lazy Argument ("why call the doctor
      if it is fated?") is answered by co-fated events. Bobzien reconstructs
      Stoic freedom as unimpeded agency rather than alternative
      possibilities. Attacked in antiquity by Alexander of Aphrodisias.
    depends_on: [stoic-physics, impressions-and-assent]
    sources: [bobzien-1998, alexander-on-fate, long-sedley-1987]

  - id: stoic-logic
    definition: >-
      Chrysippus' propositional logic: assertibles (axiomata), connectives,
      the five indemonstrable argument forms — a rigorous alternative to
      Aristotle's term logic, dismissed for centuries and rehabilitated by
      Lukasiewicz (1934) as an anticipation of the propositional calculus.
      In practice terms: the discipline of assent presupposes trained
      reasoning.
    depends_on: [stoic-system]
    sources: [long-sedley-1987, inwood-2003]

  - id: oikeiosis-and-cosmopolitanism
    definition: >-
      Oikeiosis: appropriation widening from self-preservation to reason to
      concern for others — Hierocles' concentric circles to be drawn inward;
      the human being as citizen of the cosmos, so that justice and social
      roles are natural, not optional. Marcus' recurring "what is not good
      for the hive is not good for the bee".
    depends_on: [virtue-as-the-only-good, stoic-physics]
    sources: [cicero-de-finibus, long-sedley-1987, marcus-meditations]

  - id: living-according-to-nature
    definition: >-
      The telos formula: Zeno's "living in agreement" filled out by
      Chrysippus as living according to experience of what happens by nature
      (Diogenes Laertius 7.87-89) — aligning one's own rational nature with
      the rational order of the whole. How much cosmic backing the formula
      needs is the live modern controversy (Becker versus Cooper and the
      Annas debate).
    depends_on: [virtue-as-the-only-good, stoic-physics]
    sources: [diogenes-laertius-7, becker-1998, cooper-2012]

  - id: sage-and-progress
    definition: >-
      The sophos is a regulative ideal — as rare as the phoenix (Seneca,
      Letter 42) — and everyone short of sagehood counts as a fool; what is
      available is prokope, progress, structured by Epictetus' three
      disciplines of desire, action and assent. The doctrine that keeps the
      practice humble and iterative.
    depends_on: [virtue-as-the-only-good, pathe-and-apatheia]
    sources: [epictetus-discourses, long-2002, hadot-1998]

  - id: modern-reception-cbt
    definition: >-
      The documented lineage into psychotherapy: Ellis built rational emotive
      behaviour therapy explicitly on Enchiridion 5; Beck traced cognitive
      therapy's philosophical origins to the Stoics. Shared mechanism:
      cognition mediates emotion, so changed judgments change feeling.
      Differences matter: CBT is an empirically validated clinical method for
      symptom relief, not a eudaimonist virtue ethics.
    depends_on: [impressions-and-assent, pathe-and-apatheia]
    sources: [ellis-1962, beck-1976, robertson-2010]

  - id: modern-stoicism
    definition: >-
      The contemporary revival in three strands: academic reconstruction
      (Becker's A New Stoicism), organised practice with measurement (Modern
      Stoicism, Stoic Week since 2012), and mass popularisation (Irvine,
      Pigliucci, Holiday). Each strand carries its own controversy —
      secularisation, evidence, and fidelity respectively.
    depends_on: [living-according-to-nature, spiritual-exercises, modern-reception-cbt]
    sources: [becker-1998, pigliucci-2017, sherman-2021, holiday-2016]

mental_models:
  - the sorting move — every situation split into what is up to me (judgment, impulse) and what is not (outcome, others, past)
  - impressions as proposals — an impression is an offer to assent, not a command; pause before signing
  - the archer — aim with full craft, hold the hitting under reserve (De Finibus III.22)
  - the actor — you did not cast the role; playing it well is yours (Enchiridion 17)
  - the view from above — zoom out to cosmic scale until the provocation shrinks (Meditations)
  - the inner citadel — the judging faculty as the one unraidable possession (Hadot's figure for Marcus)

key_people:
  founders_and_school:
    - 'Zeno of Citium — founder (c. 334-262 BCE): the telos formula, the early Republic'
    - 'Cleanthes — second scholarch: Hymn to Zeus, providence'
    - 'Chrysippus — third scholarch (c. 280-206 BCE): the logic, the psychology of passions, compatibilism; systematiser of the school'
    - 'Panaetius — Middle Stoa: role ethics for Roman public life (via Cicero''s De Officiis)'
    - 'Posidonius — Middle Stoa polymath: internal dissent on the psychology of the passions'
    - 'Seneca — statesman-practitioner: Letters, On Anger, the consolations'
    - 'Musonius Rufus — the Roman Socrates: askesis in daily life, philosophy for women'
    - 'Epictetus — freed slave, teacher at Nicopolis: prohairesis, the three disciplines'
    - 'Marcus Aurelius — emperor-practitioner: the Meditations'
    - 'Modern: Lawrence Becker (naturalised Stoicism); the Modern Stoicism group (Christopher Gill, John Sellars, Tim LeBon, Donald Robertson); popularisers William Irvine, Massimo Pigliucci, Ryan Holiday'
  interlocutors_and_critics:
    - 'Epicurus and his school — the rival Hellenistic therapy: pleasure and the absence of disturbance against virtue as the only good'
    - 'Carneades and the skeptical Academy — the indistinguishability attack on the kataleptic impression'
    - 'The Peripatetics — metriopatheia (moderated emotion) against apatheia; external goods as ingredients of flourishing'
    - 'Plutarch — Platonist polemicist: On Stoic Self-Contradictions'
    - 'Galen — On the Doctrines of Hippocrates and Plato: partitioned soul against Chrysippus'' unified psychology'
    - 'Alexander of Aphrodisias — On Fate: the Peripatetic case against Stoic determinism'
    - 'Martha Nussbaum — modern critique of extirpating the passions'
    - 'John M. Cooper — critique of the spiritual-exercises reading of ancient philosophy'
    - 'Nancy Sherman — critique of toughness readings of Stoic resilience'

