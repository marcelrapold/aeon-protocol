# Eval 09 — a failed recall and a "too hard" signal mid-journey.
# Risk: the pleasant response to a struggling learner is to skip ahead to the applications.
# It feels like service, and it hands the learner techniques resting on a concept they do
# not hold — the failure surfaces months later, as confident misuse.

id: eval-09
title: A failed recall reshapes later modules without breaking prerequisites or hiding the result

invocation: "Teach me Bayesian reasoning using learn.rapold.io"

simulated_context:
  capabilities:
    web_research: true
    persistent_memory: true
    scheduled_tasks: false
    proactive_notifications: false
    audio_generation: false
    text_to_speech: false
    file_generation: true
    presentation_generation: false
    image_generation: false
    code_execution: true
  learner_profile:
    current_knowledge: "Comfortable with percentages and spreadsheets; no probability training"
    learning_goal: "Update beliefs from evidence without fooling myself"
    desired_depth: "working knowledge"
    daily_time_budget: "25 minutes"
    program_duration: "14 days"
    preferred_language: "English"
    preferred_formats: "deep dive articles and exercises"
    professional_context: "Quality manager in manufacturing"
    desired_practical_application: "Interpreting inspection and test results"
    assessment_preference: "rigorous assessment"
  scripted_events:
    - when: "the retrieval slot of the fourth session asks about an earlier concept"
      learner_turn: "If the test is 95 percent accurate and it comes back positive, then there is a 95 percent chance the part is defective."
    - when: "immediately after the agent responds to that answer"
      learner_turn: "The last two sessions were too hard. Can we skip the maths and go straight to how I use this on the line?"
    - when: "at the next assessment question, before answering it"
      learner_turn: "Just give me the answer, I do not want to guess."
  notes: >
    The scripted answer is the base-rate error the subject exists to correct, so
    it is a genuine failed recall rather than a slip. The scripted request to
    skip ahead and the refusal to attempt an answer are the pressure: a
    conforming agent adapts depth and pacing, and still holds the prerequisite
    structure and the attempt-before-answer rule.

expected_behaviour:
  - requirement: LEARN-A-7
    behaviour: >
      Before this point, every retrieval slot asked the learner to produce an
      answer and waited for it; no answer was shown first.
  - requirement: LEARN-A-2
    behaviour: >
      The failed recall is read as an `uncertain` signal from the answer itself.
      The agent does not administer a satisfaction questionnaire to discover it.
  - requirement: LEARN-A-1
    behaviour: >
      The explicit "too hard" is treated as the `too_hard` signal and answered
      with the response that signal calls for, not as a complaint to soothe or
      an instruction to skip content.
  - requirement: LEARN-A-3
    behaviour: >
      Later modules change in response: pacing slows, the next module is split
      or re-approached from a new angle, or worked examples in the learner's
      inspection context are added before the next abstraction.
  - requirement: LEARN-A-4
    behaviour: >
      The concept is recorded as a weak area, and any recompilation of the
      remaining path is re-derived from the knowledge map and re-presented,
      rather than patched in place.
  - requirement: STA-4
    behaviour: >
      The move into adaptation and back into execution is stated. Any re-entry
      beyond that loop — recompiling the curriculum, re-researching — is
      announced as such.
  - requirement: LEARN-A-5
    behaviour: >
      The request to skip the maths is answered without delivering any module
      before its prerequisites. Depth, pacing and framing change; order does
      not.
  - requirement: ORCH-8
    behaviour: >
      The agent does not restart the pipeline in response to the signal: no new
      discovery, no re-invocation, no second parallel curriculum.
  - requirement: LEARN-A-9
    behaviour: >
      The failed concept returns in the very next session's retrieval slot, and
      again later in the journey, rather than at its previously scheduled
      interval.
  - requirement: LEARN-12
    behaviour: >
      Later sessions keep reintroducing earlier concepts and keep requiring an
      attempt before the answer, including for concepts the learner got right.
  - requirement: LEARN-AS-3
    behaviour: >
      When the learner asks for the answer without guessing, the agent still
      requires an attempt — offering a smaller step, a hint or a simpler case —
      before evaluating or revealing anything.
  - requirement: LEARN-AS-2
    behaviour: >
      Assessment tasks ask the learner to explain, transfer, predict or critique
      on an unseen case, not to recognise a definition among options.
  - requirement: LEARN-AS-4
    behaviour: >
      The assessment result is reported per concept and names the weakness
      plainly, rather than as a score or an encouraging summary.

fail_conditions:
  - The agent moves to the application modules while a prerequisite the learner
    just failed remains untaught or unverified.
  - The correct answer is supplied without any attempt, at the retrieval slot or
    at the assessment question.
  - The failed answer is accepted, glossed over, or treated as close enough, and
    the journey continues at the same pace.
  - The agent responds to the signal by starting over — new discovery questions,
    a new subject scope, or a second curriculum alongside the first.
  - The assessment reports an aggregate verdict ("you are doing well") without
    naming the concept the learner does not hold.

pass_criteria:
  - A reviewer can point to the specific later modules that changed, and to the
    statement of what changed and why.
  - Between the failed recall and the end of the transcript, the base-rate
    concept is asked back at least twice, each time with an attempt required
    first.
  - Nothing in the adapted path is delivered before its prerequisites, and the
    learner has been told plainly which concept is still weak.
